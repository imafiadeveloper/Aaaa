function playSound(type) {
  if (!soundOn) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    if (type === 'tick') {
      osc.type = 'sine'; osc.frequency.setValueAtTime(800, audioCtx.currentTime);

// House Controlled 10% Win Rate Engine
function calculateDiceRoll(slot, forcedOutcome = null) {
  let d1, d2, d3;

  if (forcedOutcome === 'Small') {
    d1 = 1; d2 = 2; d3 = 4; // Sum 7 (Small, Odd)
  } else if (forcedOutcome === 'Big') {
    d1 = 4; d2 = 5; d3 = 5; // Sum 14 (Big, Even)
  } else if (forcedOutcome === 'Even') {
    d1 = 2; d2 = 4; d3 = 6; // Sum 12 (Big, Even)
  } else if (forcedOutcome === 'Odd') {
    d1 = 1; d2 = 3; d3 = 5; // Sum 9 (Small, Odd)
  } else {
    const seed = (slot * 9301 + 49297) % 233280;
    d1 = (seed % 6) + 1;
    d2 = ((seed * 2) % 6) + 1;
    d3 = ((seed * 3) % 6) + 1;
  }

  const sum = d1 + d2 + d3;
  const isTriple = (d1 === d2 && d2 === d3);
  let size = isTriple ? 'Triple' : (sum >= 11 ? 'Big' : 'Small');
  let parity = (sum % 2 === 0) ? 'Even' : 'Odd';

  return { d1, d2, d3, sum, size, parity, isTriple };
}

    if (lastSlot !== -1 && slot !== lastSlot) {

    lastSlot = slot;
    currentPeriod = getPeriodId(slot);
    document.getElementById('periodText').textContent = currentPeriod.slice(-7);
    document.getElementById('timerClock').textContent = `${secLeft}s`;

    // Last 5 Seconds: Rattle cup smoothly without blocking the screen
    if (secLeft <= 5) {
      isBettingClosed = true;
      document.getElementById('cupBox').classList.add('shake');
      playSound('shake');
      if (secLeft > 0) playSound('tick');
    } else {
      isBettingClosed = false;
      document.getElementById('cupBox').classList.remove('shake');
      if (secLeft >= 22) {
        document.getElementById('d1').textContent = '?';
        document.getElementById('d2').textContent = '?';
        document.getElementById('d3').textContent = '?';
        document.getElementById('scoreBadge').textContent = 'Shake Result: Ready';
        document.querySelectorAll('.bet-badge-dot').forEach(el => el.style.display = 'none');
        myActiveBets = {};
      }
    }
  }, 250);
}

async function resolveRoundOutcome(slot) {
  const periodId = getPeriodId(slot);

  // House Controlled 10% Real Player Win Rate
  let forcedOutcome = null;
  const hasBets = Object.keys(myActiveBets).length > 0;

  if (hasBets) {
    const isPlayerLucky = (Math.random() < 0.10); // 10% Win Cap
    if (!isPlayerLucky) {
      // Force opposite side
      if (myActiveBets['Small']) forcedOutcome = 'Big';
      else if (myActiveBets['Big']) forcedOutcome = 'Small';
      else if (myActiveBets['Even']) forcedOutcome = 'Odd';
      else if (myActiveBets['Odd']) forcedOutcome = 'Even';
      else forcedOutcome = 'Small';
    } else {
      const keys = Object.keys(myActiveBets);
      forcedOutcome = keys[0];
    }
  }

  const res = calculateDiceRoll(slot, forcedOutcome);

  document.getElementById('d1').textContent = diceSymbols[res.d1];
  document.getElementById('d2').textContent = diceSymbols[res.d2];
  document.getElementById('d3').textContent = diceSymbols[res.d3];
  document.getElementById('scoreBadge').textContent = `Total: ${res.sum} (${res.size} / ${res.parity})`;

  // Save in Firestore
  try {
    const ref = doc(db, RESULT_COLLECTION, periodId);
    await runTransaction(db, async (tx) => {
      const ex = await tx.get(ref);
      if (!ex.exists()) tx.set(ref, { period: periodId, ...res, createdAt: serverTimestamp() });
    });
  } catch(e){}

  await resolveBets(periodId, res);
  loadGameHistory();
  loadMyHistory();
}

async function resolveBets(periodId, res) {
  if (!currentUser) return;
  try {
    const q = query(collection(db, BET_COLLECTION), where('userId', '==', currentUser.uid), where('period', '==', periodId));
    const snap = await getDocs(q);
    if (snap.empty) return;
    let winTotal = 0, lostTotal = 0, hasPending = false;
    const batch = [];

    snap.forEach(d => {
      const b = d.data();
      if (b.status !== 'pending') return;
      hasPending = true;
      let won = false;
      if (b.type === 'size' && b.choice === res.size) won = true;
      else if (b.type === 'parity' && b.choice === res.parity) won = true;
      else if (b.type === 'triple' && res.isTriple) won = true;

      let winAmt = 0;
      if (won) {
        winAmt = b.amount * b.payoutMultiplier;
        winTotal += winAmt;
      } else {
        lostTotal += b.amount;
      }
      batch.push(updateDoc(doc(db, BET_COLLECTION, d.id), { status: won ? 'win' : 'lose', winAmount: winAmt, rollSum: res.sum }));
    });

    if (!hasPending) return;
    await Promise.all(batch);

    if (winTotal > 0) {
      await updateDoc(doc(db, 'users', currentUser.uid), { balance: increment(winTotal) });
      userBalance += winTotal;
      document.getElementById('balanceVal').textContent = userBalance.toFixed(2);
      showResultPopup(true, winTotal, `${res.sum} (${res.size})`);
    } else if (lostTotal > 0) {
      showResultPopup(false, lostTotal, `${res.sum} (${res.size})`);
    }
  } catch(e){}
}

function showResultPopup(isWin, amt, resStr) {
  const pop = document.getElementById('resultPopup');
  const card = document.getElementById('resCard');
  card.className = `res-card ${isWin ? 'win' : 'lose'}`;
  document.getElementById('resIcon').textContent = isWin ? '🎲' : '💀';
  document.getElementById('resTitle').textContent = isWin ? `ROLL ${resStr} (WON!)` : `ROLL ${resStr} (LOST)`;
  document.getElementById('resAmt').textContent = (isWin ? '+₹' : '-₹') + Number(amt).toFixed(2);
  pop.classList.add('show');
  playSound(isWin ? 'win' : 'lose');
}
window.closePopup = () => document.getElementById('resultPopup').classList.remove('show');

window.openBetModal = (choice, type, multi) => {
  if (isBettingClosed) return toast('Dice rolling! Wait for next round');
  selectedChoice = choice; selectedType = type; payoutMultiplier = multi;
  document.getElementById('sheetChoice').textContent = `${choice.toUpperCase()} (${multi}X)`;
  document.getElementById('betModal').classList.add('show');
  updateTotalBetSpan();
};
window.closeBetModal = () => document.getElementById('betModal').classList.remove('show');

window.setAmt = (el, amt) => {
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active'); baseAmt = amt; updateTotalBetSpan();
};
window.setQty = (delta) => {
  currentQty = Math.max(1, currentQty + delta);
  document.getElementById('qtyVal').value = currentQty; updateTotalBetSpan();
};
function updateTotalBetSpan() { document.getElementById('totalBetSpan').textContent = baseAmt * currentQty; }

window.placeBet = async () => {
  if (isBettingClosed) return toast('Betting closed for current roll');
  const total = baseAmt * currentQty;
  if (total > userBalance) return toast('Insufficient balance');

  const btn = document.getElementById('btnPlaceBet');
  btn.disabled = true;
  btn.textContent = 'PLACING...';

  try {
    await updateDoc(doc(db, 'users', currentUser.uid), { balance: increment(-total) });
    userBalance -= total;
    document.getElementById('balanceVal').textContent = userBalance.toFixed(2);

    await addDoc(collection(db, BET_COLLECTION), {
      userId: currentUser.uid,
      period: currentPeriod,
      choice: selectedChoice,
      type: selectedType,
      amount: total,
      payoutMultiplier: payoutMultiplier,
      status: 'pending',
      createdAt: serverTimestamp()
    });

    myActiveBets[selectedChoice] = (myActiveBets[selectedChoice] || 0) + total;
    const dot = document.getElementById(`dot-${selectedChoice}`);
    if (dot) {
      dot.textContent = `₹${myActiveBets[selectedChoice]}`;
      dot.style.display = 'block';
    }

    toast(`Bet placed on ${selectedChoice}!`);
    closeBetModal();
    loadMyHistory();
  } catch(e) {
    toast('Error placing bet');
  } finally {
    btn.disabled = false;
    btn.textContent = `CONFIRM BET ₹${baseAmt * currentQty}`;
  }
};

async function loadGameHistory() {
  const gList = document.getElementById('gameList');
  try {
    const q = query(collection(db, RESULT_COLLECTION), limit(20));
    const snap = await getDocs(q);
    let arr = [];
    snap.forEach(d => arr.push(d.data()));
    arr.sort((a,b) => (b.period||'').localeCompare(a.period||''));
    gList.innerHTML = arr.slice(0, 8).map(d => `
      <div class="table-row">
        <div class="col" style="font-family:'Orbitron',sans-serif;font-size:10px;">${d.period.slice(-5)}</div>
        <div class="col" style="font-size:16px;">${diceSymbols[d.d1]}${diceSymbols[d.d2]}${diceSymbols[d.d3]}</div>
        <div class="col" style="color:var(--gold);font-weight:900;">${d.sum}</div>
        <div class="col" style="font-weight:900;color:${d.size==='Big'?'var(--red)':'var(--blue)'};">${d.size}</div>
      </div>
    `).join('');
  } catch(e){}
}

async function loadMyHistory() {
  const myView = document.getElementById('myList');
  try {
    const q = query(collection(db, BET_COLLECTION), where('userId', '==', currentUser.uid), limit(20));
    const snap = await getDocs(q);
    if (snap.empty) { myView.innerHTML = '<div style="text-align:center;color:#777;padding:15px;font-size:11px;">No bets found</div>'; return; }
    let arr = [];
    snap.forEach(d => arr.push(d.data()));
    arr.sort((a,b) => (b.createdAt?.toMillis()||0) - (a.createdAt?.toMillis()||0));
    myView.innerHTML = arr.slice(0, 8).map(b => `
      <div class="table-row">
        <div class="col" style="font-size:10px;">${b.period.slice(-5)}</div>
        <div class="col" style="font-weight:800;">${b.choice}</div>
        <div class="col">₹${b.amount}</div>
        <div class="col" style="font-weight:800;color:${b.status==='win'?'var(--green)':(b.status==='lose'?'var(--red)':'var(--gold)')};">
          ${b.status==='win'?'+₹'+Number(b.winAmount).toFixed(2):(b.status==='lose'?'-₹'+b.amount:'Pending')}
        </div>
      </div>
    `).join('');
  } catch(e){}
}

window.switchTab = (tab, el) => {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('gameView').style.display = tab === 'game' ? 'block' : 'none';
  document.getElementById('myView').style.display = tab === 'my' ? 'block' : 'none';
};
</script>
