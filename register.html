<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = { apiKey: "AIzaSyADbcwPjDhg2ATFc9nMhstV8o1gD18WMw0", authDomain: "airavattt.firebaseapp.com", databaseURL: "https://airavattt-default-rtdb.firebaseio.com", projectId: "airavattt", storageBucket: "airavattt.appspot.com", messagingSenderId: "906559825335", appId: "1:906559825335:web:0c11437318fbd2aec4b432" };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.togglePass = function(inputId, iconId) {
        var x = document.getElementById(inputId); var y = document.getElementById(iconId);
        if (x.type === "password") { x.type = "text"; y.src="./index_files/eyeVisible-7bc1c956.png"; } 
        else { x.type = "password"; y.src="./index_files/eyeInvisible-2fa5c152.png"; }
    }

    document.getElementById('registerBtn').addEventListener('click', async (e) => {
        e.preventDefault();
        let phone = document.getElementById('regUsername').value.trim();
        let password = document.getElementById('regPassword').value.trim();
        let invite = document.getElementById('regInvite').value.trim();
        if (!phone || !password || !invite) { alert("Please fill in all fields"); return; }
        
        let btn = e.target; btn.innerText = "Registering..."; btn.disabled = true;

        try {
            const dbRef = ref(db);
            const snapshot = await get(child(dbRef, `users/${phone}`));
            
            if (snapshot.exists()) { alert("Phone number already registered"); btn.innerText = "Register"; btn.disabled = false; return; }

            await set(ref(db, `users/${phone}`), {
                phone: phone, password: password, invite_code: invite, balance: 0, status: "active", created_at: new Date().toISOString()
            });

            alert("Registration successful! Please log in.");
            window.location.href = 'index.html';
        } catch (error) {
            alert("Database error."); btn.innerText = "Register"; btn.disabled = false;
        }
    });
</script>
