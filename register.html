<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyADbcwPjDhg2ATFc9nMhstV8o1gD18WMw0",
      authDomain: "airavattt.firebaseapp.com",
      databaseURL: "https://airavattt-default-rtdb.firebaseio.com",
      projectId: "airavattt",
      storageBucket: "airavattt.appspot.com",
      messagingSenderId: "906559825335",
      appId: "1:906559825335:web:0c11437318fbd2aec4b432"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Password Show/Hide
    window.togglePass = function(inputId, iconId) {
        var x = document.getElementById(inputId);
        var y = document.getElementById(iconId);
        if (x.type === "password") {
            x.type = "text"; y.src="./index_files/eyeVisible-7bc1c956.png";
        } else {
            x.type = "password"; y.src="./index_files/eyeInvisible-2fa5c152.png";
        }
    }

    // Alert Message
    function alertMess(text) {
        let length = $('.alert-toast .msg').length;
        if (length == 0) {
            $('.alert-toast').append(`<div class="msg"><div class="msg-content" style="display:block; color:white; background:rgba(0,0,0,0.8); padding:10px; border-radius:5px; font-size:14px;"> ${text} </div></div>`);
            setTimeout(() => { $('.msg').fadeOut(); setTimeout(() => { $('.alert-toast .msg').remove(); }, 100); }, 2500);
        }
    }

    // Register Logic
    document.getElementById('registerBtn').addEventListener('click', async (e) => {
        e.preventDefault();
        let phone = document.getElementById('regUsername').value.trim();
        let password = document.getElementById('regPassword').value.trim();
        let invite = document.getElementById('regInvite').value.trim();

        if (!phone || !password || !invite) { alertMess("Please fill in all fields"); return; }
        
        $('.van-overlay').fadeIn(10);
        let btn = e.target;
        btn.innerText = "Registering..."; btn.disabled = true;

        try {
            const dbRef = ref(db);
            const snapshot = await get(child(dbRef, `users/${phone}`));
            
            if (snapshot.exists()) {
                $('.van-overlay').fadeOut(300);
                alertMess("Phone number already registered");
                btn.innerText = "Register"; btn.disabled = false; return;
            }

            await set(ref(db, `users/${phone}`), {
                phone: phone,
                password: password,
                invite_code: invite,
                balance: 0,
                status: "active",
                created_at: new Date().toISOString()
            });

            $('.van-overlay').fadeOut(300);
            alertMess("Registration successful! Please log in.");
            setTimeout(() => { window.location.href = 'index.html'; }, 1500);

        } catch (error) {
            console.error(error);
            $('.van-overlay').fadeOut(300);
            alertMess("Database error.");
            btn.innerText = "Register"; btn.disabled = false;
        }
    });
</script>
