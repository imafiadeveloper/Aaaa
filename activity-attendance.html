<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#141416">
<title>BDG GAME — Attendance Bonus</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',sans-serif;}
body{background-color:#141416;color:#fff;padding-bottom:30px;-webkit-tap-highlight-color:transparent;}
button{cursor:pointer;border:none;outline:none;background:transparent;}

.navbar{position:sticky;top:0;z-index:100;background:rgba(20,20,22,0.95);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:54px;border-bottom:1px solid rgba(255,255,255,0.06);}
.navbar-left{width:36px;height:36px;display:flex;align-items:center;cursor:pointer;}
.navbar-left svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2.4;}
.navbar-title{font-size:16px;font-weight:700;}

.check-box{padding:16px;}
.check-header{text-align:center;margin-bottom:20px;}
.check-header h4{font-size:20px;font-weight:800;margin-bottom:8px;background:linear-gradient(180deg,#FFE793 0%,#C48E2F 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.check-header p{font-size:12px;color:#8f929b;}

.list{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.item{ 
    background:#202024;border:1px solid rgba(255,255,255,0.06);border-radius:14px;padding:14px 10px;
    text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;
    box-shadow:0 6px 16px rgba(0,0,0,0.3);
}
.item.action{cursor:pointer;border-color:rgba(250,229,159,0.3);}
.item.action:active{transform:scale(0.96);border-color:#FAE59F;}
.item.disabled{opacity:0.4;pointer-events:none;}

.item .num{font-family:'Orbitron',sans-serif;font-size:18px;font-weight:800;color:#FAE59F;margin-bottom:6px;}
.item .gift-icon{width:42px;height:42px;margin-bottom:8px;}
.item .txt{font-size:11px;color:#291a03;background:linear-gradient(180deg,#FFE793 0%,#C48E2F 100%);padding:5px 10px;border-radius:20px;font-weight:800;display:inline-block;width:100%;}

.item.received{background:#18181a;border-color:rgba(255,255,255,0.03);}
.item.received .num{color:#555;}
.item.received .gift-icon{filter:grayscale(100%);opacity:0.4;}
.item.received .txt{background:#2a2a2e;color:#777;}

.item:nth-child(7){ 
    grid-column:span 3;flex-direction:row;justify-content:space-between;padding:16px 20px;
    background:linear-gradient(135deg,#C48E2F 0%,#FFE793 100%);border:none;
}
.item:nth-child(7) .num{color:#291a03;font-size:24px;margin-bottom:0;}
.item:nth-child(7) .gift-icon{width:50px;height:50px;margin:0;}
.item:nth-child(7) .txt{background:#291a03;color:#FAE59F;font-size:13px;width:auto;padding:8px 18px;}
.item:nth-child(7).received{background:#18181a;}
.item:nth-child(7).received .num{color:#555;}
.item:nth-child(7).received .txt{background:#2a2a2e;color:#777;}

.toast{position:fixed;top:30%;left:50%;transform:translateX(-50%) translateY(-10px);background:rgba(20,20,22,0.96);border:1px solid rgba(250,229,159,0.3);color:#fff;font-size:13px;font-weight:600;padding:10px 20px;border-radius:10px;opacity:0;pointer-events:none;transition:all .25s ease;z-index:9999;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<header class="navbar">
  <div class="navbar-left" onclick="location.href='activity.html'"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></div>
  <div class="navbar-title">Attendance Bonus</div>
  <div style="width:36px;"></div>
</header>

<div class="check-box">
  <div class="check-header">
    <h4>7 Days Attendance Bonus</h4>
    <p>Sign in consecutive days to receive massive grand rewards</p>
  </div>

  <div class="list" id="checkinList">
    <div class="item action" data-day="1" onclick="claimBonus(1, 5)">
      <div class="num">₹5</div>
      <svg class="gift-icon" viewBox="0 0 24 24" fill="none" stroke="#FAE59F" stroke-width="2"><path d="M20 12v10H4V12M2 7h20v5H2zM12 22V7M12 7H7.5a2.5 2.5 0 010-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 000-5C13 2 12 7 12 7z"/></svg>
      <span class="txt">Claim</span>
    </div>
    <div class="item action" data-day="2" onclick="claimBonus(2, 10)">
      <div class="num">₹10</div>
      <svg class="gift-icon" viewBox="0 0 24 24" fill="none" stroke="#FAE59F" stroke-width="2"><path d="M20 12v10H4V12M2 7h20v5H2zM12 22V7M12 7H7.5a2.5 2.5 0 010-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 000-5C13 2 12 7 12 7z"/></svg>
      <span class="txt">Claim</span>
    </div>
    <div class="item action" data-day="3" onclick="claimBonus(3, 15)">
      <div class="num">₹15</div>
      <svg class="gift-icon" viewBox="0 0 24 24" fill="none" stroke="#FAE59F" stroke-width="2"><path d="M20 12v10H4V12M2 7h20v5H2zM12 22V7M12 7H7.5a2.5 2.5 0 010-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 000-5C13 2 12 7 12 7z"/></svg>
      <span class="txt">Claim</span>
    </div>
    <div class="item action" data-day="4" onclick="claimBonus(4, 20)">
      <div class="num">₹20</div>
      <svg class="gift-icon" viewBox="0 0 24 24" fill="none" stroke="#FAE59F" stroke-width="2"><path d="M20 12v10H4V12M2 7h20v5H2zM12 22V7M12 7H7.5a2.5 2.5 0 010-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 000-5C13 2 12 7 12 7z"/></svg>
      <span class="txt">Claim</span>
    </div>
    <div class="item action" data-day="5" onclick="claimBonus(5, 25)">
      <div class="num">₹25</div>
      <svg class="gift-icon" viewBox="0 0 24 24" fill="none" stroke="#FAE59F" stroke-width="2"><path d="M20 12v10H4V12M2 7h20v5H2zM12 22V7M12 7H7.5a2.5 2.5 0 010-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 000-5C13 2 12 7 12 7z"/></svg>
      <span class="txt">Claim</span>
    </div>
    <div class="item action" data-day="6" onclick="claimBonus(6, 30)">
      <div class="num">₹30</div>
      <svg class="gift-icon" viewBox="0 0 24 24" fill="none" stroke="#FAE59F" stroke-width="2"><path d="M20 12v10H4V12M2 7h20v5H2zM12 22V7M12 7H7.5a2.5 2.5 0 010-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 000-5C13 2 12 7 12 7z"/></svg>
      <span class="txt">Claim</span>
    </div>
    <div class="item action" data-day="7" onclick="claimBonus(7, 35)">
      <div class="num">₹35</div>
      <svg class="gift-icon" viewBox="0 0 24 24" fill="none" stroke="#291a03" stroke-width="2"><path d="M20 12v10H4V12M2 7h20v5H2zM12 22V7M12 7H7.5a2.5 2.5 0 010-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 000-5C13 2 12 7 12 7z"/></svg>
      <span class="txt">Claim Grand Bonus</span>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, updateDoc, increment, arrayUnion, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAVQh9b7L3IYgWFIYA3wWorVBk1uXRFDZo",
  authDomain: "bdglottery7.firebaseapp.com",
  projectId: "bdglottery7",
  storageBucket: "bdglottery7.firebasestorage.app",
  messagingSenderId: "568771943906",
  appId: "1:568771943906:web:5b78078d9c0d67427dedbb"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
const toastEl = document.getElementById('toast');
window.toast = (msg) => {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 2200);
};

onAuthStateChanged(auth, async (user) => {
  if (user) {
    currentUser = user;
    const snap = await getDoc(doc(db, "users", user.uid));
    if (snap.exists()) {
      const data = snap.data();
      const claimedDays = data.claimedAttendanceDays || [];
      claimedDays.forEach(day => {
        const el = document.querySelector(`.item[data-day="${day}"]`);
        if (el) {
          el.classList.remove('action');
          el.classList.add('received');
          el.querySelector('.txt').textContent = 'Claimed ✓';
        }
      });

      const todayStr = new Date().toDateString();
      const lastClaimStr = data.lastAttendanceDate ? new Date(data.lastAttendanceDate.toDate ? data.lastAttendanceDate.toDate() : data.lastAttendanceDate).toDateString() : null;
      if (lastClaimStr === todayStr) {
        document.querySelectorAll('.item.action').forEach(el => {
          el.classList.remove('action');
          el.classList.add('disabled');
          el.querySelector('.txt').textContent = 'Come Back Tomorrow';
        });
      }
    }
  } else {
    location.replace("index.html");
  }
});

window.claimBonus = async (day, amount) => {
  if (!currentUser) return;
  const el = document.querySelector(`.item[data-day="${day}"]`);
  if (!el || !el.classList.contains('action')) return;

  try {
    toast("Claiming bonus...");
    el.classList.remove('action');
    el.classList.add('disabled');

    await updateDoc(doc(db, "users", currentUser.uid), {
      balance: increment(amount),
      totalBonus: increment(amount),
      claimedAttendanceDays: arrayUnion(day),
      lastAttendanceDate: serverTimestamp()
    });

    await addDoc(collection(db, "transactions"), {
      userId: currentUser.uid,
      type: "bonus",
      title: `Attendance Day ${day} Bonus`,
      amount: amount,
      status: "success",
      createdAt: serverTimestamp()
    });

    el.classList.add('received');
    el.querySelector('.txt').textContent = 'Claimed ✓';
    toast(`₹${amount} added to your balance!`);
  } catch (error) {
    toast("Claim failed. Please try again.");
  }
};
</script>
</body>
</html>
