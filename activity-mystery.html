<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#181818">
<title>BDG GAME - Mystery Bonus</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Orbitron:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --gold: #FAE59F;
  --bg-main: #141416;
  --card-bg: #202024;
  --border: rgba(255,255,255,0.06);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:'Inter',sans-serif;}
body{background:var(--bg-main);color:#fff;min-height:100vh;padding-bottom:30px;}
button{border:none;outline:none;cursor:pointer;background:transparent;color:inherit;}

.navbar{position:sticky;top:0;z-index:100;height:52px;background:#18181a;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--border);}
.nav-left{width:32px;height:32px;display:flex;align-items:center;cursor:pointer;}
.nav-left svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2.4;}
.navbar-title{font-size:16px;font-weight:700;flex:1;text-align:center;margin-right:32px;}

.banner-wrap{margin:12px 14px;}
.top-banner{width:100%;border-radius:14px;display:block;}
.brand-strip{text-align:center;padding:10px 0;}
.brand-strip h2{font-family:'Orbitron',sans-serif;color:var(--gold);font-size:18px;letter-spacing:1px;}

.detail-card{
  margin:0 14px 14px;background:#202024;border-radius:16px;padding:16px;
  border:1px solid var(--border);position:relative;
}
.dc-header{display:flex;justify-content:space-between;align-items:flex-start;}
.dc-sub{font-size:11px;color:var(--gold);font-weight:700;text-transform:uppercase;display:flex;align-items:center;gap:4px;}
.dc-title{font-size:18px;font-weight:800;margin-top:4px;}
.dc-desc{font-size:12px;color:#8f929b;margin-top:2px;}
.dc-badge{text-align:right;}
.dc-badge span{font-size:10px;color:var(--gold);font-weight:700;}
.dc-badge h1{font-family:'Orbitron',sans-serif;font-size:32px;color:var(--gold);line-height:1;}
.dc-timing{
  display:flex;justify-content:space-between;align-items:center;margin-top:16px;
  padding-top:12px;border-top:1px dashed rgba(255,255,255,0.1);font-size:12px;color:#8f929b;
}

.telegram-card{
  margin:0 14px 16px;background:#202024;border-radius:14px;padding:14px 16px;
  display:flex;align-items:center;gap:12px;border:1px solid var(--border);cursor:pointer;
}
.tg-icon{width:40px;height:40px;border-radius:50%;background:#0088cc;display:flex;align-items:center;justify-content:center;font-size:20px;}
.tg-info h4{font-size:13px;font-weight:700;}
.tg-info p{font-size:11px;color:var(--gold);margin-top:2px;}

.section-label{padding:0 14px 10px;font-size:14px;font-weight:800;display:flex;align-items:center;gap:6px;}
.reward-card{margin:0 14px;background:#202024;border-radius:14px;padding:16px;border:1px solid var(--border);}
.rc-tag{font-size:10px;color:var(--gold);font-weight:800;letter-spacing:0.5px;}
.rc-amount{font-family:'Orbitron',sans-serif;font-size:24px;font-weight:900;color:var(--gold);margin-top:6px;}

.btn-claim{
  width:calc(100% - 28px);height:48px;margin:20px 14px 0;border-radius:14px;
  background:linear-gradient(180deg,#F9DC8A 0%,#D8AA4D 100%);color:#221500;
  font-size:15px;font-weight:900;letter-spacing:0.5px;
}
.toast{position:fixed;top:30%;left:50%;transform:translateX(-50%);background:rgba(20,20,22,0.96);border:1px solid var(--gold);color:#fff;font-size:13px;font-weight:700;padding:10px 20px;border-radius:8px;display:none;z-index:9999;}
</style>
</head>
<body>

<header class="navbar">
  <div class="nav-left" onclick="location.href='activity.html'"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></div>
  <div class="navbar-title">Activity details</div>
</header>

<div class="banner-wrap">
  <img src="./images/Banner_20261027220752j3bs.png" class="top-banner" onerror="this.src='./images/banner2.png'">
</div>

<div class="brand-strip">
  <h2>BDG GAME</h2>
</div>

<div class="detail-card">
  <div class="dc-header">
    <div>
      <div class="dc-sub">🎁 BDG REWARDS</div>
      <div class="dc-title">Mystery bonus</div>
      <div class="dc-desc">Random rewards from time to time</div>
    </div>
    <div class="dc-badge">
      <span>🎁 BONUS</span>
      <h1>2</h1>
      <span style="color:#8f929b;">TYPES</span>
    </div>
  </div>
  <div class="dc-timing">
    <span>⏱️ Timing</span>
    <strong style="color:#fff;">No fixed schedule</strong>
  </div>
</div>

<div class="telegram-card" onclick="window.open('https://t.me/bigdaddygame','_blank')">
  <div class="tg-icon">✈️</div>
  <div class="tg-info">
    <h4>Follow our Telegram channel</h4>
    <p>@bigdaddygame</p>
  </div>
</div>

<div class="section-label">🎁 Mystery bonus 1</div>
<div class="reward-card">
  <div class="rc-tag">RANDOM CASH REWARDS</div>
  <div class="rc-amount">₹1 — ₹9,999,999</div>
</div>

<button class="btn-claim" id="claimBtn" onclick="claimMysteryBonus()">Claim Mystery Reward</button>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, updateDoc, increment, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAVQh9b7L3IYgWFIYA3wWorVBk1uXRFDZo",
  authDomain: "bdglottery7.firebaseapp.com",
  projectId: "bdglottery7",
  storageBucket: "bdglottery7.firebasestorage.app",
  messagingSenderId: "568771943906",
  appId: "1:568771943906:web:5b78078d9c0d67427dedbb"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
window.toast = (msg) => { const t = document.getElementById('toast'); t.textContent = msg; t.style.display='block'; setTimeout(()=>t.style.display='none', 2000); };

onAuthStateChanged(auth, (user) => { if(user) currentUser = user; });

window.claimMysteryBonus = async () => {
  if(!currentUser) return toast('Please login first');
  const bonus = Math.floor(Math.random() * 20) + 5; // ₹5 to ₹25
  const btn = document.getElementById('claimBtn');
  btn.disabled = true;
  try {
    await updateDoc(doc(db, 'users', currentUser.uid), { balance: increment(bonus), totalBonus: increment(bonus) });
    await addDoc(collection(db, 'transactions'), {
      userId: currentUser.uid, type: 'bonus', title: 'Mystery Random Bonus', amount: bonus, status: 'success', createdAt: serverTimestamp()
    });
    toast(`Mystery Bonus ₹${bonus} credited to balance!`);
  } catch(e){ toast('Bonus already claimed today'); }
  finally { btn.disabled = false; }
};
</script>
</body>
</html>
