<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f1115">
<title>BDG LOTTERY7 - Aviator</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent;}
body{background:#0f1115;color:#fff;min-height:100vh;overflow-x:hidden;display:flex;flex-direction:column;}

/* Navbar */
.navbar{display:flex;justify-content:space-between;align-items:center;height:56px;padding:0 16px;background:#1a1d24;border-bottom:1px solid #333;position:sticky;top:0;z-index:100;}
.navbar-brand{font-size:18px;font-weight:900;color:#FAE59F;letter-spacing:1px;}
.navbar-right{display:flex;gap:12px;align-items:center;}
.nav-icon{width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;}
.nav-icon svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;}

/* Balance */
.bal-box{background:#1a1d24;margin:16px;border-radius:16px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border:1px solid #2a2d35;}
.bal-box span{color:#a6a9ae;font-size:12px;}
.bal-box h2{color:#FAE59F;font-size:22px;font-weight:900;}

/* Game Area */
.game-wrapper{position:relative;margin:0 16px;height:300px;background:#000;border-radius:16px;overflow:hidden;border:1px solid #333;display:flex;flex-direction:column;align-items:center;justify-content:center;}
#graphCanvas{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1;}
.plane{position:absolute;width:60px;height:40px;z-index:2;transition:transform 0.1s linear;transform-origin:center;}
.plane svg{width:100%;height:100%;filter:drop-shadow(0 0 10px #fd565c);}
.multiplier-display{position:relative;z-index:10;font-size:56px;font-weight:900;color:#fff;text-shadow:0 0 20px rgba(255,255,255,0.2);}
.multiplier-display.crashed{color:#fd565c;animation:shake 0.5s;}
@keyframes shake{0%{transform:translateX(0);}25%{transform:translateX(10px);}50%{transform:translateX(-10px);}75%{transform:translateX(10px);}100%{transform:translateX(0);}}
.status-text{position:relative;z-index:10;font-size:14px;color:#a6a9ae;margin-top:10px;font-weight:600;}

/* Controls */
.controls{margin:16px;display:flex;gap:12px;}
.control-col{flex:1;background:#1a1d24;border-radius:16px;padding:12px;border:1px solid #2a2d35;display:flex;flex-direction:column;gap:8px;}
.input-group{display:flex;background:#0f1115;border-radius:8px;overflow:hidden;border:1px solid #444;}
.input-group button{background:#2a2d35;color:#fff;border:none;width:36px;font-size:18px;cursor:pointer;font-weight:bold;}
.input-group input{flex:1;background:transparent;border:none;color:#fff;text-align:center;font-size:16px;font-weight:700;padding:10px 0;outline:none;}
.action-btn{width:100%;height:50px;border-radius:10px;background:linear-gradient(180deg,#40ad72 0%,#25874b 100%);color:#fff;font-size:18px;font-weight:900;border:none;cursor:pointer;box-shadow:0 4px 15px rgba(64,173,114,0.4);transition:transform 0.1s;}
.action-btn:active{transform:scale(0.97);}
.action-btn.cashout{background:linear-gradient(180deg,#FAE59F 0%,#C4933F 100%);color:#3a2a10;box-shadow:0 4px 15px rgba(250,229,159,0.4);}
.action-btn:disabled{opacity:0.5;}

/* Auto Cashout Toggle */
.auto-row{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:#a6a9ae;}
.switch{position:relative;display:inline-block;width:36px;height:20px;}
.switch input{opacity:0;width:0;height:0;}
.slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background-color:#555;transition:.4s;border-radius:20px;}
.slider:before{position:absolute;content:"";height:14px;width:14px;left:3px;bottom:3px;background-color:#fff;transition:.4s;border-radius:50%;}
input:checked + .slider{background-color:#40ad72;}
input:checked + .slider:before{transform:translateX(16px);}

/* Live Bets */
.live-bets{margin:0 16px 20px;background:#1a1d24;border-radius:16px;border:1px solid #2a2d35;overflow:hidden;}
.lb-head{background:#2a2d35;padding:10px 16px;font-size:12px;font-weight:700;display:flex;justify-content:space-between;color:#a6a9ae;}
.lb-list{height:150px;overflow-y:auto;padding:8px 16px;display:flex;flex-direction:column;gap:6px;}
.lb-item{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.05);}
.lb-item .user{color:#fff;}
.lb-item .amt{color:#FAE59F;font-weight:700;}
.lb-item .win{color:#40ad72;font-weight:700;}

/* History */
.history-bar{display:flex;gap:6px;overflow-x:auto;padding:0 16px 16px;}
.history-bar::-webkit-scrollbar{display:none;}
.h-bar-item{background:#1a1d24;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700;border:1px solid #333;white-space:nowrap;}
.h-bar-item.low{color:#fd565c;border-color:rgba(253,86,92,0.3);}
.h-bar-item.high{color:#40ad72;border-color:rgba(64,173,114,0.3);}

.toast{position:fixed;top:10%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.9);color:#fff;padding:12px 24px;border-radius:10px;font-size:14px;z-index:9999;display:none;text-align:center;font-weight:600;}

/* Popup */
.result-popup{position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:10000;display:none;align-items:center;justify-content:center;padding:20px;}
.result-popup.show{display:flex;animation:fadeIn .3s ease;}
.res-box{width:100%;max-width:320px;border-radius:20px;padding:24px;text-align:center;position:relative;animation:popIn .4s cubic-bezier(.68,-0.55,.27,1.55);}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes popIn{from{transform:scale(0.5);opacity:0;}to{transform:scale(1);opacity:1;}}
.res-box.win{background:linear-gradient(160deg,#1a1d24 0%,#0f1115 100%);border:2px solid #40ad72;box-shadow:0 0 50px rgba(64,173,114,0.3);}
.res-box.lose{background:linear-gradient(160deg,#1a1d24 0%,#0f1115 100%);border:2px solid #fd565c;box-shadow:0 0 50px rgba(253,86,92,0.3);}
.res-title{font-size:22px;font-weight:900;margin-bottom:8px;}
.res-box.win .res-title{color:#40ad72;}
.res-box.lose .res-title{color:#fd565c;}
.res-amount{font-size:32px;font-weight:900;color:#FAE59F;margin-bottom:20px;}
.res-btn{width:100%;height:48px;border-radius:24px;background:#FAE59F;color:#3a2a10;font-size:16px;font-weight:700;border:none;cursor:pointer;}
</style>
</head>
<body>

<div class="navbar">
    <a href="home.html" class="nav-icon"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></a>
    <div class="navbar-brand">AVIATOR</div>
    <div class="navbar-right">
        <div class="nav-icon" id="soundBtn"><svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/></svg></div>
    </div>
</div>

<div class="bal-box">
    <div>
        <span>Total Balance</span>
        <h2>₹<span id="balanceVal">0.00</span></h2>
    </div>
    <svg viewBox="0 0 24 24" onclick="location.reload()" style="width:24px;height:24px;stroke:#a6a9ae;fill:none;stroke-width:2;cursor:pointer;"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
</div>

<div class="game-wrapper" id="gameArea">
    <canvas id="graphCanvas"></canvas>
    <div class="plane" id="plane" style="left:10%;bottom:10%;">
        <svg viewBox="0 0 64 64" fill="#fd565c"><path d="M58 32L38 28V10c0-2-2-4-4-4s-4 2-4 4v18L10 26v-6c0-1.5-1-2.5-2.5-2.5S5 18.5 5 20v12c0 1.5 1 2.5 2.5 2.5S10 33.5 10 32v-6l20 2v18c0 2 2 4 4 4s4-2 4-4V28l20-4v8c0 1.5 1 2.5 2.5 2.5S62 33.5 62 32V20c0-1.5-1-2.5-2.5-2.5S58 18.5 58 20v12z"/></svg>
    </div>
    <div class="multiplier-display" id="multiplier">0.00x</div>
    <div class="status-text" id="status">Waiting for next round...</div>
</div>

<div class="controls">
    <div class="control-col">
        <div class="input-group">
            <button onclick="changeBet(-10)">-</button>
            <input type="number" id="betAmount" value="10" readonly>
            <button onclick="changeBet(10)">+</button>
        </div>
        <button class="action-btn" id="actionBtn" onclick="handleAction()">Place Bet</button>
    </div>
    <div class="control-col">
        <div class="auto-row">
            <span>Auto Cashout</span>
            <label class="switch">
                <input type="checkbox" id="autoToggle" onchange="toggleAuto()">
                <span class="slider"></span>
            </label>
        </div>
        <div class="input-group">
            <input type="number" id="autoAmount" value="2.00" step="0.1" min="1.1" disabled>
        </div>
    </div>
</div>

<div class="history-bar" id="historyBar">
    <!-- History pills will go here -->
</div>

<div class="live-bets">
    <div class="lb-head">
        <span>Player</span>
        <span>Bet / Cashout</span>
    </div>
    <div class="lb-list" id="liveBetsList">
        <!-- Live bets will go here -->
    </div>
</div>

<!-- Result Popup -->
<div class="result-popup" id="resultPopup">
  <div class="res-box" id="resBox">
    <div class="res-title" id="resTitle">You Won!</div>
    <div class="res-amount" id="resAmount">₹0.00</div>
    <button class="res-btn" onclick="closePopup()">Continue</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, updateDoc, increment, collection, addDoc, serverTimestamp, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyAVQh9b7L3IYgWFIYA3wWorVBk1uXRFDZo", authDomain: "bdglottery7.firebaseapp.com", projectId: "bdglottery7", storageBucket: "bdglottery7.firebasestorage.app", messagingSenderId: "568771943906", appId: "1:568771943906:web:5b78078d9c0d67427dedbb" };
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let userBalance = 0;
let betAmount = 10;
let isBetting = false;
let gameState = 'waiting'; // waiting, flying, crashed
let currentMultiplier = 1.00;
let crashPoint = 1.00;
let gameInterval = null;
let currentBetId = null;
let autoCashoutValue = 0;
let autoCashoutEnabled = false;
let startTime = 0;

const canvas = document.getElementById('graphCanvas');
const ctx = canvas.getContext('2d');
const planeEl = document.getElementById('plane');
const multEl = document.getElementById('multiplier');
const statusEl = document.getElementById('status');
const actionBtn = document.getElementById('actionBtn');

function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 2000);
}

function resizeCanvas() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
}
window.addEventListener('resize', resizeCanvas);

function changeBet(amt) {
    if(isBetting || gameState === 'flying') return;
    betAmount = Math.max(10, betAmount + amt);
    document.getElementById('betAmount').value = betAmount;
}

function toggleAuto() {
    autoCashoutEnabled = document.getElementById('autoToggle').checked;
    document.getElementById('autoAmount').disabled = !autoCashoutEnabled;
    if(autoCashoutEnabled) {
        autoCashoutValue = parseFloat(document.getElementById('autoAmount').value);
    }
}

onAuthStateChanged(auth, async (user) => {
    if(!user) return location.replace('index.html');
    currentUser = user;
    const snap = await getDoc(doc(db, 'users', user.uid));
    if(snap.exists()) {
        userBalance = Number(snap.data().balance || 0);
        document.getElementById('balanceVal').textContent = userBalance.toFixed(2);
    }
    resizeCanvas();
    loadHistory();
    startWaitingPhase();
});

function startWaitingPhase() {
    gameState = 'waiting';
    isBetting = false;
    currentMultiplier = 1.00;
    multEl.textContent = '0.00x';
    multEl.className = 'multiplier-display';
    statusEl.textContent = 'Waiting for next round...';
    planeEl.style.left = '10%';
    planeEl.style.bottom = '10%';
    planeEl.style.transform = 'rotate(0deg)';
    actionBtn.textContent = 'Place Bet';
    actionBtn.className = 'action-btn';
    actionBtn.disabled = false;
    clearCanvas();
    populateLiveBets();
    
    let waitTime = 5;
    const waitInt = setInterval(() => {
        waitTime--;
        statusEl.textContent = `Starting in ${waitTime}s...`;
        if(waitTime <= 0) {
            clearInterval(waitInt);
            startFlight();
        }
    }, 1000);
}

function clearCanvas() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    // Draw grid
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 1;
    for(let i=0; i<canvas.width; i+=30) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
    }
    for(let i=0; i<canvas.height; i+=30) {
        ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
    }
}

function startFlight() {
    gameState = 'flying';
    statusEl.textContent = 'In Flight';
    multEl.textContent = '1.00x';
    
    // Determine Crash Point
    const r = Math.random();
    if(r < 0.05) crashPoint = 1.00; // 5% instant crash
    else crashPoint = Math.max(1.00, (1 / (1 - r * 0.95))); 
    
    if(crashPoint > 20) crashPoint = 20 + Math.random() * 10; // Max multiplier cap

    startTime = Date.now();
    const points = [];
    
    clearCanvas();
    
    gameInterval = setInterval(() => {
        const timePassed = (Date.now() - startTime) / 1000;
        currentMultiplier = Math.pow(1.07, timePassed * 1.5); // Exponential growth
        
        // Update UI
        multEl.textContent = currentMultiplier.toFixed(2) + 'x';
        
        // Check Auto Cashout
        if(isBetting && autoCashoutEnabled && currentMultiplier >= autoCashoutValue) {
            handleCashout();
        }

        // Draw Graph
        const x = 10 + (currentMultiplier * 15);
        const y = 10 + (currentMultiplier * 10);
        
        // Calculate plane position (Left to right, bottom to top)
        const px = Math.min((canvas.width * 0.8) * (currentMultiplier / (crashPoint > 5 ? crashPoint : 5)), canvas.width * 0.8);
        const py = Math.min((canvas.height * 0.7) * (currentMultiplier / (crashPoint > 5 ? crashPoint : 5)), canvas.height * 0.7);
        
        planeEl.style.left = `${10 + px}px`;
        planeEl.style.bottom = `${10 + py}px`;
        planeEl.style.transform = `rotate(-15deg)`;

        // Draw curve
        clearCanvas();
        ctx.beginPath();
        ctx.moveTo(10, canvas.height - 10);
        ctx.quadraticCurveTo(10 + px * 0.5, canvas.height - 10 - py * 0.5, 10 + px, canvas.height - 10 - py);
        ctx.strokeStyle = '#fd565c';
        ctx.lineWidth = 3;
        ctx.stroke();
        
        // Fill area under curve
        ctx.lineTo(10 + px, canvas.height - 10);
        ctx.lineTo(10, canvas.height - 10);
        ctx.fillStyle = 'rgba(253,86,92,0.1)';
        ctx.fill();

        if(currentMultiplier >= crashPoint) {
            crashGame();
        }
    }, 50);
}

function crashGame() {
    clearInterval(gameInterval);
    gameState = 'crashed';
    multEl.textContent = crashPoint.toFixed(2) + 'x';
    multEl.className = 'multiplier-display crashed';
    statusEl.textContent = 'FLEW AWAY!';
    planeEl.style.transform = `rotate(90deg)`;
    
    if(isBetting) {
        isBetting = false;
        currentBetId = null;
        actionBtn.textContent = 'Place Bet';
        actionBtn.className = 'action-btn';
        showResultPopup(false, betAmount);
    }
    
    addHistory(crashPoint);
    setTimeout(() => startWaitingPhase(), 3000);
}

async function handleAction() {
    if(gameState === 'waiting') {
        // PLACE BET
        betAmount = Number(document.getElementById('betAmount').value);
        if(betAmount < 10) return toast('Minimum bet ₹10');
        if(betAmount > userBalance) return toast('Insufficient balance');
        
        actionBtn.disabled = true;
        actionBtn.textContent = 'Placing...';
        
        try {
            await updateDoc(doc(db, 'users', currentUser.uid), { balance: increment(-betAmount) });
            userBalance -= betAmount;
            document.getElementById('balanceVal').textContent = userBalance.toFixed(2);
            
            const betRef = await addDoc(collection(db, 'bets_aviator'), {
                userId: currentUser.uid,
                amount: betAmount,
                status: 'pending',
                createdAt: serverTimestamp()
            });
            
            currentBetId = betRef.id;
            isBetting = true;
            actionBtn.disabled = false;
            actionBtn.textContent = 'Cashout';
            actionBtn.className = 'action-btn cashout';
            toast('Bet Placed!');
            
        } catch(e) {
            toast('Error placing bet');
            actionBtn.disabled = false;
            actionBtn.textContent = 'Place Bet';
        }
        
    } else if(gameState === 'flying' && isBetting) {
        handleCashout();
    }
}

async function handleCashout() {
    if(!isBetting) return;
    isBetting = false;
    actionBtn.disabled = true;
    actionBtn.textContent = 'Cashed Out!';
    actionBtn.className = 'action-btn';
    
    const winAmt = betAmount * currentMultiplier;
    const tax = winAmt * 0.15;
    const finalWin = winAmt - tax;
    
    toast(`Cashed out ₹${finalWin.toFixed(2)} at ${currentMultiplier.toFixed(2)}x`);
    showResultPopup(true, finalWin);
    
    await updateDoc(doc(db, 'users', currentUser.uid), { balance: increment(finalWin) });
    userBalance += finalWin;
    document.getElementById('balanceVal').textContent = userBalance.toFixed(2);
    
    if(currentBetId) {
        await updateDoc(doc(db, 'bets_aviator', currentBetId), {
            status: 'win', multiplier: currentMultiplier, winAmount: finalWin
        }).catch(()=>{});
        currentBetId = null;
    }
}

window.closePopup = () => {
    document.getElementById('resultPopup').classList.remove('show');
};

function showResultPopup(isWin, amount) {
    const popup = document.getElementById('resultPopup');
    const box = document.getElementById('resBox');
    const title = document.getElementById('resTitle');
    const amt = document.getElementById('resAmount');

    box.className = 'res-box ' + (isWin ? 'win' : 'lose');
    
    if(isWin) {
        title.textContent = 'Cashed Out!';
        amt.textContent = '+ ₹' + Number(amount).toFixed(2);
        amt.style.color = '#40ad72';
    } else {
        title.textContent = 'Flew Away!';
        amt.textContent = '- ₹' + Number(amount).toFixed(2);
        amt.style.color = '#fd565c';
    }

    popup.classList.add('show');
    setTimeout(() => popup.classList.remove('show'), 3000);
}

async function addHistory(crashPt) {
    const hList = document.getElementById('historyBar');
    const item = document.createElement('div');
    item.className = 'h-bar-item ' + (crashPt >= 2 ? 'high' : 'low');
    item.textContent = crashPt.toFixed(2) + 'x';
    hList.prepend(item);
    if(hList.children.length > 15) hList.lastChild.remove();
}

function populateLiveBets() {
    const list = document.getElementById('liveBetsList');
    let html = '';
    const names = ['Rahul', 'Aman', 'Vikas', 'Suresh', 'Ravi', 'Pooja', 'Neha', 'Anjali'];
    for(let i=0; i<5; i++) {
        const n = names[Math.floor(Math.random()*names.length)] + Math.floor(Math.random()*99);
        const amt = Math.floor(Math.random() * 900) + 10;
        html += `<div class="lb-item"><span class="user">${n}</span><span class="amt">₹${amt}</span></div>`;
    }
    list.innerHTML = html;
}

async function loadHistory() {
    try {
        const q = query(collection(db, 'history_aviator'), limit(15));
        const snap = await getDocs(q);
        const hList = document.getElementById('historyBar');
        hList.innerHTML = '';
        
        let arr = [];
        snap.forEach(doc => arr.push(doc.data().crashPoint));
        arr.sort((a,b)=>b-a); // sort high to low for display

        arr.forEach(val => {
            const item = document.createElement('div');
            item.className = 'h-bar-item ' + (val >= 2 ? 'high' : 'low');
            item.textContent = val.toFixed(2) + 'x';
            hList.appendChild(item);
        });
    } catch(e) {}
}

// Add history to DB on crash
async function saveHistory(crashPt) {
    try {
        await addDoc(collection(db, 'history_aviator'), { crashPoint: crashPt, createdAt: serverTimestamp() });
    } catch(e){}
}

// Override crashGame to save history
const originalCrashGame = crashGame;
crashGame = function() {
    originalCrashGame();
    saveHistory(crashPoint);
}
</script>
</body>
</html>
