<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f1115">
<title>BDG LOTTERY7 - Aviator</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent;}
body{background:#1a1c23;color:#fff;min-height:100vh;overflow-x:hidden;display:flex;flex-direction:column;}

/* Navbar */
.navbar{display:flex;justify-content:space-between;align-items:center;height:50px;padding:0 12px;background:#1a1c23;border-bottom:1px solid #2a2c35;}
.navbar-brand{font-size:20px;font-weight:900;color:#fd565c;font-style:italic;letter-spacing:1px;font-family:'Arial Black', sans-serif;}
.navbar-right{display:flex;gap:12px;align-items:center;font-weight:700;font-size:14px;color:#40ad72;}

/* Top History */
.top-history{display:flex;gap:6px;overflow-x:auto;padding:6px 12px;background:#1a1c23;align-items:center;border-bottom:1px solid #2a2c35;}
.top-history::-webkit-scrollbar{display:none;}
.h-bar-item{background:#252830;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;color:#a6a9ae;}
.h-bar-item.low{color:#40ad72;}
.h-bar-item.mid{color:#feca57;}
.h-bar-item.high{color:#fd565c;}

/* Game Area Container */
.game-container{margin:8px 12px;position:relative;display:flex;flex-direction:column;}

/* Fun Mode Bar */
.fun-mode-bar{background:#e59a1e;color:#000;text-align:center;font-size:11px;font-weight:900;padding:4px;border-radius:8px 8px 0 0;letter-spacing:0.5px;}

/* Canvas Area */
.canvas-wrapper{position:relative;height:280px;background:#0d0914;border-radius:0 0 8px 8px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;}
#graphCanvas{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1;}
.plane{position:absolute;width:70px;height:55px;z-index:2;transition:transform 0.05s linear;transform-origin:center;display:none;top:0;left:0;filter:drop-shadow(0 0 10px rgba(253,86,92,0.8));}
.multiplier-display{position:relative;z-index:10;font-size:56px;font-weight:900;color:#fff;text-shadow:0 0 30px rgba(255,255,255,0.2);font-family:'Arial Black', sans-serif;}
.multiplier-display.crashed{color:#fd565c;animation:shake 0.5s;}
@keyframes shake{0%{transform:translateX(0);}25%{transform:translateX(10px);}50%{transform:translateX(-10px);}75%{transform:translateX(10px);}100%{transform:translateX(0);}}
.status-text{position:relative;z-index:10;font-size:13px;color:#a6a9ae;margin-top:2px;font-weight:600;}

/* Live Viewers Badge */
.viewers-badge{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,0.6);padding:3px 10px;border-radius:20px;display:flex;align-items:center;gap:4px;z-index:10;font-size:11px;font-weight:700;}
.viewers-badge img{width:14px;height:14px;border-radius:50%;border:1px solid #fff;margin-left:-4px;}

/* Controls (Double Panel) */
.controls{margin:0 12px 12px;display:flex;flex-direction:column;gap:8px;}
.control-box{background:#252830;border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;}
.tabs{display:flex;background:#1a1c23;border-radius:6px;padding:3px;}
.tabs button{flex:1;background:transparent;border:none;color:#a6a9ae;font-size:12px;font-weight:700;padding:5px;border-radius:4px;cursor:pointer;}
.tabs button.active{background:#353945;color:#fff;}
.control-row{display:flex;gap:8px;}
.input-area{flex:1;display:flex;flex-direction:column;gap:5px;}
.input-main{display:flex;background:#1a1c23;border-radius:6px;overflow:hidden;align-items:center;height:40px;}
.input-main button{background:transparent;color:#fff;border:none;width:35px;font-size:18px;font-weight:bold;cursor:pointer;}
.input-main input{flex:1;background:transparent;border:none;color:#fff;text-align:center;font-size:15px;font-weight:700;outline:none;width:100%;}
.quick-btns{display:flex;gap:5px;}
.quick-btns button{flex:1;background:#1a1c23;border:none;border-radius:4px;color:#a6a9ae;font-size:10px;padding:6px 0;font-weight:700;cursor:pointer;}
.action-btn{flex:1;height:100%;min-height:70px;border-radius:6px;background:linear-gradient(180deg,#40ad72 0%,#1d7a47 100%);color:#fff;font-size:16px;font-weight:800;border:none;cursor:pointer;display:flex;flex-direction:column;justify-content:center;align-items:center;line-height:1.1;}
.action-btn span{font-size:11px;font-weight:600;opacity:0.9;}
.action-btn.cashout{background:linear-gradient(180deg,#e59a1e 0%,#c47d0b 100%);color:#fff;}
.action-btn:disabled{opacity:0.5;cursor:not-allowed;}

/* Bottom Tabs */
.bottom-tabs{margin:0 12px 12px;background:#252830;border-radius:10px;overflow:hidden;}
.tab-headers{display:flex;background:#1a1c23;}
.tab-headers button{flex:1;background:transparent;border:none;color:#a6a9ae;font-size:12px;font-weight:700;padding:8px;cursor:pointer;border-bottom:2px solid transparent;}
.tab-headers button.active{color:#fff;border-bottom:2px solid #40ad72;background:#252830;}
.tab-content{padding:8px 12px;height:150px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;}
.tab-content::-webkit-scrollbar{width:4px;}
.tab-content::-webkit-scrollbar-thumb{background:#444;border-radius:4px;}
.lb-item{display:flex;justify-content:space-between;font-size:12px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,0.05);animation:fadeIn 0.3s;}
.lb-item .user{color:#a6a9ae;display:flex;align-items:center;gap:4px;}
.lb-item .amt{color:#fff;font-weight:700;}
.lb-item .win{color:#40ad72;font-weight:700;}
@keyframes fadeIn{from{opacity:0;transform:translateY(-5px);}to{opacity:1;transform:translateY(0);}}

/* Popup */
.toast{position:fixed;top:10%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.9);color:#fff;padding:12px 24px;border-radius:10px;font-size:14px;z-index:9999;display:none;text-align:center;font-weight:600;}
.result-popup{position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:10000;display:none;align-items:center;justify-content:center;padding:20px;}
.result-popup.show{display:flex;}
.res-box{width:100%;max-width:320px;border-radius:16px;padding:24px;text-align:center;background:#252830;border:1px solid #444;}
.res-title{font-size:20px;font-weight:900;margin-bottom:8px;}
.res-amount{font-size:32px;font-weight:900;margin-bottom:20px;}
.res-btn{width:100%;height:48px;border-radius:8px;background:#40ad72;color:#fff;font-size:16px;font-weight:700;border:none;cursor:pointer;}
</style>
</head>
<body>

<div class="navbar">
    <a href="home.html" style="text-decoration:none;color:#fff;font-size:20px;">&#8592;</a>
    <div class="navbar-brand">Aviator</div>

        ₹<span id="balanceVal">0.00</span>

</div>

<div class="top-history" id="topHistory">
    <!-- History pills go here -->

<div class="game-container">
    <div class="fun-mode-bar">FUN MODE</div>
    <div class="canvas-wrapper" id="gameArea">
        <canvas id="graphCanvas"></canvas>
        
        <!-- PLANE IMAGE -->
        <img class="plane" id="plane" src="./images/146744-removebg-preview.png" alt="Plane" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 64 64\' fill=\'%23fd565c\'><path d=\'M53.2 31.8c-1.1-1-2.9-1.5-4.4-1.2l-11.3 2.1c-1.2-1.2-4.3-4.3-5.5-5.5l2.1-11.3c.3-1.5-.2-3.3-1.2-4.4-1.3-1.3-3.3-1.3-4.6 0l-9.9 9.9c-1.3 1.3-1.3 3.3 0 4.6l5.5 5.5c-1.2 1.2-4.3 4.3-5.5 5.5l-9.9-9.9c-1.3-1.3-3.3-1.3-4.6 0-1 1.1-1.5 2.9-1.2 4.4l2.1 11.3c-1.2 1.2-4.3 4.3-5.5 5.5L1.1 45.6C-.4 47.1-.4 49.5 1.1 51l9.9 9.9c1.5 1.5 3.9 1.5 5.4 0l9.9-9.9c1.2-1.2 4.3-4.3 5.5-5.5l5.5 5.5c1.3 1.3 3.3 1.3 4.6 0l9.9-9.9c1.1-1 1.5-2.9 1.2-4.4l-2.1-11.3c1.2-1.2 4.3-4.3 5.5-5.5l11.3-2.1c1.5-.3 3.3-2.2 4.4-3.2C56.1 33.8 54.9 32.8 53.2 31.8z\'/></svg>'">
        
        <div class="multiplier-display" id="multiplier">0.00x</div>
        <div class="status-text" id="status">Waiting for next round...</div>
        
        <div class="viewers-badge">
            <img src="https://i.pravatar.cc/100?img=1">

</div>

<div class="controls">
    <!-- Panel 1 -->
    <div class="control-box">
        <div class="tabs">

<div class="bottom-tabs">

</div>

<!-- Popup -->
<div class="result-popup" id="resultPopup">
  <div class="res-box" id="resBox">
    <div class="res-title" id="resTitle">You Won!</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, updateDoc, increment, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyAVQh9b7L3IYgWFIYA3wWorVBk1uXRFDZo", authDomain: "bdglottery7.firebaseapp.com", projectId: "bdglottery7", storageBucket: "bdglottery7.firebasestorage.app", messagingSenderId: "568771943906", appId: "1:568771943906:web:5b78078d9c0d67427dedbb" };
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let userBalance = 0;
let gameState = 'waiting';
let currentMultiplier = 1.00;
let crashPoint = 1.00;
let gameInterval = null;

let currentBetId1 = null;
let isBetting1 = false;
let betAmount1 = 10;

let currentBetId2 = null;
let isBetting2 = false;
let betAmount2 = 10;

let liveBetsInterval = null;

const canvas = document.getElementById('graphCanvas');
const ctx = canvas.getContext('2d');
const planeEl = document.getElementById('plane');
const multEl = document.getElementById('multiplier');
const statusEl = document.getElementById('status');
const actionBtn1 = document.getElementById('actionBtn1');
const actionBtn2 = document.getElementById('actionBtn2');

function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 2000);
}

function resizeCanvas() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
}
window.addEventListener('resize', resizeCanvas);

window.changeBet = function(panel, amt) {
    if(panel === 1) {
        if(isBetting1 || gameState === 'flying') return;
        betAmount1 = Math.max(10, betAmount1 + amt);
        document.getElementById('betAmount1').value = betAmount1;
        actionBtn1.innerHTML = `Bet<span>₹${betAmount1.toFixed(2)}</span>`;
    } else {
        if(isBetting2 || gameState === 'flying') return;
        betAmount2 = Math.max(10, betAmount2 + amt);
        document.getElementById('betAmount2').value = betAmount2;
        actionBtn2.innerHTML = `Bet<span>₹${betAmount2.toFixed(2)}</span>`;
    }
}

window.setBet = function(panel, val) {
    if(panel === 1) {
        if(isBetting1 || gameState === 'flying') return;
        betAmount1 = val;
        document.getElementById('betAmount1').value = betAmount1;
        actionBtn1.innerHTML = `Bet<span>₹${betAmount1.toFixed(2)}</span>`;
    } else {
        if(isBetting2 || gameState === 'flying') return;
        betAmount2 = val;
        document.getElementById('betAmount2').value = betAmount2;
        actionBtn2.innerHTML = `Bet<span>₹${betAmount2.toFixed(2)}</span>`;
    }
}

onAuthStateChanged(auth, async (user) => {
    if(!user) return location.replace('index.html');
    currentUser = user;
    const snap = await getDoc(doc(db, 'users', user.uid));
    if(snap.exists()) {
        userBalance = Number(snap.data().balance || 0);
        document.getElementById('balanceVal').textContent = userBalance.toFixed(2);
    }
    resizeCanvas();
    startWaitingPhase();
    startLiveBets();
});

function startWaitingPhase() {
    gameState = 'waiting';
    isBetting1 = false;
    isBetting2 = false;
    currentMultiplier = 1.00;
    multEl.textContent = '0.00x';
    multEl.className = 'multiplier-display';
    statusEl.textContent = 'Waiting for next round...';
    planeEl.style.display = 'none';
    
    actionBtn1.className = 'action-btn';
    actionBtn1.innerHTML = `Bet<span>₹${betAmount1.toFixed(2)}</span>`;
    actionBtn1.disabled = false;
    
    actionBtn2.className = 'action-btn';
    actionBtn2.innerHTML = `Bet<span>₹${betAmount2.toFixed(2)}</span>`;
    actionBtn2.disabled = false;
    
    drawRadialBackground();
    
    let waitTime = Math.floor(Math.random() * 3) + 5;
    const waitInt = setInterval(() => {
        waitTime--;
        statusEl.textContent = `Starting in ${waitTime}s...`;
        if(waitTime <= 0) {
            clearInterval(waitInt);
            startFlight();
        }
    }, 1000);
}

function drawRadialBackground() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    // Faint radial lines starting from bottom-left
    const cx = 0;
    const cy = canvas.height;
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 1;
    for(let i=0; i<25; i++) {
        const angle = (i / 25) * (Math.PI / 2);
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + Math.cos(angle) * canvas.width * 1.5, cy - Math.sin(angle) * canvas.height * 1.5);
        ctx.stroke();
    }
}

function startFlight() {
    gameState = 'flying';
    statusEl.textContent = 'In Flight';
    multEl.textContent = '1.00x';
    planeEl.style.display = 'block';
    
    const r = Math.random();
    if(r < 0.05) crashPoint = 1.00; 
    else crashPoint = Math.max(1.00, 0.99 / (1 - r * 0.96)); 
    if(crashPoint > 100) crashPoint = 100 + Math.random() * 50;

    const startTime = Date.now();
    
    gameInterval = setInterval(() => {
        const timePassed = (Date.now() - startTime) / 1000;
        currentMultiplier = Math.pow(1.06, timePassed * 1.15); 
        
        multEl.textContent = currentMultiplier.toFixed(2) + 'x';
        
        // Position Logic so it stays inside Canvas
        const progress = Math.min(1, currentMultiplier / (crashPoint > 8 ? 8 : crashPoint));
        const maxX = canvas.width * 0.8;
        const maxY = canvas.height * 0.7;
        
        // Ease-out curve for X and Y
        const px = maxX * Math.pow(progress, 0.8);
        const py = maxY * Math.pow(progress, 1.2);
        
        // Plane position (setting left and top for easier math)
        planeEl.style.left = `${px}px`;
        planeEl.style.bottom = `${py + 10}px`; // +10 for bottom padding
        planeEl.style.transform = `rotate(-20deg)`;

        drawGraph(px, py);

        if(currentMultiplier >= crashPoint) {
            crashGame();
        }
    }, 50);
}

function drawGraph(px, py) {
    drawRadialBackground();
    
    // Filled area
    const gradient = ctx.createLinearGradient(0, canvas.height, 0, 0);
    gradient.addColorStop(0, 'rgba(253,86,92,0.4)');
    gradient.addColorStop(1, 'rgba(253,86,92,0)');
    
    ctx.beginPath();
    ctx.moveTo(10, canvas.height - 10); // Start point
    ctx.quadraticCurveTo(10 + px * 0.4, canvas.height - 10, px, canvas.height - py - 10);
    ctx.lineTo(px, canvas.height - 10);
    ctx.fillStyle = gradient;
    ctx.fill();
    
    // Red Line
    ctx.beginPath();
    ctx.moveTo(10, canvas.height - 10);
    ctx.quadraticCurveTo(10 + px * 0.4, canvas.height - 10, px, canvas.height - py - 10);
    ctx.strokeStyle = '#fd565c';
    ctx.lineWidth = 4;
    ctx.stroke();
}

function crashGame() {
    clearInterval(gameInterval);
    gameState = 'crashed';
    multEl.textContent = crashPoint.toFixed(2) + 'x';
    multEl.className = 'multiplier-display crashed';
    statusEl.textContent = 'FLEW AWAY!';
    planeEl.style.display = 'none';
    
    if(isBetting1) {
        isBetting1 = false;
        currentBetId1 = null;
        actionBtn1.className = 'action-btn';
        actionBtn1.innerHTML = `Bet<span>₹${betAmount1.toFixed(2)}</span>`;
        showResultPopup(false, betAmount1);
    }
    
    if(isBetting2) {
        isBetting2 = false;
        currentBetId2 = null;
        actionBtn2.className = 'action-btn';
        actionBtn2.innerHTML = `Bet<span>₹${betAmount2.toFixed(2)}</span>`;
        showResultPopup(false, betAmount2);
    }
    
    addHistory(crashPoint);
    saveHistory(crashPoint);
    setTimeout(() => startWaitingPhase(), 3000);
}

window.handleAction = async function(panel) {
    if(gameState === 'waiting') {
        const amt = panel === 1 ? betAmount1 : betAmount2;
        if(amt < 10) return toast('Minimum bet ₹10');
        if(amt > userBalance) return toast('Insufficient balance');
        
        const btn = panel === 1 ? actionBtn1 : actionBtn2;
        btn.disabled = true;
        btn.innerHTML = 'Placing...';
        
        try {
            await updateDoc(doc(db, 'users', currentUser.uid), { balance: increment(-amt) });
            userBalance -= amt;
            document.getElementById('balanceVal').textContent = userBalance.toFixed(2);
            
            const betRef = await addDoc(collection(db, 'bets_aviator'), {
                userId: currentUser.uid, amount: amt, status: 'pending', createdAt: serverTimestamp()
            });
            
            if(panel === 1) {
                currentBetId1 = betRef.id; isBetting1 = true;
                btn.className = 'action-btn cashout';
                btn.innerHTML = `Cashout<span>₹0.00</span>`;
            } else {
                currentBetId2 = betRef.id; isBetting2 = true;
                btn.className = 'action-btn cashout';
                btn.innerHTML = `Cashout<span>₹0.00</span>`;
            }
            btn.disabled = false;
            
        } catch(e) {
            toast('Error placing bet');
            btn.disabled = false;
            btn.innerHTML = `Bet<span>₹${amt.toFixed(2)}</span>`;
        }
        
    } else if(gameState === 'flying') {
        if(panel === 1 && isBetting1) cashout(1);
        else if(panel === 2 && isBetting2) cashout(2);
    }
}

async function cashout(panel) {
    const btn = panel === 1 ? actionBtn1 : actionBtn2;
    const amt = panel === 1 ? betAmount1 : betAmount2;
    const betId = panel === 1 ? currentBetId1 : currentBetId2;
    
    if(panel === 1) isBetting1 = false;
    else isBetting2 = false;
    
    btn.disabled = true;
    btn.innerHTML = 'Cashed Out!';
    btn.className = 'action-btn';
    
    const winAmt = amt * currentMultiplier;
    const finalWin = winAmt - (winAmt * 0.05);
    
    showResultPopup(true, finalWin);
    
    await updateDoc(doc(db, 'users', currentUser.uid), { balance: increment(finalWin) });
    userBalance += finalWin;
    document.getElementById('balanceVal').textContent = userBalance.toFixed(2);
    
    if(betId) {
        await updateDoc(doc(db, 'bets_aviator', betId), {
            status: 'win', multiplier: currentMultiplier, winAmount: finalWin
        }).catch(()=>{});
    }
}

window.closePopup = () => { document.getElementById('resultPopup').classList.remove('show'); };

function showResultPopup(isWin, amount) {
    const popup = document.getElementById('resultPopup');
    const box = document.getElementById('resBox');
    const title = document.getElementById('resTitle');
    const amt = document.getElementById('resAmount');
    box.className = 'res-box';
    if(isWin) {
        title.textContent = 'Cashed Out!'; title.style.color = '#40ad72';
        amt.textContent = '+ ₹' + Number(amount).toFixed(2); amt.style.color = '#40ad72';
    } else {
        title.textContent = 'Flew Away!'; title.style.color = '#fd565c';
        amt.textContent = '- ₹' + Number(amount).toFixed(2); amt.style.color = '#fd565c';
    }
    popup.classList.add('show');
    setTimeout(() => popup.classList.remove('show'), 2500);
}

const fakeNames = ['Rahul', 'Aman', 'Vikas', 'Suresh', 'Ravi', 'Pooja', 'Neha', 'Anjali', 'Deepak', 'Karan', 'Simran', 'Rohit'];
function startLiveBets() {
    if(liveBetsInterval) clearInterval(liveBetsInterval);
    for(let i=0; i<15; i++) addFakeBet();
    liveBetsInterval = setInterval(addFakeBet, 1200);
}

function addFakeBet() {
    const list = document.getElementById('tabContent');
    if(!list) return;
    const name = fakeNames[Math.floor(Math.random()*fakeNames.length)] + Math.floor(Math.random()*99);
    const amt = Math.floor(Math.random() * 2000) + 10;
    const isWin = gameState === 'flying' && Math.random() > 0.7;
    
    const item = document.createElement('div');
    item.className = 'lb-item';
    if(isWin) {
        const winMult = currentMultiplier * (Math.random() * 0.5 + 0.5);
        item.innerHTML = `<div class="user">👤 ${name}</div><div class="win">₹${(amt*winMult).toFixed(2)} <span style="color:#fff;font-size:10px;">x${winMult.toFixed(2)}</span></div>`;
    } else {
        item.innerHTML = `<div class="user">👤 ${name}</div><div class="amt">₹${amt}</div>`;
    }
    list.prepend(item);
    if(list.children.length > 30) list.lastChild.remove();
}

function addHistory(crashPt) {
    const hList = document.getElementById('topHistory');
    const item = document.createElement('div');
    item.className = 'h-bar-item ' + (crashPt >= 2 ? 'high' : (crashPt >= 1.5 ? 'mid' : 'low'));
    item.textContent = crashPt.toFixed(2) + 'x';
    hList.insertBefore(item, hList.children[1] || null);
    if(hList.children.length > 15) hList.lastChild.remove();
}

async function saveHistory(crashPt) {
    try { await addDoc(collection(db, 'history_aviator'), { crashPoint: crashPt, createdAt: serverTimestamp() }); } catch(e){}
}
</script>
