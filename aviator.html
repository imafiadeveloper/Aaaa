  <!-- Application Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, doc, getDoc, updateDoc, increment, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyAVQh9b7L3IYgWFIYA3wWorVBk1uXRFDZo", authDomain: "bdglottery7.firebaseapp.com", projectId: "bdglottery7", storageBucket: "bdglottery7.firebasestorage.app", messagingSenderId: "568771943906", appId: "1:568771943906:web:5b78078d9c0d67427dedbb" };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let globalBalance = 0;

    // --- Sound Controller ---
    class SoundController {
      constructor() { this.ctx = null; this.muted = false; this.engineOsc = null; this.engineGain = null; }
      init() {
        if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (this.ctx.state === 'suspended') this.ctx.resume();
      }
      toggleMute() { this.muted = !this.muted; if(this.muted && this.engineGain) this.engineGain.gain.setValueAtTime(0, this.ctx.currentTime); return this.muted; }
      startEngine() {
        if (this.muted) return; this.init();
        try {
          if (this.engineOsc) this.stopEngine();
          this.engineOsc = this.ctx.createOscillator(); this.engineGain = this.ctx.createGain();
          this.engineOsc.type = 'sawtooth'; this.engineOsc.frequency.setValueAtTime(70, this.ctx.currentTime);
          const filter = this.ctx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.setValueAtTime(220, this.ctx.currentTime);
          this.engineGain.gain.setValueAtTime(0.01, this.ctx.currentTime); this.engineGain.gain.linearRampToValueAtTime(0.06, this.ctx.currentTime + 0.5);
          this.engineOsc.connect(filter); filter.connect(this.engineGain); this.engineGain.connect(this.ctx.destination);
          this.engineOsc.start();
        } catch (e) {}
      }
      updateEnginePitch(mult) {
        if (this.muted || !this.engineOsc) return;
        try { const targetFreq = Math.min(70 + (mult * 20), 450); this.engineOsc.frequency.setTargetAtTime(targetFreq, this.ctx.currentTime, 0.1); } catch (e) {}
      }
      stopEngine() {
        if (!this.engineOsc) return;
        try { this.engineGain.gain.linearRampToValueAtTime(0.001, this.ctx.currentTime + 0.1); this.engineOsc.stop(this.ctx.currentTime + 0.1); } catch (e) {}
        this.engineOsc = null; this.engineGain = null;
      }
      playCrash() {
        if (this.muted) return; this.init(); this.stopEngine();
        try {
          const bufferSize = this.ctx.sampleRate * 0.5; const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0); for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
          const noise = this.ctx.createBufferSource(); noise.buffer = buffer;
          const filter = this.ctx.createBiquadFilter(); filter.type = 'bandpass'; filter.frequency.setValueAtTime(350, this.ctx.currentTime); filter.frequency.exponentialRampToValueAtTime(50, this.ctx.currentTime + 0.5);
          const gain = this.ctx.createGain(); gain.gain.setValueAtTime(0.2, this.ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.5);
          noise.connect(filter); filter.connect(gain); gain.connect(this.ctx.destination); noise.start();
        } catch (e) {}
      }
      playCashout() {
        if (this.muted) return; this.init();
        try {
          const now = this.ctx.currentTime;
          [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
            const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
            osc.type = 'triangle'; osc.frequency.setValueAtTime(freq, now + i * 0.06);
            gain.gain.setValueAtTime(0, now + i * 0.06); gain.gain.linearRampToValueAtTime(0.12, now + i * 0.06 + 0.02); gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + 0.3);
            osc.connect(gain); gain.connect(this.ctx.destination); osc.start(now + i * 0.06); osc.stop(now + i * 0.06 + 0.35);
          });
        } catch (e) {}
      }
      playClick() {
        if (this.muted) return; this.init();
        try {
          const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
          osc.type = 'sine'; osc.frequency.setValueAtTime(800, this.ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(400, this.ctx.currentTime + 0.04);
          gain.gain.setValueAtTime(0.08, this.ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.04);
          osc.connect(gain); gain.connect(this.ctx.destination); osc.start(); osc.stop(this.ctx.currentTime + 0.05);
        } catch (e) {}
      }
    }
    const sound = new SoundController();

    // --- Game State & Controlled Algorithm ---
    const STATE_WAITING = 'WAITING'; const STATE_FLYING = 'FLYING'; const STATE_CRASHED = 'CRASHED';
    let gameState = STATE_WAITING;
    let multiplier = 1.00; let crashMultiplier = 1.00;
    let flightStartTime = 0; let waitingStartTime = 0;
    const WAIT_DURATION = 5000;
    let lastTimestamp = 0;

    let history = [1.12, 1.34, 1.03, 1.84, 1.22, 1.05, 2.45, 1.15, 1.02, 1.60];
    let roundCounter = 0; // Tracks game round cycles

    const bets = {
      1: { active: false, cashedOut: false, amount: 10, cashoutMult: 0, profit: 0, betId: null },
      2: { active: false, cashedOut: false, amount: 10, cashoutMult: 0, profit: 0, betId: null }
    };

    const canvas = document.getElementById('aviator-canvas');
    const ctx = canvas.getContext('2d');
    let plane = { x: 0, y: 0, angle: 0, speedX: 0, speedY: 0, propellerAngle: 0 };

    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr; canvas.height = rect.height * dpr; ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', resizeCanvas);

    // --- Firebase Setup ---
    onAuthStateChanged(auth, async (user) => {
      if(!user) return location.replace('index.html');
      currentUser = user;
      const snap = await getDoc(doc(db, 'users', user.uid));
      if(snap.exists()) {
        globalBalance = Number(snap.data().balance || 0);
        updateBalanceDisplay();
      }
      resizeCanvas(); initGame();
    });

    async function updateDatabaseBalance(amount, isDeduct) {
      if(!currentUser) return;
      try {
        await updateDoc(doc(db, 'users', currentUser.uid), { balance: increment(isDeduct ? -amount : amount) });
        globalBalance += isDeduct ? -amount : amount;
        updateBalanceDisplay();
      } catch(e) { showToast("Balance update failed", "error"); }
    }

    function updateBalanceDisplay() {
      document.getElementById('user-balance').innerText = globalBalance.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    // --- CUSTOM TIGHT CONTROLLED CRASH LOGIC ---
    function generateCrashMultiplier() {
      roundCounter++;
      
      // Har 11 rounds ke baad sirf 1 round thoda achha (5x se 10x) ud sakega
      if (roundCounter % 11 === 0) {
        const bigFly = 4.5 + Math.random() * 5.5; // 4.50x to 10.00x
        return parseFloat(bigFly.toFixed(2));
      }

      // Baaki 10 baar 0 se 2x ke andar strict crash (with occasional 3x)
      const roll = Math.random();

      if (roll < 0.35) {
        // 35% chance: Starting me hi crash (1.00x - 1.25x)
        const instantCrash = 1.00 + (Math.random() * 0.25);
        return parseFloat(instantCrash.toFixed(2));
      } else if (roll < 0.85) {
        // 50% chance: 1.26x se 1.95x ke beech crash (2x nahi pohochne dega)
        const lowCrash = 1.25 + (Math.random() * 0.70);
        return parseFloat(lowCrash.toFixed(2));
      } else {
        // 15% chance: Maximum 2x - 3.20x tak thoda dikhane ke liye
        const midCrash = 2.05 + (Math.random() * 1.15);
        return parseFloat(midCrash.toFixed(2));
      }
    }

    function renderHistory() {
      const container = document.getElementById('history-container');
      container.innerHTML = '';
      history.slice(-14).reverse().forEach(mult => {
        let bgStyle = mult < 1.3 ? 'text-rose-400 bg-rose-950/60 font-bold' : mult < 2.0 ? 'text-blue-400 bg-blue-950/50' : mult < 3.0 ? 'text-purple-400 bg-purple-950/50' : 'text-amber-400 bg-amber-950/50 font-extrabold';
        const badge = document.createElement('div');
        badge.className = `px-2 py-0.5 rounded text-[10px] font-num ${bgStyle}`;
        badge.innerText = mult.toFixed(2) + 'x';
        container.appendChild(badge);
      });
    }

    function showToast(msg, type = 'success') {
      const toast = document.getElementById('game-toast');
      const toastMsg = document.getElementById('toast-msg');
      const toastIcon = document.getElementById('toast-icon');
      toastMsg.innerText = msg;
      if (type === 'success') {
        toast.className = 'absolute top-4 z-30 px-3 py-1.5 rounded-lg text-xs font-bold flex items-center space-x-2 bg-emerald-950/90 text-emerald-300 border border-emerald-600 transform translate-y-0 opacity-100 transition-all duration-300';
        toastIcon.className = 'fa-solid fa-circle-check text-emerald-400';
      } else {
        toast.className = 'absolute top-4 z-30 px-3 py-1.5 rounded-lg text-xs font-bold flex items-center space-x-2 bg-rose-950/90 text-rose-300 border border-rose-600 transform translate-y-0 opacity-100 transition-all duration-300';
        toastIcon.className = 'fa-solid fa-triangle-exclamation text-rose-400';
      }
      setTimeout(() => { toast.classList.add('-translate-y-12', 'opacity-0'); toast.classList.remove('translate-y-0', 'opacity-100'); }, 2500);
    }

    // --- UI Buttons Update ---
    function updatePanelButton(panelNum) {
      const betState = bets[panelNum];
      const btn = document.getElementById(`action-btn-${panelNum}`);
      const label = document.getElementById(`btn-label-${panelNum}`);
      const amtLabel = document.getElementById(`btn-amount-${panelNum}`);
      const input = document.getElementById(`bet-input-${panelNum}`);

      if (gameState === STATE_WAITING) {
        if (betState.active) {
          btn.className = "w-full h-full min-h-[65px] rounded-lg font-black text-sm flex flex-col items-center justify-center shadow-lg bg-red-600 hover:bg-red-500 text-white border-b-4 border-red-800";
          label.innerText = "CANCEL";
          amtLabel.innerText = `₹${betState.amount.toFixed(2)}`;
          input.disabled = true;
        } else {
          btn.className = "w-full h-full min-h-[65px] rounded-lg font-black text-sm flex flex-col items-center justify-center shadow-lg bg-emerald-600 hover:bg-emerald-500 text-white border-b-4 border-emerald-800";
          label.innerText = "BET";
          amtLabel.innerText = `₹${parseFloat(input.value || 0).toFixed(2)}`;
          input.disabled = false;
        }
      } else if (gameState === STATE_FLYING) {
        if (betState.active && !betState.cashedOut) {
          const currentWin = (betState.amount * multiplier).toFixed(2);
          btn.className = "w-full h-full min-h-[65px] rounded-lg font-black text-sm flex flex-col items-center justify-center shadow-lg bg-amber-500 hover:bg-amber-400 text-slate-950 border-b-4 border-amber-700 animate-pulse";
          label.innerText = "CASH OUT";
          amtLabel.innerText = `₹${currentWin}`;
          input.disabled = true;
        } else if (betState.cashedOut) {
          btn.className = "w-full h-full min-h-[65px] rounded-lg font-black text-sm flex flex-col items-center justify-center opacity-60 bg-slate-800 text-emerald-400 border-b-4 border-slate-900 cursor-not-allowed";
          label.innerText = "CASHED OUT";
          amtLabel.innerText = `₹${betState.profit.toFixed(2)}`;
          input.disabled = true;
        } else {
          btn.className = "w-full h-full min-h-[65px] rounded-lg font-black text-sm flex flex-col items-center justify-center opacity-40 bg-slate-800 text-slate-400 border-b-4 border-slate-900 cursor-not-allowed";
          label.innerText = "WAITING";
          amtLabel.innerText = `Next Round`;
          input.disabled = true;
        }
      } else if (gameState === STATE_CRASHED) {
        if (betState.active && !betState.cashedOut) {
          btn.className = "w-full h-full min-h-[65px] rounded-lg font-black text-sm flex flex-col items-center justify-center bg-red-950 text-rose-500 border-b-4 border-red-950 cursor-not-allowed";
          label.innerText = "CRASHED";
          amtLabel.innerText = `- ₹${betState.amount.toFixed(2)}`;
        }
      }
    }

    function syncBothPanelButtons() { updatePanelButton(1); updatePanelButton(2); }

    // --- Game Actions ---
    async function handleBetAction(panelNum) {
      sound.playClick();
      const betState = bets[panelNum];
      const input = document.getElementById(`bet-input-${panelNum}`);
      const val = parseFloat(input.value);

      if (gameState === STATE_WAITING) {
        if (!betState.active) {
          if (isNaN(val) || val < 10) return showToast("Minimum bet ₹10", "error");
          if (val > globalBalance) return showToast("Insufficient balance!", "error");

          await updateDatabaseBalance(val, true);
          
          betState.active = true; betState.amount = val; betState.cashedOut = false; betState.profit = 0;
          
          try {
            const betRef = await addDoc(collection(db, 'bets_aviator'), {
              userId: currentUser.uid, amount: val, status: 'pending', createdAt: serverTimestamp()
            });
            betState.betId = betRef.id;
          } catch(e) {}
          
          updatePanelButton(panelNum);
        } else {
          await updateDatabaseBalance(betState.amount, false);
          betState.active = false;
          updatePanelButton(panelNum);
        }
      } else if (gameState === STATE_FLYING) {
        if (betState.active && !betState.cashedOut) cashOut(panelNum, multiplier);
      }
    }

    async function cashOut(panelNum, mult) {
      const betState = bets[panelNum];
      if (!betState.active || betState.cashedOut) return;

      betState.cashedOut = true;
      betState.cashoutMult = mult;
      betState.profit = betState.amount * mult;

      sound.playCashout();
      await updateDatabaseBalance(betState.profit, false);
      
      if(betState.betId) {
        updateDoc(doc(db, 'bets_aviator', betState.betId), {
          status: 'win', multiplier: mult, winAmount: betState.profit
        }).catch(()=>{});
      }

      updatePanelButton(panelNum);
      showToast(`Cashed out Bet #${panelNum}: ₹${betState.profit.toFixed(2)} at ${mult.toFixed(2)}x!`);
    }

    function checkAutoCashouts(currentMult) {
      [1, 2].forEach(p => {
        const betState = bets[p];
        const autoCheck = document.getElementById(`auto-cashout-${p}`);
        const autoMult = parseFloat(document.getElementById(`auto-mult-${p}`).value);
        if (betState.active && !betState.cashedOut && autoCheck.checked) {
          if (!isNaN(autoMult) && currentMult >= autoMult) cashOut(p, autoMult);
        }
      });
    }

    // --- Canvas Draw Functions ---
    function drawGrid(w, h, progress) {
      ctx.save();
      ctx.strokeStyle = '#161d2d'; ctx.lineWidth = 1;
      const step = 45; const offsetX = (progress * 25) % step; const offsetY = (progress * 15) % step;
      for (let x = -step + offsetX; x < w; x += step) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
      for (let y = offsetY; y < h; y += step) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
      ctx.strokeStyle = '#273349'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(35, 10); ctx.lineTo(35, h - 35); ctx.lineTo(w - 10, h - 35); ctx.stroke();
      ctx.restore();
    }

    function drawFlightCurve(w, h, px, py) {
      const originX = 35; const originY = h - 35;
      ctx.save();
      const gradient = ctx.createLinearGradient(0, py, 0, originY);
      gradient.addColorStop(0, 'rgba(239, 68, 68, 0.45)'); gradient.addColorStop(1, 'rgba(225, 29, 72, 0.0)');
      ctx.beginPath(); ctx.moveTo(originX, originY);
      const controlX = originX + (px - originX) * 0.65; const controlY = originY;
      ctx.quadraticCurveTo(controlX, controlY, px, py);
      ctx.lineTo(px, originY); ctx.closePath(); ctx.fillStyle = gradient; ctx.fill();
      ctx.beginPath(); ctx.moveTo(originX, originY);
      ctx.quadraticCurveTo(controlX, controlY, px, py);
      ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 3.5; ctx.shadowColor = '#f43f5e'; ctx.shadowBlur = 14; ctx.stroke();
      ctx.restore();
    }

    function drawAviatorPlane(x, y, angle, propAngle) {
      ctx.save(); ctx.translate(x, y); ctx.rotate(angle); ctx.shadowColor = 'rgba(239, 68, 68, 0.7)'; ctx.shadowBlur = 10;
      ctx.fillStyle = '#dc2626'; ctx.beginPath(); ctx.moveTo(28, 0); ctx.bezierCurveTo(24, -8, -12, -9, -32, -3); ctx.lineTo(-38, -16); ctx.lineTo(-44, -16); ctx.lineTo(-38, 2); ctx.lineTo(-30, 4); ctx.bezierCurveTo(-15, 8, 15, 7, 28, 0); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#e2e8f0'; ctx.beginPath(); ctx.moveTo(12, -6); ctx.lineTo(2, -7); ctx.bezierCurveTo(4, -2, 10, -2, 12, -6); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#b91c1c'; ctx.beginPath(); ctx.moveTo(5, -1); ctx.lineTo(-12, -22); ctx.lineTo(-20, -20); ctx.lineTo(-8, 0); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#991b1b'; ctx.beginPath(); ctx.moveTo(-28, -1); ctx.lineTo(-38, -10); ctx.lineTo(-42, -9); ctx.lineTo(-34, 1); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#1e293b'; ctx.beginPath(); ctx.arc(28, 0, 4, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#f8fafc'; ctx.lineWidth = 2.5; const bladeLength = 14 * Math.sin(propAngle);
      ctx.beginPath(); ctx.moveTo(29, -bladeLength); ctx.lineTo(29, bladeLength); ctx.stroke(); ctx.restore();
    }

    // --- Game Loop ---
    function startWaitingRound() {
      gameState = STATE_WAITING; waitingStartTime = performance.now(); multiplier = 1.00; sound.stopEngine();
      const multText = document.getElementById('multiplier-text'); const statusText = document.getElementById('status-subtext'); const countdownCard = document.getElementById('countdown-card');
      multText.className = "text-6xl sm:text-7xl font-black font-num text-white tracking-tight drop-shadow-2xl";
      multText.innerText = "1.00x"; statusText.innerText = "WAITING FOR NEXT ROUND"; countdownCard.classList.remove('hidden');
      
      document.getElementById('viewer-count').innerText = Math.floor(Math.random() * 150) + 150;

      [1, 2].forEach(p => { bets[p].cashedOut = false; bets[p].profit = 0; });
      syncBothPanelButtons();
    }

    function takeoff() {
      gameState = STATE_FLYING; flightStartTime = performance.now(); 
      crashMultiplier = generateCrashMultiplier(); 
      multiplier = 1.00;
      
      document.getElementById('countdown-card').classList.add('hidden');
      document.getElementById('status-subtext').innerText = "PLANE IS FLYING";
      document.getElementById('status-subtext').className = "text-xs font-bold uppercase tracking-widest text-emerald-400 mt-1";
      sound.startEngine(); syncBothPanelButtons();
    }

    function triggerCrash() {
      gameState = STATE_CRASHED; sound.playCrash();
      plane.speedX = 14; plane.speedY = -10;
      const multText = document.getElementById('multiplier-text'); const statusText = document.getElementById('status-subtext');
      multText.innerText = multiplier.toFixed(2) + 'x';
      multText.className = "text-6xl sm:text-7xl font-black font-num text-rose-500 tracking-tight glow-red";
      statusText.innerText = "FLEW AWAY!"; statusText.className = "text-xs font-bold uppercase tracking-widest text-rose-500 mt-1";

      history.push(multiplier); renderHistory(); syncBothPanelButtons();
      
      try { addDoc(collection(db, 'history_aviator'), { crashPoint: multiplier, createdAt: serverTimestamp() }); } catch(e){}

      setTimeout(() => startWaitingRound(), 3000);
    }

    function mainGameLoop(timestamp) {
      if (!lastTimestamp) lastTimestamp = timestamp;
      const rect = canvas.getBoundingClientRect(); const w = rect.width; const h = rect.height;
      ctx.clearRect(0, 0, w, h);

      if (gameState === STATE_WAITING) {
        const elapsed = timestamp - waitingStartTime; const remaining = Math.max(0, (WAIT_DURATION - elapsed) / 1000); const percent = Math.max(0, (1 - elapsed / WAIT_DURATION)) * 100;
        document.getElementById('countdown-seconds').innerText = remaining.toFixed(1) + 's';
        document.getElementById('countdown-progress').style.width = percent + '%';
        drawGrid(w, h, 0);
        plane.x = 42; plane.y = h - 45; plane.angle = -0.05; plane.propellerAngle += 0.2;
        drawAviatorPlane(plane.x, plane.y, plane.angle, plane.propellerAngle);
        if (elapsed >= WAIT_DURATION) takeoff();
      } else if (gameState === STATE_FLYING) {
        const flightTimeSec = (timestamp - flightStartTime) / 1000;
        multiplier = Math.max(1.00, Math.pow(Math.E, 0.07 * Math.pow(flightTimeSec, 1.25)));
        const multDisplay = document.getElementById('multiplier-text');
        multDisplay.innerText = multiplier.toFixed(2) + 'x';
        if (multiplier > 2.0 && multiplier < 10.0) multDisplay.className = "text-6xl sm:text-7xl font-black font-num text-amber-300 tracking-tight glow-gold";
        else if (multiplier >= 10.0) multDisplay.className = "text-6xl sm:text-7xl font-black font-num text-rose-400 tracking-tight glow-red";

        sound.updateEnginePitch(multiplier); checkAutoCashouts(multiplier);

        [1, 2].forEach(p => { if (bets[p].active && !bets[p].cashedOut) document.getElementById(`btn-amount-${p}`).innerText = `₹${(bets[p].amount * multiplier).toFixed(2)}`; });

        const curveProgress = Math.min(1.0, flightTimeSec / 8.0); 
        const targetX = 35 + (w - 120) * Math.min(1.0, Math.pow(curveProgress, 0.8)); 
        const targetY = (h - 35) - (h - 90) * Math.min(1.0, Math.pow(curveProgress, 1.3));
        const wave = Math.sin(timestamp * 0.006) * 4;
        plane.x = targetX; plane.y = targetY + wave; plane.angle = -Math.atan2(h - 90, w - 120) * 0.65; plane.propellerAngle += 0.8;

        drawGrid(w, h, flightTimeSec); drawFlightCurve(w, h, plane.x, plane.y); drawAviatorPlane(plane.x, plane.y, plane.angle, plane.propellerAngle);
        if (multiplier >= crashMultiplier) triggerCrash();
      } else if (gameState === STATE_CRASHED) {
        plane.x += plane.speedX; plane.y += plane.speedY; plane.speedX *= 1.05; plane.speedY *= 1.05;
        drawGrid(w, h, 0);
        if (plane.x < w + 80 && plane.y > -80) drawAviatorPlane(plane.x, plane.y, plane.angle - 0.2, plane.propellerAngle += 0.8);
      }
      requestAnimationFrame(mainGameLoop);
    }

    // --- Fake Live Bets ---
    const fakeNames = ['Rahul', 'Aman', 'Vikas', 'Suresh', 'Ravi', 'Pooja', 'Neha', 'Anjali', 'Deepak', 'Karan', 'Simran', 'Rohit'];
    function addFakeBet() {
      const list = document.getElementById('live-bets-list'); if(!list) return;
      const name = fakeNames[Math.floor(Math.random()*fakeNames.length)] + Math.floor(Math.random()*99);
      const amt = Math.floor(Math.random() * 2000) + 10;
      const isWin = gameState === STATE_FLYING && Math.random() > 0.7;
      const item = document.createElement('div'); item.className = 'live-bet-item flex justify-between text-[11px] py-1 border-b border-slate-800/50';
      if(isWin) {
        const winMult = multiplier * (Math.random() * 0.5 + 0.5);
        item.innerHTML = `<span class="text-slate-400"><i class="fa-solid fa-user text-[9px] mr-1"></i>${name}</span><span class="text-emerald-400 font-bold">₹${(amt*winMult).toFixed(2)} <span class="text-white text-[9px]">x${winMult.toFixed(2)}</span></span>`;
      } else {
        item.innerHTML = `<span class="text-slate-400"><i class="fa-solid fa-user text-[9px] mr-1"></i>${name}</span><span class="text-white font-bold">₹${amt}</span>`;
      }
      list.prepend(item); if(list.children.length > 30) list.lastChild.remove();
    }
    setInterval(addFakeBet, 1200);

    // --- Event Listeners ---
    document.getElementById('audio-toggle').addEventListener('click', () => {
      const isMuted = sound.toggleMute();
      document.getElementById('audio-icon').className = isMuted ? 'fa-solid fa-volume-xmark text-rose-400 text-xs' : 'fa-solid fa-volume-high text-slate-300 text-xs';
      if(!isMuted) sound.init();
    });

    document.getElementById('action-btn-1').addEventListener('click', () => handleBetAction(1));
    document.getElementById('action-btn-2').addEventListener('click', () => handleBetAction(2));

    const setupStepper = (panel, delta) => {
      const input = document.getElementById(`bet-input-${panel}`); let current = parseFloat(input.value) || 0;
      current = Math.max(10, current + delta); input.value = current; sound.playClick();
      if (!bets[panel].active) document.getElementById(`btn-amount-${panel}`).innerText = `₹${current.toFixed(2)}`;
    };
    document.getElementById('minus-bet-1').addEventListener('click', () => setupStepper(1, -50));
    document.getElementById('plus-bet-1').addEventListener('click', () => setupStepper(1, 50));
    document.getElementById('minus-bet-2').addEventListener('click', () => setupStepper(2, -50));
    document.getElementById('plus-bet-2').addEventListener('click', () => setupStepper(2, 50));

    [1, 2].forEach(p => {
      document.getElementById(`bet-input-${p}`).addEventListener('input', (e) => {
        const val = parseFloat(e.target.value) || 0; if (!bets[p].active) document.getElementById(`btn-amount-${p}`).innerText = `₹${val.toFixed(2)}`;
      });
    });

    document.querySelectorAll('.preset-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const panel = e.target.dataset.panel; const val = parseFloat(e.target.dataset.val);
        if (panel && val) {
          document.getElementById(`bet-input-${panel}`).value = val; sound.playClick();
          if (!bets[panel].active) document.getElementById(`btn-amount-${panel}`).innerText = `₹${val.toFixed(2)}`;
        }
      });
    });

    function initGame() {
      updateBalanceDisplay(); renderHistory();
      for(let i=0; i<10; i++) addFakeBet();
      startWaitingRound(); requestAnimationFrame(mainGameLoop);
      document.addEventListener('pointerdown', () => sound.init(), { once: true });
    }
  </script>
</body>
</html>
