<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Feedback - BDG LOTTERY7</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent;}
body{background:#1A1A1A;color:#fff;min-height:100vh;}
.navbar{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 16px;background:#1A1A1A;}
.nav-left{width:40px;height:40px;display:flex;align-items:center;cursor:pointer;}
.nav-left svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2.2;}
.nav-title{font-size:16px;font-weight:600;}
.form-container{padding:16px;margin:16px;background:#262626;border-radius:16px;}
.form-group{margin-bottom:16px;}
.form-label{display:block;font-size:13px;color:#a6a9ae;margin-bottom:8px;}
.form-input{width:100%;background:#1A1A1A;border:1px solid #444;border-radius:10px;padding:14px;color:#fff;font-size:15px;outline:none;}
.form-input:focus{border-color:#FAE59F;}
textarea.form-input{min-height:120px;resize:vertical;}
.btn-submit{width:100%;height:48px;border-radius:24px;background:linear-gradient(180deg,#FAE59F 0%,#C4933F 100%);color:#3a2a10;font-size:16px;font-weight:700;border:none;cursor:pointer;margin-top:10px;}
.btn-submit:disabled{opacity:0.6;cursor:not-allowed;}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(30,30,30,0.98);border:1px solid rgba(250,229,159,0.25);color:#fff;font-size:13px;padding:12px 22px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:9999;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="navbar">
  <div class="nav-left" onclick="location.href='account.html'"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></div>
  <div class="nav-title">Feedback</div>
  <div style="width:40px;"></div>
</div>

<div class="form-container">
  <div class="form-group">
    <label class="form-label">Your Name / Phone (Optional)</label>
    <input type="text" id="fbName" class="form-input" placeholder="Enter name or phone">
  </div>
  <div class="form-group">
    <label class="form-label">Describe your issue or suggestion</label>
    <textarea id="fbMessage" class="form-input" placeholder="Type here..."></textarea>
  </div>
  <button class="btn-submit" id="submitBtn" onclick="submitFeedback()">Submit Feedback</button>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyAVQh9b7L3IYgWFIYA3wWorVBk1uXRFDZo", authDomain: "bdglottery7.firebaseapp.com", projectId: "bdglottery7", storageBucket: "bdglottery7.firebasestorage.app", messagingSenderId: "568771943906", appId: "1:568771943906:web:5b78078d9c0d67427dedbb" };
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const TG_BOT_TOKEN = "8650504834:AAGUGuV9mTljkZoxIY9r6YdgdWjytuYv5uw";
const TG_CHAT_ID = "8167337368";

const toastEl = document.getElementById('toast');
const showToast = (msg) => { toastEl.textContent = msg; toastEl.classList.add('show'); setTimeout(()=>toastEl.classList.remove('show'), 2500); }

let currentUser = null;
onAuthStateChanged(auth, (user) => {
  if(!user) return location.replace('index.html');
  currentUser = user;
});

async function submitFeedback() {
  const name = document.getElementById('fbName').value.trim();
  const msg = document.getElementById('fbMessage').value.trim();
  
  if(!msg || msg.length < 5) return showToast('Please describe your issue (min 5 chars)');
  
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.innerText = 'Submitting...';

  try {
    // Save to Firestore
    await addDoc(collection(db, 'feedbacks'), {
      userId: currentUser.uid,
      name: name || 'Anonymous',
      message: msg,
      createdAt: serverTimestamp()
    });

    // Send to Telegram
    const tgMsg = `📢 *New Feedback*\n\n👤 *User:* ${name || 'Anonymous'}\n🆔 *UID:* ${currentUser.uid.substring(0,8)}\n\n💬 *Message:*\n${msg}`;
    
    await fetch(`https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage`, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ chat_id: TG_CHAT_ID, text: tgMsg, parse_mode: 'Markdown' })
    });

    showToast('Feedback submitted successfully!');
    document.getElementById('fbMessage').value = '';
    
  } catch(err) {
    console.error(err);
    showToast('Failed to submit. Try again.');
  } finally {
    btn.disabled = false;
    btn.innerText = 'Submit Feedback';
  }
}
window.submitFeedback = submitFeedback;
</script>
</body>
</html>
