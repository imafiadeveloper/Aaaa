<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Settings - BDG LOTTERY7</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
body{background:#1A1A1A;color:#fff;min-height:100vh;}
.navbar{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 16px;background:#1A1A1A;}
.nav-left{width:40px;height:40px;display:flex;align-items:center;cursor:pointer;}
.nav-left svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2.2;}
.nav-title{font-size:16px;font-weight:600;}
.profile-card{display:flex;align-items:center;justify-content:space-between;background:#262626;margin:16px;padding:16px;border-radius:12px;}
.pc-left{display:flex;align-items:center;gap:12px;}
.pc-avatar{width:50px;height:50px;border-radius:50%;background:#333;overflow:hidden;}
.pc-name{font-size:15px;font-weight:600;}
.pc-uid{font-size:12px;color:#a6a9ae;}
.pc-right{font-size:13px;color:#FAE59F;cursor:pointer;}
.menu-group{margin:16px;background:#262626;border-radius:12px;overflow:hidden;}
.menu-item{display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid #333;cursor:pointer;}
.menu-item:last-child{border-bottom:none;}
.mi-left{display:flex;align-items:center;gap:12px;font-size:14px;}
.mi-left svg{width:20px;height:20px;stroke:#FAE59F;fill:none;stroke-width:2;}
.mi-val{font-size:13px;color:#a6a9ae;display:flex;align-items:center;gap:6px;}
.mi-val svg{width:16px;height:16px;stroke:#a6a9ae;fill:none;stroke-width:2;}
</style>
</head>
<body>
<div class="navbar">
  <div class="nav-left" onclick="location.href='account.html'"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></div>
  <div class="nav-title">Settings Center</div>
  <div style="width:40px;"></div>
</div>

<div class="profile-card">
  <div class="pc-left">
    <div class="pc-avatar"><img src="https://ui-avatars.com/api/?name=User&background=random" style="width:100%;height:100%;object-fit:cover;" id="avatarImg"></div>
    <div>
      <div class="pc-name" id="userName">Member</div>
      <div class="pc-uid" id="userUid">UID: ---</div>
    </div>
  </div>
  <div class="pc-right">Change avatar ></div>
</div>

<div class="menu-group">
  <div class="menu-item">
    <div class="mi-left"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg> Login password</div>
    <div class="mi-val">Edit <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></div>
  </div>
  <div class="menu-item">
    <div class="mi-left"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><polyline points="3 7 12 13 21 7"/></svg> Bind mailbox</div>
    <div class="mi-val" id="bindStatus">to bind <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyAVQh9b7L3IYgWFIYA3wWorVBk1uXRFDZo", authDomain: "bdglottery7.firebaseapp.com", projectId: "bdglottery7", storageBucket: "bdglottery7.firebasestorage.app", messagingSenderId: "568771943906", appId: "1:568771943906:web:5b78078d9c0d67427dedbb" };
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth, async (user) => {
  if(!user) return location.replace('index.html');
  document.getElementById('userUid').textContent = 'UID: ' + user.uid.substring(0,8).toUpperCase();
  
  const snap = await getDoc(doc(db,'users',user.uid));
  if(snap.exists()) {
    const data = snap.data();
    document.getElementById('userName').textContent = data.name || 'Member';
    if(data.realEmail) {
      document.getElementById('bindStatus').innerHTML = 'Bound <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>';
    }
  }
});
</script>
</body>
</html>
