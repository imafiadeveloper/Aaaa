<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f1115">
<title>BDG LOTTERY7 - Mines</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent;}
body{background:#0f1115;color:#fff;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden;padding-bottom:20px;}

/* Navbar */
.navbar{display:flex;justify-content:space-between;align-items:center;height:56px;padding:0 16px;background:#1a1d24;border-bottom:1px solid #333;position:sticky;top:0;z-index:100;}
.navbar-brand{font-size:18px;font-weight:900;color:#FAE59F;letter-spacing:1px;}
.navbar-right{display:flex;gap:12px;align-items:center;}
.nav-icon{width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;transition:0.2s;}
.nav-icon svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;}
.nav-icon.active svg{stroke:#FAE59F;}

/* Balance */
.bal-box{background:#1a1d24;margin:16px;border-radius:16px;padding:16px;display:flex;align-items:center;justify-content:space-between;border:1px solid #2a2d35;}
.bal-box span{color:#a6a9ae;font-size:12px;}
.bal-box h2{color:#FAE59F;font-size:24px;font-weight:900;}

/* Game Info Bar */
.game-info{display:flex;justify-content:space-between;margin:0 16px 16px;gap:8px;}
.gi-col{flex:1;background:#1a1d24;padding:12px;border-radius:12px;text-align:center;border:1px solid #2a2d35;}
.gi-col span{color:#a6a9ae;font-size:10px;display:block;margin-bottom:4px;text-transform:uppercase;}
.gi-col strong{font-size:16px;color:#FAE59F;}

/* Grid */
.grid-container{margin:0 16px 20px;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
.box{aspect-ratio:1;background:#2a2d35;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;box-shadow:inset 0 -4px 0 rgba(0,0,0,0.4);transition:transform 0.15s, background 0.2s;user-select:none;}
.box:active{transform:scale(0.92);}
.box:hover{background:#353943;}
.box.revealed{background:#1a1d24;box-shadow:none;cursor:default;transform:scale(1);}
.box.safe{background:#40ad72;box-shadow:inset 0 -4px 0 #2e7d50;animation:pop 0.3s ease;}
.box.bomb{background:#fd565c;box-shadow:inset 0 -4px 0 #b8393e;animation:shake 0.4s ease;}
.box.disabled{pointer-events:none;opacity:0.6;}
@keyframes pop { 0% { transform: scale(0.8); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
@keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(5px); } 50% { transform: translateX(-5px); } 75% { transform: translateX(5px); } 100% { transform: translateX(0); } }

/* Controls */
.controls{margin:auto 16px 20px;display:flex;flex-direction:column;gap:12px;}
.input-row{display:flex;gap:8px;align-items:center;}
.input-row input{flex:1;background:#1a1d24;border:1px solid #444;border-radius:10px;padding:14px;color:#fff;font-size:18px;font-weight:700;text-align:center;outline:none;}
.input-row input:focus{border-color:#FAE59F;}
.quick-btns{display:flex;gap:8px;}
.quick-btn{flex:1;background:#2a2d35;border:none;border-radius:8px;padding:10px;color:#fff;font-weight:700;cursor:pointer;font-size:12px;}
.quick-btn:active{background:#3f3f3f;}
.mines-select{background:#1a1d24;color:#fff;border:1px solid #444;border-radius:10px;padding:0 10px;font-weight:700;font-size:16px;outline:none;cursor:pointer;}
.btn-main{width:100%;height:56px;border-radius:12px;background:linear-gradient(180deg,#FAE59F 0%,#C4933F 100%);color:#3a2a10;font-size:18px;font-weight:900;border:none;cursor:pointer;box-shadow:0 4px 15px rgba(250,229,159,0.3);transition:transform 0.1s;}
.btn-main:active{transform:scale(0.98);}
.btn-main:disabled{opacity:0.5;cursor:not-allowed;}
.btn-cashout{background:linear-gradient(180deg,#40ad72 0%,#25874b 100%);color:#fff;box-shadow:0 4px 15px rgba(64,173,114,0.4);display:none;}

/* History */
.history-section{margin:0 16px 20px;}
.history-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.history-head h3{font-size:15px;}
.history-list{display:flex;flex-direction:column;gap:8px;}
.h-item{display:flex;justify-content:space-between;align-items:center;background:#1a1d24;padding:12px;border-radius:10px;font-size:13px;}
.h-item.win{border-left:3px solid #40ad72;}
.h-item.lose{border-left:3px solid #fd565c;}
.h-item .amount{font-weight:700;}
.h-item .win-amt{color:#40ad72;}
.h-item .lose-amt{color:#fd565c;}

.toast{position:fixed;top:10%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.9);color:#fff;padding:12px 24px;border-radius:10px;font-size:14px;z-index:9999;display:none;text-align:center;font-weight:600;box-shadow:0 4px 20px rgba(0,0,0,0.5);}

/* Game Popup */
.result-popup{position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:10000;display:none;align-items:center;justify-content:center;padding:20px;}
.result-popup.show{display:flex;animation:fadeIn .3s ease;}
.res-box{width:100%;max-width:340px;border-radius:24px;padding:30px 20px;text-align:center;position:relative;animation:popIn .4s cubic-bezier(.68,-0.55,.27,1.55);}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes popIn{from{transform:scale(0.5);opacity:0;}to{transform:scale(1);opacity:1;}}
.res-box.win{background:linear-gradient(160deg,#1a1d24 0%,#0f1115 100%);border:2px solid #40ad72;box-shadow:0 0 50px rgba(64,173,114,0.3);}
.res-box.lose{background:linear-gradient(160deg,#1a1d24 0%,#0f1115 100%);border:2px solid #fd565c;box-shadow:0 0 50px rgba(253,86,92,0.3);}
.res-icon{font-size:60px;margin-bottom:15px;}
.res-title{font-size:24px;font-weight:900;margin-bottom:8px;}
.res-box.win .res-title{color:#40ad72;}
.res-box.lose .res-title{color:#fd565c;}
.res-amount{font-size:36px;font-weight:900;color:#FAE59F;margin-bottom:20px;}
.res-btn{width:100%;height:50px;border-radius:25px;background:#FAE59F;color:#3a2a10;font-size:16px;font-weight:700;border:none;cursor:pointer;}
</style>
</head>
<body>

<div class="navbar">
    <a href="home.html" class="nav-icon"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></a>
    <div class="navbar-brand">MINES</div>
    <div class="navbar-right">
        <div class="nav-icon active" id="soundBtn"><svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/></svg></div>
    </div>
</div>

<div class="bal-box">
    <div>
        <span>Total Balance</span>
        <h2>₹<span id="balanceVal">0.00</span></h2>
    </div>
    <svg viewBox="0 0 24 24" onclick="location.reload()" style="width:24px;height:24px;stroke:#a6a9ae;fill:none;stroke-width:2;cursor:pointer;"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
</div>

<div class="game-info">
    <div class="gi-col"><span>Multiplier</span><strong id="uiMulti">1.00x</strong></div>
    <div class="gi-col"><span>Next Multi</span><strong id="uiNext">1.18x</strong></div>
    <div class="gi-col"><span>Mines</span><strong id="uiMines">3</strong></div>
</div>

<div class="grid-container" id="grid"></div>

<div class="controls">
    <div class="input-row">
        <input type="number" id="betAmount" value="10" min="10">
        <select id="minesSelect" class="mines-select">
            <option value="3">3 Mines</option>
            <option value="5">5 Mines</option>
            <option value="10">10 Mines</option>
            <option value="15">15 Mines</option>
            <option value="20">20 Mines</option>
        </select>
    </div>
    <div class="quick-btns">
        <button class="quick-btn" onclick="setBet(10)">₹10</button>
        <button class="quick-btn" onclick="setBet(100)">₹100</button>
        <button class="quick-btn" onclick="setBet(500)">₹500</button>
        <button class="quick-btn" onclick="setBet(1000)">₹1K</button>
    </div>
    <button class="btn-main" id="startBtn" onclick="startGame()">Start Game</button>
    <button class="btn-main btn-cashout" id="cashoutBtn" onclick="cashout()">Cashout ₹<span id="uiWin">0.00</span></button>
</div>

<div class="history-section">
    <div class="history-head">
        <h3>Recent Games</h3>
    </div>
    <div class="history-list" id="historyList">
        <!-- History items will load here -->
    </div>
</div>

<!-- Result Popup -->
<div class="result-popup" id="resultPopup">
  <div class="res-box" id="resBox">
    <div class="res-icon" id="resIcon">💎</div>
    <div class="res-title" id="resTitle">You Won!</div>
    <div class="res-amount" id="resAmount">₹0.00</div>
    <button class="res-btn" onclick="closePopup()">Continue</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, updateDoc, increment, collection, addDoc, serverTimestamp, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyAVQh9b7L3IYgWFIYA3wWorVBk1uXRFDZo", authDomain: "bdglottery7.firebaseapp.com", projectId: "bdglottery7", storageBucket: "bdglottery7.firebasestorage.app", messagingSenderId: "568771943906", appId: "1:568771943906:web:5b78078d9c0d67427dedbb" };
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let userBalance = 0;
let isPlaying = false;
let betAmount = 10;
let bombsArray = [];
let revealedCount = 0;
let currentMulti = 1.00;
let currentBetId = null;
const TOTAL_BOXES = 25;
let TOTAL_BOMBS = 3;
let soundEnabled = true;

const gridEl = document.getElementById('grid');
const startBtn = document.getElementById('startBtn');
const cashoutBtn = document.getElementById('cashoutBtn');
const minesSelect = document.getElementById('minesSelect');

// --- SOUND LOGIC ---
let audioCtx;
function playSound(type) {
    if (!soundEnabled) return;
    try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'click') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'win') {
            osc.type = 'triangle'; osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.1);
            osc.frequency.setValueAtTime(800, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.start(); osc.stop(audioCtx.currentTime + 0.5);
        } else if (type === 'bomb') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            osc.start(); osc.stop(audioCtx.currentTime + 0.4);
        }
    } catch(e) { console.log("Audio error"); }
}

document.getElementById('soundBtn').onclick = function() {
    soundEnabled = !soundEnabled;
    this.classList.toggle('active');
    if(soundEnabled) playSound('click');
};

// --- HELPERS ---
window.toast = function(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 2000);
}

window.setBet = function(val) {
    if(isPlaying) return;
    playSound('click');
    document.getElementById('betAmount').value = val;
}

// --- AUTH ---
onAuthStateChanged(auth, async (user) => {
    if(!user) return location.replace('index.html');
    currentUser = user;
    const snap = await getDoc(doc(db, 'users', user.uid));
    if(snap.exists()) {
        userBalance = Number(snap.data().balance || 0);
        document.getElementById('balanceVal').textContent = userBalance.toFixed(2);
    }
    renderGrid();
    loadHistory();
});

function renderGrid() {
    gridEl.innerHTML = '';
    for(let i=0; i<TOTAL_BOXES; i++) {
        const box = document.createElement('div');
        box.className = 'box';
        box.dataset.index = i;
        box.onclick = () => handleBoxClick(box);
        gridEl.appendChild(box);
    }
}

function calculateMultiplier(safes, mines) {
    if(safes === 0) return 1.00;
    let m = 1;
    for(let i=0; i<safes; i++) {
        m *= (25 - i) / (25 - i - mines);
    }
    return m * 0.95;
}

// --- START GAME (Fixed Balance Error) ---
window.startGame = async function() {
    if(isPlaying) return;
    playSound('click');
    
    betAmount = Number(document.getElementById('betAmount').value);
    TOTAL_BOMBS = Number(minesSelect.value);
    
    if(betAmount < 10) return toast('Minimum bet is ₹10');
    if(betAmount > userBalance) return toast('Insufficient Balance');

    startBtn.disabled = true;
    startBtn.textContent = 'Starting...';

    try {
        // 1. Deduct Balance from Database
        await updateDoc(doc(db, 'users', currentUser.uid), { balance: increment(-betAmount) });
        
        // 2. Update Local Balance
        userBalance -= betAmount;
        document.getElementById('balanceVal').textContent = userBalance.toFixed(2);

        // 3. Save Bet History (Ignore if fails)
        try {
            const betRef = await addDoc(collection(db, 'bets_mines'), {
                userId: currentUser.uid,
                amount: betAmount,
                mines: TOTAL_BOMBS,
                status: 'pending',
                createdAt: serverTimestamp()
            });
            currentBetId = betRef.id;
        } catch(e) {
            console.log("History save skipped - Error in DB rules");
            currentBetId = null;
        }

        // 4. Game Setup
        isPlaying = true;
        revealedCount = 0;
        currentMulti = 1.00;
        bombsArray = [];

        while(bombsArray.length < TOTAL_BOMBS) {
            let r = Math.floor(Math.random() * 25);
            if(!bombsArray.includes(r)) bombsArray.push(r);
        }

        renderGrid();
        
        document.getElementById('uiMines').textContent = TOTAL_BOMBS;
        startBtn.style.display = 'none';
        cashoutBtn.style.display = 'block';
        cashoutBtn.innerHTML = `Cashout ₹0.00`;
        document.getElementById('uiMulti').textContent = '1.00x';
        
        let nextM = calculateMultiplier(1, TOTAL_BOMBS);
        document.getElementById('uiNext').textContent = nextM.toFixed(2) + 'x';
        
        document.getElementById('betAmount').disabled = true;
        minesSelect.disabled = true;

    } catch(e) {
        console.error(e);
        toast('Balance update failed! Check connection.');
        startBtn.disabled = false;
        startBtn.textContent = 'Start Game';
    }
}

// --- BOX CLICK (Fixed Cashout Display) ---
async function handleBoxClick(box) {
    if(!isPlaying || box.classList.contains('revealed')) return;
    
    const idx = Number(box.dataset.index);
    box.classList.add('revealed');

    if(bombsArray.includes(idx)) {
        // BOMB
        playSound('bomb');
        box.classList.add('bomb');
        box.textContent = '💣';
        isPlaying = false;
        revealAllBombs();
        
        startBtn.style.display = 'block';
        startBtn.disabled = false;
        startBtn.textContent = 'Start Game';
        cashoutBtn.style.display = 'none';
        document.getElementById('betAmount').disabled = false;
        minesSelect.disabled = false;

        showResultPopup(false, betAmount);
        
        if(currentBetId) {
            updateDoc(doc(db, 'bets_mines', currentBetId), { status: 'lose', winAmount: 0 }).catch(()=>{});
        }

    } else {
        // SAFE
        playSound('click');
        box.classList.add('safe');
        box.textContent = '💎';
        revealedCount++;
        currentMulti = calculateMultiplier(revealedCount, TOTAL_BOMBS);
        
        document.getElementById('uiMulti').textContent = currentMulti.toFixed(2) + 'x';
        
        // FIX: Display Cashout Amount Properly
        const winAmt = betAmount * currentMulti;
        cashoutBtn.innerHTML = `Cashout ₹${winAmt.toFixed(2)}`;
        
        if(revealedCount < (TOTAL_BOXES - TOTAL_BOMBS)) {
            const nextM = calculateMultiplier(revealedCount + 1, TOTAL_BOMBS);
            document.getElementById('uiNext').textContent = nextM.toFixed(2) + 'x';
        } else {
            document.getElementById('uiNext').textContent = 'MAX';
            cashout(); 
        }
    }
}

function revealAllBombs() {
    document.querySelectorAll('.box').forEach(box => {
        const idx = Number(box.dataset.index);
        if(bombsArray.includes(idx) && !box.classList.contains('revealed')) {
            box.classList.add('revealed', 'bomb');
            box.textContent = '💣';
        } else if (!box.classList.contains('revealed')) {
            box.classList.add('disabled');
        }
    });
}

// --- CASHOUT ---
window.cashout = async function() {
    if(!isPlaying || revealedCount === 0) return;
    isPlaying = false;
    playSound('win');

    const grossWin = betAmount * currentMulti;
    const tax = grossWin * 0.15; 
    const finalWin = grossWin - tax;

    cashoutBtn.style.display = 'none';
    startBtn.style.display = 'block';
    startBtn.disabled = false;
    startBtn.textContent = 'Start Game';
    document.getElementById('betAmount').disabled = false;
    minesSelect.disabled = false;
    
    document.querySelectorAll('.box').forEach(b => {
        if(!b.classList.contains('revealed')) b.classList.add('disabled');
    });

    showResultPopup(true, finalWin);

    try {
        await updateDoc(doc(db, 'users', currentUser.uid), { balance: increment(finalWin) });
        userBalance += finalWin;
        document.getElementById('balanceVal').textContent = userBalance.toFixed(2);

        if(currentBetId) {
            await updateDoc(doc(db, 'bets_mines', currentBetId), {
                status: 'win', winAmount: finalWin, multiplier: currentMulti
            }).catch(()=>{});
        }
    } catch(e) {
        console.error("Cashout error", e);
    }
    loadHistory();
}

window.closePopup = function() {
    document.getElementById('resultPopup').classList.remove('show');
    document.getElementById('uiMulti').textContent = '1.00x';
    document.getElementById('uiWin').textContent = '0.00';
    document.getElementById('uiNext').textContent = '1.18x';
    renderGrid();
    loadHistory();
};

function showResultPopup(isWin, amount) {
    const popup = document.getElementById('resultPopup');
    const box = document.getElementById('resBox');
    const icon = document.getElementById('resIcon');
    const title = document.getElementById('resTitle');
    const amt = document.getElementById('resAmount');

    box.className = 'res-box ' + (isWin ? 'win' : 'lose');
    
    if(isWin) {
        icon.textContent = '💎';
        title.textContent = 'You Won!';
        amt.textContent = '+ ₹' + Number(amount).toFixed(2);
        amt.style.color = '#40ad72';
    } else {
        icon.textContent = '💥';
        title.textContent = 'Game Over';
        amt.textContent = '- ₹' + Number(amount).toFixed(2);
        amt.style.color = '#fd565c';
    }

    popup.classList.add('show');
}

// --- HISTORY FIX ---
async function loadHistory() {
    if(!currentUser) return;
    const listEl = document.getElementById('historyList');
    listEl.innerHTML = `<div style="text-align:center;color:#666;font-size:13px;padding:10px;">Loading...</div>`;
    
    try {
        const q = query(collection(db, 'bets_mines'), where('userId', '==', currentUser.uid));
        const snap = await getDocs(q);
        
        let bets = [];
        snap.forEach(doc => bets.push(doc.data()));
        
        // Sort by latest
        bets.sort((a,b) => (b.createdAt?.toMillis()||0) - (a.createdAt?.toMillis()||0));
        bets = bets.slice(0, 5);

        if(bets.length === 0) {
            listEl.innerHTML = `<div style="text-align:center;color:#666;font-size:13px;padding:10px;">No history found</div>`;
            return;
        }

        listEl.innerHTML = bets.map(b => {
            let displayStatus = b.status === 'win' ? 'Win' : (b.status === 'lose' ? 'Lose' : 'Pending');
            let displayAmt = b.status === 'win' ? '+₹' + Number(b.winAmount).toFixed(2) : '-₹' + b.amount;
            let amtClass = b.status === 'win' ? 'win-amt' : 'lose-amt';
            
            return `
            <div class="h-item ${b.status === 'win' ? 'win' : 'lose'}">
                <div>Bet: ₹${b.amount} <span style="font-size:10px;color:#a6a9ae;">(${displayStatus})</span></div>
                <div class="amount ${amtClass}">${displayAmt}</div>
            </div>
            `;
        }).join('');
    } catch(e) {
        console.error("History error:", e);
        listEl.innerHTML = `<div style="text-align:center;color:#fd565c;font-size:13px;padding:10px;">Failed to load history</div>`;
    }
}
</script>
</body>
</html>
