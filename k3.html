<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

/* IST Timezone (UTC + 5:30) Calculation */
function getISTDateComponents() {
  const now = new Date();
  const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
  const ist = new Date(utc + (3600000 * 5.5));
  const y = ist.getFullYear();
  const m = String(ist.getMonth() + 1).padStart(2, '0');
  const d = String(ist.getDate()).padStart(2, '0');
  const midnight = new Date(y, ist.getMonth(), ist.getDate(), 0, 0, 0).getTime();
  const elapsedSec = Math.floor((ist.getTime() - midnight) / 1000);
  const slotIndex = Math.floor(elapsedSec / SLOT_DURATION_SEC) + 1;
  return { y, m, d, slotIndex };
}

function getPeriodIdFromIndex(idx) {
  const { y, m, d } = getISTDateComponents();
  return `${y}${m}${d}K3${String(10000 + idx)}`;
}

function getPeriodId() {
  const { slotIndex } = getISTDateComponents();
  return getPeriodIdFromIndex(slotIndex);
}

async function pruneOldResults() {
  try {
    const snap = await getDocs(query(collection(db, RESULT_COLLECTION), limit(35)));
    if (snap.size > 15) {
      let docs = [];
      snap.forEach(d => docs.push(d));
      docs.sort((a,b) => (b.data().period || '').localeCompare(a.data().period || ''));
      const deletes = [];
      for (let i = 15; i < docs.length; i++) deletes.push(deleteDoc(docs[i].ref));
      await Promise.all(deletes);
    }
  } catch(e){}
}

function computeDeterministicResult(slotIndex, periodId) {
  const seed = (slotIndex * 9301 + 49297) % 233280;
  const d1 = (seed % 6) + 1;
  const d2 = ((seed * 2) % 6) + 1;
  const d3 = ((seed * 3) % 6) + 1;
  const sum = d1 + d2 + d3;
  const size = sum >= 11 ? 'Big' : 'Small';
  const oe = sum % 2 === 0 ? 'Even' : 'Odd';
  return { period: periodId, d1, d2, d3, sum, size, oe, slotIndex };
}

async function generateAndSaveResult(periodId, slotIndex) {
  const ref = doc(db, RESULT_COLLECTION, periodId);
  const snap = await getDoc(ref);
  if (snap.exists()) {
    await resolveBets(periodId, snap.data());
    return;
  }
  const data = { ...computeDeterministicResult(slotIndex, periodId), createdAt: serverTimestamp() };
  try {
    await runTransaction(db, async (tx) => {
      const ex = await tx.get(ref);
      if (!ex.exists()) tx.set(ref, data);
    });
  } catch(e){}
  await resolveBets(periodId, data);
  pruneOldResults();
}

/* 🔁 GAPLESS CONSECUTIVE BACKFILL (Prevents Missing Periods Forever) */
async function backfillConsecutiveSlots() {
  try {
    const { slotIndex } = getISTDateComponents();
    const snap = await getDocs(query(collection(db, RESULT_COLLECTION), limit(15)));
    let maxKnownIndex = slotIndex - 10;

    snap.forEach(d => {
      const p = d.data().period;
      if (p && p.includes('K3')) {
        const parts = p.split('K3');
        if (parts[1]) {
          const idx = parseInt(parts[1]) - 10000;
          if (!isNaN(idx) && idx > maxKnownIndex) maxKnownIndex = idx;
        }
      }
    });

    for (let s = maxKnownIndex + 1; s < slotIndex; s++) {
      const pId = getPeriodIdFromIndex(s);
      await generateAndSaveResult(pId, s);
    }
  } catch(e){}
}

async function resolveBets(periodId, resData) {
  if (!currentUser) return;
  try {
    const q = query(collection(db, BET_COLLECTION), where('userId', '==', currentUser.uid), where('period', '==', periodId));
    const snap = await getDocs(q);
    if (snap.empty) return;

    let winTotal = 0, lostTotal = 0;
    const batch = [];
    snap.forEach(d => {
      const b = d.data();
      if (b.status !== 'pending') return;
      let won = false;
      if (b.choice === resData.size || b.choice === resData.oe) won = true;
      if (b.choice === `Total ${resData.sum}`) won = true;

      let winAmt = 0;
      if (won) {
        const gross = b.amount * b.multi;
        winAmt = gross - (gross * 0.15); // 15% platform owner commission
        winTotal += winAmt;
      } else {
        lostTotal += b.amount;
      }
      batch.push(updateDoc(doc(db, BET_COLLECTION, d.id), { status: won ? 'win' : 'lose', winAmount: winAmt }));
    });
    await Promise.all(batch);

    if (winTotal > 0) {
      await updateDoc(doc(db, 'users', currentUser.uid), { balance: increment(winTotal) });
      userBalance += winTotal;
      document.getElementById('balVal').textContent = userBalance.toFixed(2);
      showPopup(true, winTotal, periodId, resData);
    } else if (lostTotal > 0) {
      showPopup(false, lostTotal, periodId, resData);
    }
    loadMyHistory();
  } catch(e){}
}

function showPopup(isWin, amount, periodId, resData) {
  const pop = document.getElementById('resultPopup');
  document.getElementById('popTitle').textContent = isWin ? 'Congratulations' : 'Better Luck Next Time';
  const d1 = resData.d1 || 1, d2 = resData.d2 || 2, d3 = resData.d3 || 3;
  document.getElementById('popDicePill').textContent = `${diceSymbols[d1]} ${diceSymbols[d2]} ${diceSymbols[d3]}`;
  document.getElementById('popSumPill').textContent = resData.sum || (d1 + d2 + d3);
  document.getElementById('popSizePill').textContent = resData.size || 'Small';

  document.getElementById('popTicketLbl').textContent = isWin ? 'Bonus' : 'Loss';
  document.getElementById('popTicketAmt').textContent = (isWin ? '₹' : '-₹') + Number(amount).toFixed(2);
  document.getElementById('popTicketPeriod').textContent = `Period: ${periodId}`;

  pop.classList.add('show');

  if (autoCloseTimer) clearInterval(autoCloseTimer);
  let sec = 3;
  document.getElementById('popTimerCount').textContent = `${sec} seconds auto close`;
  autoCloseTimer = setInterval(() => {
    sec--;
    if (sec <= 0) {
      clearInterval(autoCloseTimer);
      closeResultPopup();
    } else {
      document.getElementById('popTimerCount').textContent = `${sec} seconds auto close`;
    }
  }, 1000);
}

window.closeResultPopup = () => {
  if (autoCloseTimer) clearInterval(autoCloseTimer);
  document.getElementById('resultPopup').classList.remove('show');
};

onAuthStateChanged(auth, async (user) => {
  if (!user) return location.replace('index.html');
  currentUser = user;
  const snap = await getDoc(doc(db, 'users', user.uid));
  if (snap.exists()) {
    userBalance = Number(snap.data().balance || 0);
    document.getElementById('balVal').textContent = userBalance.toFixed(2);
  }
  await backfillConsecutiveSlots();
  startTimer();
  loadGameHistory();
});

function startTimer() {
  let lastPeriod = '';
  setInterval(() => {
    const now = Date.now();
    const period = getPeriodId();
    const { slotIndex } = getISTDateComponents();
    const secLeft = SLOT_DURATION_SEC - (Math.floor(now / 1000) % SLOT_DURATION_SEC);

    if (lastPeriod !== '' && period !== lastPeriod) {
      const prevIdx = slotIndex - 1;
      const prevPeriod = getPeriodIdFromIndex(prevIdx);
      generateAndSaveResult(prevPeriod, prevIdx).then(loadGameHistory);
    }
    lastPeriod = period;
    currentPeriod = period;
    document.getElementById('curPeriodText').textContent = period;

    const s = secLeft % 60;
    document.getElementById('tMin1').textContent = '0';
    document.getElementById('tMin2').textContent = '0';
    document.getElementById('tSec1').textContent = Math.floor(s / 10);
    document.getElementById('tSec2').textContent = s % 10;

    const overlay = document.getElementById('drawOverlay');
    const bBoard = document.getElementById('betBoard');

    if (secLeft <= 5) {
      isBettingClosed = true;
      bBoard.style.opacity = '0.4';
      bBoard.style.pointerEvents = 'none';
      overlay.classList.add('show');
      document.getElementById('drawD1').textContent = '0';
      document.getElementById('drawD2').textContent = secLeft;

      if (lastPlayedSec !== secLeft) {
        lastPlayedSec = secLeft;
        playTick(secLeft <= 3);
      }
    } else {
      isBettingClosed = false;
      bBoard.style.opacity = '1';
      bBoard.style.pointerEvents = 'auto';
      overlay.classList.remove('show');
      lastPlayedSec = -1;
    }
  }, 200);
}

window.openBet = (choice, multi) => {
  if (isBettingClosed) return toast('Betting closed for this round');
  selectedChoice = choice; selectedMulti = multi;
  document.getElementById('sheetChoice').textContent = choice;
  document.getElementById('betModal').classList.add('show');
};
window.closeBet = () => document.getElementById('betModal').classList.remove('show');

window.confirmBet = async () => {
  const amt = parseInt(document.getElementById('manualAmtInput').value) || 10;
  if (amt > userBalance) return toast('Insufficient balance');

  const btn = document.getElementById('btnPlace');
  btn.disabled = true;

  try {
    await updateDoc(doc(db, 'users', currentUser.uid), { balance: increment(-amt) });
    userBalance -= amt;
    document.getElementById('balVal').textContent = userBalance.toFixed(2);

    await addDoc(collection(db, BET_COLLECTION), {
      userId: currentUser.uid, period: currentPeriod, choice: selectedChoice, multi: selectedMulti,
      amount: amt, status: 'pending', createdAt: serverTimestamp()
    });
    toast(`Bet placed on ${selectedChoice}!`);
    closeBet();
    loadMyHistory();
  } catch(e){ toast('Error placing bet'); }
  finally { btn.disabled = false; }
};

async function loadGameHistory() {
  const rBox = document.getElementById('historyRows');
  const dPrev = document.getElementById('topDicePrev');
  try {
    const q = query(collection(db, RESULT_COLLECTION), limit(15));
    const snap = await getDocs(q);
    let arr = [];
    snap.forEach(d => arr.push(d.data()));
    arr.sort((a,b) => (b.period||'').localeCompare(a.period||''));

    if (arr[0]) {
      const topD1 = arr[0].d1 || 1;
      const topD2 = arr[0].d2 || 2;
      const topD3 = arr[0].d3 || 3;
      dPrev.innerHTML = `<div class="dice-cube">${diceSymbols[topD1]}</div><div class="dice-cube">${diceSymbols[topD2]}</div><div class="dice-cube">${diceSymbols[topD3]}</div>`;
    }

    rBox.innerHTML = arr.slice(0, 10).map(d => {
      const d1 = d.d1 || (d.number ? (d.number % 6) + 1 : 1);
      const d2 = d.d2 || ((d1 + 1) % 6 + 1);
      const d3 = d.d3 || ((d2 + 1) % 6 + 1);
      const sum = d.sum || (d1 + d2 + d3);
      const size = d.size || (sum >= 11 ? 'Big' : 'Small');
      return `
        <div class="th-row">
          <div class="col-period">${d.period}</div>
          <div class="col col-dice"><span>${diceSymbols[d1]}</span> <span>${diceSymbols[d2]}</span> <span>${diceSymbols[d3]}</span></div>
          <div class="col" style="color:var(--gold);font-weight:900;">${sum} (${size})</div>
        </div>`;
    }).join('');
  } catch(e){}
}

async function loadMyHistory() {
  const mBox = document.getElementById('myRows');
  try {
    const q = query(collection(db, BET_COLLECTION), where('userId', '==', currentUser.uid), limit(15));
    const snap = await getDocs(q);
    if (snap.empty) { mBox.innerHTML = '<div style="text-align:center;padding:20px;color:#777;font-size:12px;">No bets yet</div>'; return; }
    let arr = [];
    snap.forEach(d => arr.push(d.data()));
    arr.sort((a,b) => (b.createdAt?.toMillis()||0) - (a.createdAt?.toMillis()||0));
    mBox.innerHTML = arr.slice(0, 8).map(b => `
      <div class="th-row">
        <div class="col-period">${b.period.slice(-8)}</div>
        <div class="col" style="font-weight:700;">${b.choice} (₹${b.amount})</div>
        <div class="col" style="font-weight:900;color:${b.status==='win'?'#00b977':(b.status==='lose'?'#f44336':'#e5a93b')};">
          ${b.status==='win'?'+₹'+Number(b.winAmount).toFixed(2):(b.status==='lose'?'-₹'+b.amount:'Pending')}
        </div>
      </div>
    `).join('');
  } catch(e){}
}

window.switchTab = (tab, el) => {
  document.querySelectorAll('.t-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('gameView').style.display = tab === 'game' ? 'block' : 'none';
  document.getElementById('myView').style.display = tab === 'my' ? 'block' : 'none';
  if (tab === 'my') loadMyHistory();
};
</script>
