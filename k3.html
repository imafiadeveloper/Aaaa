<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1a1a">
<title>BDG WIN - K3 Dice</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Orbitron:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --gold: #e5a93b;
  --gold-bg: linear-gradient(180deg, #F9DC8A 0%, #D8AA4D 100%);
  --bg-main: #181818;
  --card-dark: #242424;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:'Inter',sans-serif;}
body{background:var(--bg-main);color:#fff;min-height:100vh;padding-bottom:30px;}
button{border:none;outline:none;cursor:pointer;background:transparent;color:inherit;}
::-webkit-scrollbar{width:0;height:0;}

.navbar{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;height:50px;padding:0 14px;background:#242424;}
.nav-left{width:32px;height:32px;display:flex;align-items:center;cursor:pointer;}
.nav-left svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2.4;}
.navbar-brand{font-family:'Orbitron',sans-serif;font-size:18px;font-weight:900;color:#FAE59F;letter-spacing:1px;text-align:center;}

.wallet-card{
  margin:10px 12px;background:linear-gradient(135deg,#363a45 0%,#262830 100%);
  border-radius:18px;padding:14px 16px;text-align:center;
}
.bal-wrap{display:flex;align-items:center;justify-content:center;gap:6px;font-family:'Orbitron',sans-serif;font-size:22px;font-weight:900;}
.bal-wrap svg{width:16px;height:16px;stroke:#a6a9ae;fill:none;stroke-width:2.2;cursor:pointer;}
.wal-label{font-size:11px;color:#a6a9ae;margin-top:2px;}
.wal-actions{display:flex;gap:12px;margin-top:12px;}
.btn-w{flex:1;height:38px;border-radius:20px;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.btn-withdraw{background:#f44336;color:#fff;}
.btn-deposit{background:#00b977;color:#fff;}

.ticket-card{
  margin:0 12px 10px;background:linear-gradient(135deg, #f5d47a 0%, #d8a846 100%);
  border-radius:18px;padding:14px;color:#332205;position:relative;
}
.tc-top{display:flex;justify-content:space-between;align-items:flex-start;}
.tc-mode-title{font-size:14px;font-weight:900;}
.tc-boxes{display:flex;gap:3px;margin-top:4px;justify-content:flex-end;}
.tc-digit{background:#111;color:#fff;font-family:'Orbitron',sans-serif;font-size:16px;font-weight:900;padding:3px 6px;border-radius:4px;}
.tc-colon{color:#111;font-weight:900;line-height:24px;}
.tc-dice-preview{display:flex;gap:6px;margin-top:10px;}
.dice-icon{width:26px;height:26px;border-radius:6px;background:#fff;color:#111;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;}
.tc-period{position:absolute;bottom:10px;right:14px;font-family:'Orbitron',sans-serif;font-size:11px;font-weight:800;}

/* K3 Betting Area */
.bet-board{margin:0 12px 14px;background:#262626;border-radius:18px;padding:14px;}
.k3-options{display:grid;grid-template-columns:repeat(4, 1fr);gap:8px;margin-bottom:12px;}
.k3-btn{height:46px;border-radius:10px;background:#1b1b1b;border:1px solid rgba(255,255,255,0.08);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:800;}
.k3-btn:active{border-color:var(--gold);}
.k3-btn span{font-size:10px;color:var(--gold);}

.size-oe-row{display:grid;grid-template-columns:repeat(4, 1fr);gap:8px;}
.sz-btn{height:42px;border-radius:10px;font-size:13px;font-weight:800;color:#fff;display:flex;align-items:center;justify-content:center;}
.sz-btn.big{background:#f5a623;}
.sz-btn.small{background:#4a90e2;}
.sz-btn.odd{background:#00b977;}
.sz-btn.even{background:#9c27b0;}

/* Table */
.hist-table{margin:0 12px;background:#242424;border-radius:12px;overflow:hidden;}
.th-head{display:flex;background:#2f3440;padding:10px 0;font-size:11px;color:#9aa0ad;font-weight:700;}
.th-row{display:flex;padding:10px 0;font-size:12px;align-items:center;border-bottom:1px solid rgba(255,255,255,0.04);}
.col{flex:1;text-align:center;}
.col-period{flex:1.4;font-family:'Orbitron',sans-serif;font-size:11px;color:#ddd;}

/* Draw Overlay */
.exact-draw-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(3px);z-index:9999;display:none;align-items:center;justify-content:center;gap:16px;}
.exact-draw-overlay.show{display:flex;}
.draw-flip-card{width:110px;height:160px;background:#424242;border-radius:16px;display:flex;align-items:center;justify-content:center;}
.draw-flip-digit{font-family:'Orbitron',sans-serif;font-size:80px;font-weight:900;color:#e5a93b;}

/* Bet Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:10000;display:none;align-items:flex-end;}
.modal-overlay.show{display:flex;}
.sheet{width:100%;background:#262626;border-radius:20px 20px 0 0;padding:18px 16px 24px;}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.sheet-head h3{font-size:15px;font-weight:800;}
.sheet-close{font-size:22px;color:#999;cursor:pointer;}
.manual-input-box{display:flex;align-items:center;background:#1a1a1a;border:1px solid #444;border-radius:8px;padding:6px 12px;margin:12px 0;}
.manual-input-box span{color:var(--gold);font-weight:800;font-size:14px;margin-right:6px;}
.manual-input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-family:'Orbitron',sans-serif;font-size:16px;font-weight:800;}
.btn-place{width:100%;height:46px;border-radius:12px;background:var(--gold-bg);color:#221500;font-size:15px;font-weight:900;}
.toast{position:fixed;top:20%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.9);color:#fff;padding:10px 20px;border-radius:8px;font-size:12px;font-weight:700;z-index:99999;display:none;}
</style>
</head>
<body>

<header class="navbar">
  <div class="nav-left" onclick="location.href='home.html'"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></div>
  <div class="navbar-brand">BDG K3 DICE</div>
  <div></div>
</header>

<div class="wallet-card">
  <div class="bal-wrap">₹<span id="balVal">0.00</span> <svg viewBox="0 0 24 24" onclick="location.reload()"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg></div>
  <div class="wal-label">Wallet balance</div>
  <div class="wal-actions">
    <button class="btn-w btn-withdraw" onclick="location.href='withdraw.html'">Withdraw</button>
    <button class="btn-w btn-deposit" onclick="location.href='deposit.html'">Deposit</button>
  </div>
</div>

<div class="ticket-card">
  <div class="tc-top">
    <div>
      <div class="tc-mode-title">K3 Dice 1 Min</div>
      <div class="tc-dice-preview" id="topDicePrev"></div>
    </div>
    <div>
      <div class="tc-boxes">
        <span class="tc-digit" id="tMin1">0</span><span class="tc-digit" id="tMin2">0</span>
        <span class="tc-colon">:</span>
        <span class="tc-digit" id="tSec1">0</span><span class="tc-digit" id="tSec2">0</span>
      </div>
    </div>
  </div>
  <div class="tc-period" id="curPeriodText">Loading...</div>
</div>

<div class="bet-board" id="betBoard">
  <div class="k3-options">
    <button class="k3-btn" onclick="openBet('Total 3', 200)">3<span>200X</span></button>
    <button class="k3-btn" onclick="openBet('Total 4', 70)">4<span>70X</span></button>
    <button class="k3-btn" onclick="openBet('Total 5', 30)">5<span>30X</span></button>
    <button class="k3-btn" onclick="openBet('Total 6', 18)">6<span>18X</span></button>
    <button class="k3-btn" onclick="openBet('Total 7', 12)">7<span>12X</span></button>
    <button class="k3-btn" onclick="openBet('Total 8', 8)">8<span>8X</span></button>
    <button class="k3-btn" onclick="openBet('Total 9', 7)">9<span>7X</span></button>
    <button class="k3-btn" onclick="openBet('Total 10', 6)">10<span>6X</span></button>
  </div>
  <div class="size-oe-row">
    <button class="sz-btn big" onclick="openBet('Big', 1.95)">Big</button>
    <button class="sz-btn small" onclick="openBet('Small', 1.95)">Small</button>
    <button class="sz-btn odd" onclick="openBet('Odd', 1.95)">Odd</button>
    <button class="sz-btn even" onclick="openBet('Even', 1.95)">Even</button>
  </div>
</div>

<div class="hist-table">
  <div class="th-head"><div class="col-period">Period</div><div class="col">Dice Result</div><div class="col">Sum</div></div>
  <div id="historyRows"></div>
</div>

<div class="exact-draw-overlay" id="drawOverlay">
  <div class="draw-flip-card"><div class="draw-flip-digit" id="drawD1">0</div></div>
  <div class="draw-flip-card"><div class="draw-flip-digit" id="drawD2">5</div></div>
</div>

<div class="modal-overlay" id="betModal">
  <div class="sheet">
    <div class="sheet-head">
      <h3>K3 Dice - <span id="sheetChoice" style="color:#FAE59F;">BIG</span></h3>
      <div class="sheet-close" onclick="closeBet()">×</div>
    </div>
    <div class="manual-input-box">
      <span>₹</span>
      <input type="number" id="manualAmtInput" class="manual-input" value="10" min="1">
    </div>
    <button class="btn-place" onclick="confirmBet()">Confirm Bet</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, doc, getDoc, updateDoc, increment, collection,
  addDoc, serverTimestamp, query, limit, getDocs, deleteDoc,
  where, runTransaction
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAVQh9b7L3IYgWFIYA3wWorVBk1uXRFDZo",
  authDomain: "bdglottery7.firebaseapp.com",
  projectId: "bdglottery7",
  storageBucket: "bdglottery7.firebasestorage.app",
  messagingSenderId: "568771943906",
  appId: "1:568771943906:web:5b78078d9c0d67427dedbb"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// EXACT RULES MATCH
const RESULT_COLLECTION = 'results_k3';
const BET_COLLECTION = 'bets_k3';
const SLOT_DURATION_SEC = 60;

let currentUser = null, userBalance = 0, currentPeriod = '';
let selectedChoice = '', selectedMulti = 1.95;
let isBettingClosed = false;

window.toast = (msg) => {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 1800);
};

function getISTDateComponents() {
  const now = new Date();
  const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
  const ist = new Date(utc + (3600000 * 5.5));
  const y = ist.getFullYear();
  const m = String(ist.getMonth() + 1).padStart(2, '0');
  const d = String(ist.getDate()).padStart(2, '0');
  const midnight = new Date(y, ist.getMonth(), ist.getDate(), 0, 0, 0).getTime();
  const elapsedSec = Math.floor((ist.getTime() - midnight) / 1000);
  const slotIndex = Math.floor(elapsedSec / SLOT_DURATION_SEC) + 1;
  return { y, m, d, slotIndex };
}

function getPeriodId() {
  const { y, m, d, slotIndex } = getISTDateComponents();
  return `${y}${m}${d}K3${String(10000 + slotIndex)}`;
}

async function pruneOldResults() {
  try {
    const snap = await getDocs(query(collection(db, RESULT_COLLECTION), limit(35)));
    if (snap.size > 15) {
      let docs = [];
      snap.forEach(d => docs.push(d));
      docs.sort((a,b) => (b.data().period || '').localeCompare(a.data().period || ''));
      const deletes = [];
      for (let i = 15; i < docs.length; i++) deletes.push(deleteDoc(docs[i].ref));
      await Promise.all(deletes);
    }
  } catch(e){}
}

function computeDeterministicResult(slotIndex, periodId) {
  const seed = (slotIndex * 9301 + 49297) % 233280;
  const d1 = (seed % 6) + 1;
  const d2 = ((seed * 2) % 6) + 1;
  const d3 = ((seed * 3) % 6) + 1;
  const sum = d1 + d2 + d3;
  const size = sum >= 11 ? 'Big' : 'Small';
  const oe = sum % 2 === 0 ? 'Even' : 'Odd';
  return { period: periodId, d1, d2, d3, sum, size, oe, slotIndex };
}

async function generateAndSaveResult(periodId, slotIndex) {
  const ref = doc(db, RESULT_COLLECTION, periodId);
  const snap = await getDoc(ref);
  if (snap.exists()) {
    await resolveBets(periodId, snap.data());
    return;
  }
  const data = { ...computeDeterministicResult(slotIndex, periodId), createdAt: serverTimestamp() };
  try {
    await runTransaction(db, async (tx) => {
      const ex = await tx.get(ref);
      if (!ex.exists()) tx.set(ref, data);
    });
  } catch(e){}
  await resolveBets(periodId, data);
  pruneOldResults();
}

async function resolveBets(periodId, resData) {
  if (!currentUser) return;
  try {
    const q = query(collection(db, BET_COLLECTION), where('userId', '==', currentUser.uid), where('period', '==', periodId));
    const snap = await getDocs(q);
    if (snap.empty) return;

    let winTotal = 0;
    const batch = [];
    snap.forEach(d => {
      const b = d.data();
      if (b.status !== 'pending') return;
      let won = false;
      if (b.choice === resData.size || b.choice === resData.oe) won = true;
      if (b.choice === `Total ${resData.sum}`) won = true;

      let winAmt = 0;
      if (won) {
        const gross = b.amount * b.multi;
        winAmt = gross - (gross * 0.15); // 15% platform fee
        winTotal += winAmt;
      }
      batch.push(updateDoc(doc(db, BET_COLLECTION, d.id), { status: won ? 'win' : 'lose', winAmount: winAmt }));
    });
    await Promise.all(batch);

    if (winTotal > 0) {
      await updateDoc(doc(db, 'users', currentUser.uid), { balance: increment(winTotal) });
      userBalance += winTotal;
      document.getElementById('balVal').textContent = userBalance.toFixed(2);
      toast(`K3 Won ₹${winTotal.toFixed(2)}!`);
    }
  } catch(e){}
}

onAuthStateChanged(auth, async (user) => {
  if (!user) return location.replace('index.html');
  currentUser = user;
  const snap = await getDoc(doc(db, 'users', user.uid));
  if (snap.exists()) {
    userBalance = Number(snap.data().balance || 0);
    document.getElementById('balVal').textContent = userBalance.toFixed(2);
  }
  startTimer();
  loadGameHistory();
});

function startTimer() {
  let lastPeriod = '';
  setInterval(() => {
    const now = Date.now();
    const period = getPeriodId();
    const { slotIndex } = getISTDateComponents();
    const secLeft = SLOT_DURATION_SEC - (Math.floor(now / 1000) % SLOT_DURATION_SEC);

    if (lastPeriod !== '' && period !== lastPeriod) {
      const prevIdx = slotIndex - 1;
      const { y, m, d } = getISTDateComponents();
      const prevPeriod = `${y}${m}${d}K3${String(10000 + prevIdx)}`;
      generateAndSaveResult(prevPeriod, prevIdx).then(loadGameHistory);
    }
    lastPeriod = period;
    currentPeriod = period;
    document.getElementById('curPeriodText').textContent = period;

    const s = secLeft % 60;
    document.getElementById('tSec1').textContent = Math.floor(s / 10);
    document.getElementById('tSec2').textContent = s % 10;

    const overlay = document.getElementById('drawOverlay');
    if (secLeft <= 5) {
      isBettingClosed = true;
      overlay.classList.add('show');
      document.getElementById('drawD1').textContent = '0';
      document.getElementById('drawD2').textContent = secLeft;
    } else {
      isBettingClosed = false;
      overlay.classList.remove('show');
    }
  }, 250);
}

window.openBet = (choice, multi) => {
  if (isBettingClosed) return toast('Betting closed for this round');
  selectedChoice = choice; selectedMulti = multi;
  document.getElementById('sheetChoice').textContent = choice;
  document.getElementById('betModal').classList.add('show');
};
window.closeBet = () => document.getElementById('betModal').classList.remove('show');

window.confirmBet = async () => {
  const amt = parseInt(document.getElementById('manualAmtInput').value) || 10;
  if (amt > userBalance) return toast('Insufficient balance');

  try {
    await updateDoc(doc(db, 'users', currentUser.uid), { balance: increment(-amt) });
    userBalance -= amt;
    document.getElementById('balVal').textContent = userBalance.toFixed(2);

    await addDoc(collection(db, BET_COLLECTION), {
      userId: currentUser.uid, period: currentPeriod, choice: selectedChoice, multi: selectedMulti,
      amount: amt, status: 'pending', createdAt: serverTimestamp()
    });
    toast(`Bet placed on ${selectedChoice}!`);
    closeBet();
  } catch(e){}
};

async function loadGameHistory() {
  const rBox = document.getElementById('historyRows');
  const dPrev = document.getElementById('topDicePrev');
  try {
    const q = query(collection(db, RESULT_COLLECTION), limit(15));
    const snap = await getDocs(q);
    let arr = [];
    snap.forEach(d => arr.push(d.data()));
    arr.sort((a,b) => (b.period||'').localeCompare(a.period||''));

    if (arr[0]) {
      dPrev.innerHTML = `<div class="dice-icon">${arr[0].d1}</div><div class="dice-icon">${arr[0].d2}</div><div class="dice-icon">${arr[0].d3}</div>`;
    }

    rBox.innerHTML = arr.slice(0, 10).map(d => `
      <div class="th-row">
        <div class="col-period">${d.period}</div>
        <div class="col">${d.d1}, ${d.d2}, ${d.d3}</div>
        <div class="col" style="color:var(--gold);font-weight:900;">${d.sum} (${d.size})</div>
      </div>
    `).join('');
  } catch(e){}
}
</script>
</body>
</html>
