    <!-- Firebase Login Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = { apiKey: "AIzaSyADbcwPjDhg2ATFc9nMhstV8o1gD18WMw0", authDomain: "airavattt.firebaseapp.com", databaseURL: "https://airavattt-default-rtdb.firebaseio.com", projectId: "airavattt", storageBucket: "airavattt.appspot.com", messagingSenderId: "906559825335", appId: "1:906559825335:web:0c11437318fbd2aec4b432" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        document.getElementById('loginBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            let phone = document.getElementById('username').value.trim();
            let password = document.getElementById('passwordfield').value.trim();
            if (!phone || !password) { alert("Please fill in the required section"); return; }
            
            let btn = e.target; btn.innerText = "Loading..."; btn.disabled = true;
            try {
                const dbRef = ref(db);
                const snapshot = await get(child(dbRef, `users/${phone}`));
                
                if (!snapshot.exists()) { alert("Account does not exist"); btn.innerText = "Log in"; btn.disabled = false; return; }
                const userData = snapshot.val();
                if (userData.password !== password) { alert("Wrong password"); btn.innerText = "Log in"; btn.disabled = false; return; }
                if (userData.status === "blocked") { alert("Account blocked."); btn.innerText = "Log in"; btn.disabled = false; return; }

                localStorage.setItem('bdg_user', phone);
                setTimeout(() => { location.href = 'user.html'; }, 500);
            } catch (error) {
                alert("Database error."); btn.innerText = "Log in"; btn.disabled = false;
            }
        });

        function showPass() {
          var x = document.getElementById("passwordfield");
          var y = document.getElementById("eyeicon");
          if (x.type === "password") { x.type = "text"; y.src="./index_files/eyeVisible-7bc1c956.png"; } 
          else { x.type = "password"; y.src="./index_files/eyeInvisible-2fa5c152.png"; }
        }
    </script>
