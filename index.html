    <style>
        body { background-color: #292929; margin: 0; padding: 0; font-size: 40px; }
        .msg-content { animation: zoom-in .45s ease reverse; }

<body style="font-size: 12px">
<div id="app" data-v-app="" style="background:#292929">
  <div data-v-8752c961="" class="login__container">
    <!-- Navbar -->
    <div data-v-58c5e826="" data-v-8752c961="" class="navbar">
      <div data-v-58c5e826="" class="navbar-fixed" style="background: rgb(63,63,63);">
        <div data-v-58c5e826="" class="navbar__content">
          <div data-v-58c5e826="" class="navbar__content-center">
            <div data-v-58c5e826="" class="headLogo" style="background-image:url(https://www.bigdaddygame2.com/index_files/h5setting_202401100608011fs2.png);"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Heading -->
    <div data-v-8752c961="" class="login__container-heading">
      <h1 data-v-8752c961="" class="login__container-heading__title">Log in</h1>
      <div data-v-8752c961="" class="login__container-heading__subTitle">
        <div data-v-8752c961="">Please log in with your phone number</div>
      </div>
    </div>

    <!-- Form -->
    <div data-v-8752c961="" class="login__container-form">
      <div data-v-8752c961="" class="tab-content activecontent">
        <div data-v-0ce8d964="" data-v-8752c961="" class="signIn__container">
          
          <!-- Phone Input -->
          <div data-v-93f53084="" data-v-0ce8d964="" class="phoneInput__container">
            <div data-v-93f53084="" class="phoneInput__container-label">
              <span data-v-93f53084="">Phone number</span>
            </div>
            <div data-v-93f53084="" class="phoneInput__container-input">
              <input id="username" type="text" placeholder="Please enter the phone number" required>
            </div>
          </div>

          <!-- Password Input -->
          <div data-v-57d49070="" data-v-0ce8d964="" class="passwordInput__container">
            <div data-v-57d49070="" class="passwordInput__container-label">
              <span data-v-57d49070="">Password</span>
            </div>
            <div data-v-57d49070="" class="passwordInput__container-input">
              <input id="passwordfield" type="password" placeholder="Please enter Password" required>
            </div>
          </div>

          <!-- Buttons -->
          <div data-v-0ce8d964="" class="signIn__container-button">
            <button data-v-0ce8d964="" class="active" id="loginBtn">Log in</button>
            <button data-v-0ce8d964="" class="register" onclick="window.location='register.html'">Register</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Firebase Logic -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyADbcwPjDhg2ATFc9nMhstV8o1gD18WMw0",
      authDomain: "airavattt.firebaseapp.com",
      databaseURL: "https://airavattt-default-rtdb.firebaseio.com",
      projectId: "airavattt",
      storageBucket: "airavattt.appspot.com",
      messagingSenderId: "906559825335",
      appId: "1:906559825335:web:0c11437318fbd2aec4b432"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    document.getElementById('loginBtn').addEventListener('click', async (e) => {
        e.preventDefault();
        let phone = document.getElementById('username').value.trim();
        let password = document.getElementById('passwordfield').value.trim();
        
        if (!phone || !password) { alert("Please fill all fields"); return; }

        let btn = e.target;
        btn.innerText = "Logging in...";
        btn.disabled = true;

        try {
            const dbRef = ref(db);
            const snapshot = await get(child(dbRef, `users/${phone}`));
            
            if (!snapshot.exists()) {
                alert("Account does not exist");
                btn.innerText = "Log in"; btn.disabled = false; return;
            }
            
            const userData = snapshot.val();
            if (userData.password !== password) {
                alert("Wrong password");
                btn.innerText = "Log in"; btn.disabled = false; return;
            }
            if (userData.status === "blocked") {
                alert("Account blocked. Contact admin.");
                btn.innerText = "Log in"; btn.disabled = false; return;
            }

            // Success
            localStorage.setItem('bdg_user', phone);
            window.location.href = 'user.html';

        } catch (error) {
            console.error(error);
            alert("Database error. Check Firebase rules.");
            btn.innerText = "Log in"; btn.disabled = false;
        }
    });

    // Adjust UI
    $(window).on('load', function() { let w = $('body').width(); $('html').css('font-size', (w/10)+'px'); });
    $(window).resize(function() { let w = $('body').width(); $('html').css('font-size', (w/10)+'px'); });
</script>
</body>
</html>
