    <!-- Firebase Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get, child, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyADbcwPjDhg2ATFc9nMhstV8o1gD18WMw0",
          authDomain: "airavattt.firebaseapp.com",
          databaseURL: "https://airavattt-default-rtdb.firebaseio.com",
          projectId: "airavattt",
          storageBucket: "airavattt.appspot.com",
          messagingSenderId: "906559825335",
          appId: "1:906559825335:web:0c11437318fbd2aec4b432"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- TAB SWITCHING LOGIC ---
        window.switchTab = function(type) {
            if(type === 'phone') {
                document.getElementById('tabPhone').classList.add('active');
                document.getElementById('tabEmail').classList.remove('active');
                document.getElementById('contentPhone').style.display = 'block';
                document.getElementById('contentEmail').style.display = 'none';
            } else {
                document.getElementById('tabEmail').classList.add('active');
                document.getElementById('tabPhone').classList.remove('active');
                document.getElementById('contentEmail').style.display = 'block';
                document.getElementById('contentPhone').style.display = 'none';
            }
        }

        // --- SHOW/HIDE PASSWORD ---
        window.showPass = function(inputId, iconId) {
            var x = document.getElementById(inputId);
            var y = document.getElementById(iconId);
            if (x.type === "password") {
                x.type = "text";
                y.src="./index_files/eyeVisible-7bc1c956.png";
            } else {
                x.type = "password";
                y.src="./index_files/eyeInvisible-2fa5c152.png";
            }
        }

        // --- ALERT MESSAGE ---
        window.alertMess = function(text) {
            let length = $('.alert-toast .msg').length;
            if (length == 0) {
                $('.alert-toast').append(`<div class="msg"><div class="msg-content" style="display:block; color:white; background:rgba(0,0,0,0.8); padding:10px; border-radius:5px; font-size:14px;"> ${text} </div></div>`);
                setTimeout(() => { $('.msg').fadeOut(); setTimeout(() => { $('.alert-toast .msg').remove(); }, 100); }, 2500);
            }
        }

        // --- LOGIN LOGIC (Firebase) ---
        document.getElementById('loginBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            
            // Check which tab is active
            let isPhone = document.getElementById('tabPhone').classList.contains('active');
            let username = isPhone ? document.getElementById('username').value.trim() : document.getElementById('userEmail').value.trim();
            let password = isPhone ? document.getElementById('passwordfield').value.trim() : document.getElementById('emailPassword').value.trim();
            
            if (!username || !password) {
                alertMess("Please fill in the required section");
                return;
            }

            $('.van-overlay').fadeIn(10);
            let btn = e.target;
            btn.innerText = "Logging in..."; btn.disabled = true;

            try {
                // Agar email hai to usko phone format me convert karenge, ya direct use karenge
                // Yahan hum direct username use kar rahe hain (Phone ya Email dono chalenge)
                const dbRef = ref(db);
                const snapshot = await get(child(dbRef, `users/${username}`));
                
                if (!snapshot.exists()) {
                    $('.van-overlay').fadeOut(300);
                    alertMess("Account does not exist");
                    btn.innerText = "Log in"; btn.disabled = false; return;
                }
                
                const userData = snapshot.val();
                if (userData.password !== password) {
                    $('.van-overlay').fadeOut(300);
                    alertMess("Wrong password");
                    btn.innerText = "Log in"; btn.disabled = false; return;
                }
                if (userData.status === "blocked") {
                    $('.van-overlay').fadeOut(300);
                    alertMess("Account blocked. Contact service.");
                    btn.innerText = "Log in"; btn.disabled = false; return;
                }

                // Success
                $('.van-overlay').fadeOut(300);
                localStorage.setItem('bdg_user', username);
                setTimeout(() => { location.href = 'user.html'; }, 500);

            } catch (error) {
                console.error(error);
                $('.van-overlay').fadeOut(300);
                alertMess("Database error.");
                btn.innerText = "Log in"; btn.disabled = false;
            }
        });

        // --- FORGOT PASSWORD LOGIC ---
        window.openForgot = function() { document.getElementById('forgotPopup').style.display = 'flex'; }
        window.closeForgot = function() { document.getElementById('forgotPopup').style.display = 'none'; }
        
        let generatedOtp = "";

        window.sendOtp = async function() {
            let phone = document.getElementById('forgotPhone').value.trim();
            if(!phone) { alert("Enter phone number"); return; }

            try {
                const dbRef = ref(db);
                const snapshot = await get(child(dbRef, `users/${phone}`));
                if (!snapshot.exists()) { alert("Phone number not registered"); return; }

                // Generate 6 digit OTP
                generatedOtp = Math.floor(100000 + Math.random() * 900000).toString();
                
                // Save OTP to DB
                await update(ref(db, 'users/' + phone), { otp: generatedOtp });
                
                // DEMO: Show OTP in alert
                alert("Demo OTP Sent: " + generatedOtp);
                
            } catch(e) { alert("Error sending OTP"); }
        }

        window.resetPassword = async function() {
            let phone = document.getElementById('forgotPhone').value.trim();
            let otp = document.getElementById('forgotOtp').value.trim();
            let newPass = document.getElementById('forgotNewPass').value.trim();

            if(!phone || !otp || !newPass) { alert("Fill all fields"); return; }

            try {
                const dbRef = ref(db);
                const snapshot = await get(child(dbRef, `users/${phone}`));
                if (!snapshot.exists()) { alert("User not found"); return; }

                let userData = snapshot.val();
                if(userData.otp !== otp) { alert("Invalid OTP"); return; }

                // Update Password
                await update(ref(db, 'users/' + phone), { password: newPass, otp: "" });
                alert("Password Reset Successful! Please log in.");
                closeForgot();
                
            } catch(e) { alert("Error resetting password"); }
        }

        // On load effects
        $(window).on('load', function() {
          $('.van-overlay').fadeIn(10);
          setTimeout(function() { $('.van-overlay').fadeOut(300); }, 500);
        });
    </script>
