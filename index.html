    <!-- Firebase Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyADbcwPjDhg2ATFc9nMhstV8o1gD18WMw0",
          authDomain: "airavattt.firebaseapp.com",
          databaseURL: "https://airavattt-default-rtdb.firebaseio.com",
          projectId: "airavattt",
          storageBucket: "airavattt.appspot.com",
          messagingSenderId: "906559825335",
          appId: "1:906559825335:web:0c11437318fbd2aec4b432"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        document.getElementById('loginBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            let phone = document.getElementById('username').value.trim();
            let password = document.getElementById('passwordfield').value.trim();
            
            if (!phone || !password) {
                alertMess("Please fill in the required section");
                return;
            }

            $('.van-overlay').fadeIn(10);
            let btn = e.target;
            let originalText = btn.innerText;
            btn.innerText = "Loading...";
            btn.disabled = true;

            try {
                const dbRef = ref(db);
                const snapshot = await get(child(dbRef, `users/${phone}`));
                
                if (!snapshot.exists()) {
                    $('.van-overlay').fadeOut(300);
                    alertMess("Account does not exist");
                    btn.innerText = originalText; btn.disabled = false; return;
                }
                
                const userData = snapshot.val();
                if (userData.password !== password) {
                    $('.van-overlay').fadeOut(300);
                    alertMess("Wrong password");
                    btn.innerText = originalText; btn.disabled = false; return;
                }
                if (userData.status === "blocked") {
                    $('.van-overlay').fadeOut(300);
                    alertMess("Account blocked. Contact customer service.");
                    btn.innerText = originalText; btn.disabled = false; return;
                }

                // Success
                $('.van-overlay').fadeOut(300);
                $('.Loading').fadeIn(10);
                localStorage.setItem('bdg_user', phone);
                
                setTimeout(() => {
                    location.href = 'user.html';
                }, 500);

            } catch (error) {
                console.error(error);
                $('.van-overlay').fadeOut(300);
                alertMess("Database error. Please try again.");
                btn.innerText = originalText; btn.disabled = false;
            }
        });

        function alertMess(text) {
            let length = $('.alert-toast .msg').length;
            if (length == 0) {
                $('.alert-toast').append(
                    `
                    <div data-v-1dcba851="" class="msg">
                        <div data-v-1dcba851="" class="msg-content" style="display:block; color:white; background:rgba(0,0,0,0.8); padding:10px; border-radius:5px; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); z-index:99999; font-size:14px;"> ${text} </div>
                    </div>
                    `
                );
                setTimeout(() => {
                    $('.msg').fadeOut();
                    setTimeout(() => {
                        $('.alert-toast .msg').remove();
                    }, 100);
                }, 2000);
            }
        }

        function showPass() {
          var x = document.getElementById("passwordfield");
          var y = document.getElementById("eyeicon");
          if (x.type === "password") {
            x.type = "text";
            y.src="./index_files/eyeVisible-7bc1c956.png";
          } else {
            x.type = "password";
            y.src="./index_files/eyeInvisible-2fa5c152.png";
          }
        }
    </script>
