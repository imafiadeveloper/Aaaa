<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#120c18">
<title>BDG LOTTERY7 - Super Ace</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Orbitron:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --gold: #f5c443;
  --gold-grad: linear-gradient(135deg, #ffe57f 0%, #f5c443 50%, #c8891d 100%);
  --card-bg: #1c1424;
  --border: rgba(255,255,255,0.08);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:'Inter',sans-serif;}
body{background:radial-gradient(circle at 50% 0%, #2f123d 0%, #0d0814 75%);color:#fff;min-height:100vh;padding-bottom:30px;}
button{border:none;outline:none;cursor:pointer;background:transparent;color:inherit;}
::-webkit-scrollbar{width:0;height:0;}

.navbar{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;height:54px;padding:0 16px;background:rgba(18,12,24,0.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);}
.nav-left{width:36px;height:36px;display:flex;align-items:center;cursor:pointer;}
.nav-left svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2.4;}
.navbar-brand{font-family:'Orbitron',sans-serif;font-size:16px;font-weight:900;letter-spacing:1px;color:#fff;}
.navbar-brand span{color:var(--gold);}
.nav-right{display:flex;align-items:center;gap:10px;}
.nav-icon{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,0.05);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.nav-icon svg{width:18px;height:18px;stroke:var(--gold);fill:none;stroke-width:2;}

.bal-card{background:linear-gradient(145deg, #251633 0%, #150d1d 100%);margin:12px 16px;border-radius:18px;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;border:1px solid rgba(245,196,67,0.25);box-shadow:0 8px 24px rgba(0,0,0,0.5);}
.bal-label{font-size:11px;color:#a58fae;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;margin-bottom:2px;}
.bal-amt{font-family:'Orbitron',sans-serif;font-size:24px;font-weight:900;color:#fff;}
.bal-amt span{color:var(--gold);}
.refresh-btn{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.refresh-btn svg{width:18px;height:18px;stroke:var(--gold);fill:none;stroke-width:2.2;}

/* Slot Housing */
.slot-housing{margin:0 16px 14px;background:linear-gradient(145deg, #2d1838 0%, #120919 100%);border-radius:24px;padding:20px 14px;border:2px solid rgba(245,196,67,0.4);box-shadow:0 12px 35px rgba(0,0,0,0.7);text-align:center;}
.slot-reels-box{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:#0d0614;border-radius:18px;padding:12px 8px;border:2px solid #4a2963;box-shadow:inset 0 4px 15px rgba(0,0,0,0.8);margin-bottom:14px;}
.reel-window{height:95px;background:#1a0f26;border-radius:10px;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,0.06);}
.reel-symbol{font-size:38px;line-height:1;}
.reel-window.blur .reel-symbol{filter:blur(3px);animation:spinLoop 0.1s infinite alternate;}
@keyframes spinLoop{from{transform:translateY(-12px);}to{transform:translateY(12px);}}

.payline-bar{background:rgba(245,196,67,0.1);border:1px dashed var(--gold);padding:6px;border-radius:8px;font-family:'Orbitron',sans-serif;font-size:12px;color:var(--gold);font-weight:800;}

/* Controls */
.ctrl-card{margin:0 16px 16px;background:var(--card-bg);border-radius:18px;padding:16px;border:1px solid var(--border);}
.ctrl-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.ctrl-lbl{font-size:12px;color:#a58fae;font-weight:700;text-transform:uppercase;}
.chips{display:flex;gap:6px;}
.chip{padding:6px 12px;border-radius:8px;background:rgba(255,255,255,0.05);border:1px solid var(--border);font-size:12px;font-weight:800;cursor:pointer;}
.chip.active{background:var(--gold-grad);color:#211400;border:none;}

.btn-spin{width:100%;height:52px;border-radius:16px;background:var(--gold-grad);color:#211400;font-size:17px;font-weight:900;text-transform:uppercase;letter-spacing:1.5px;box-shadow:0 8px 24px rgba(245,196,67,0.4);margin-top:6px;}
.btn-spin:active{transform:scale(0.97);}
.btn-spin:disabled{opacity:0.5;cursor:not-allowed;}

.tabs-wrap{display:flex;margin:0 16px 10px;background:var(--card-bg);border-radius:12px;padding:4px;border:1px solid var(--border);}
.tab-btn{flex:1;text-align:center;padding:9px;font-size:12px;font-weight:700;color:#a58fae;border-radius:8px;}
.tab-btn.active{background:#2b1c3b;color:var(--gold);}
.history-wrap{margin:0 16px;background:var(--card-bg);border-radius:16px;padding:12px;border:1px solid var(--border);min-height:100px;}
.table-head,.table-row{display:flex;align-items:center;justify-content:space-between;padding:10px 8px;font-size:12px;}
.table-head{color:#a58fae;font-weight:700;border-bottom:1px solid var(--border);text-transform:uppercase;font-size:10px;}
.table-row{border-bottom:1px solid rgba(255,255,255,0.03);}
.table-row:last-child{border-bottom:none;}
.col{flex:1;text-align:center;}

.toast{position:fixed;top:20%;left:50%;transform:translateX(-50%);background:rgba(18,12,24,0.96);border:1px solid var(--gold);color:#fff;padding:10px 22px;border-radius:10px;font-size:12px;font-weight:700;z-index:99999;display:none;text-align:center;}
</style>
</head>
<body>

<div class="navbar">
  <div class="nav-left" onclick="location.href='home.html'"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></div>
  <div class="navbar-brand">SUPER <span>ACE</span></div>
  <div class="nav-right">
    <div class="nav-icon" id="soundBtn"><svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/></svg></div>
  </div>
</div>

<div class="bal-card">
  <div>
    <div class="bal-label">Total Balance</div>
    <div class="bal-amt">₹<span id="balanceVal">0.00</span></div>
  </div>
  <div class="refresh-btn" onclick="location.reload()"><svg viewBox="0 0 24 24"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg></div>
</div>

<div class="slot-housing">
  <div class="slot-reels-box">
    <div class="reel-window" id="r1"><div class="reel-symbol">🃏</div></div>
    <div class="reel-window" id="r2"><div class="reel-symbol">🃏</div></div>
    <div class="reel-window" id="r3"><div class="reel-symbol">🃏</div></div>
    <div class="reel-window" id="r4"><div class="reel-symbol">🃏</div></div>
  </div>
  <div class="payline-bar" id="payoutBar">Golden Ace Eliminator — Match 4 Cards!</div>
</div>

<div class="ctrl-card">
  <div class="ctrl-row">
    <span class="ctrl-lbl">Spin Cost</span>
    <div class="chips">
      <div class="chip active" onclick="setAmt(this,10)">₹10</div>
      <div class="chip" onclick="setAmt(this,50)">₹50</div>
      <div class="chip" onclick="setAmt(this,100)">₹100</div>
      <div class="chip" onclick="setAmt(this,500)">₹500</div>
    </div>
  </div>
  <button class="btn-spin" id="spinBtn" onclick="spinSuperAce()">SPIN ACE</button>
</div>

<div class="tabs-wrap">
  <div class="tab-btn active" onclick="switchTab('my',this)">My Rounds</div>
  <div class="tab-btn" onclick="switchTab('pay',this)">Multiplier Pay</div>
</div>

<div class="history-wrap">
  <div id="myView">
    <div class="table-head"><div class="col">Time</div><div class="col">Cost</div><div class="col">Cards</div><div class="col">Win</div></div>
    <div id="myList"></div>
  </div>
  <div id="payView" style="display:none;font-size:12px;color:#a58fae;line-height:1.8;">
    🃏 🃏 🃏 🃏 = <strong>100X Golden Ace</strong><br>
    👑 👑 👑 👑 = <strong>40X King Card</strong><br>
    👸 👸 👸 👸 = <strong>25X Queen Card</strong><br>
    🥷 🥷 🥷 🥷 = <strong>15X Jack Card</strong><br>
    🔟 🔟 🔟 🔟 = <strong>8X 10s</strong>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, updateDoc, increment, collection, addDoc, serverTimestamp, query, limit, getDocs, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAVQh9b7L3IYgWFIYA3wWorVBk1uXRFDZo",
  authDomain: "bdglottery7.firebaseapp.com",
  projectId: "bdglottery7",
  storageBucket: "bdglottery7.firebasestorage.app",
  messagingSenderId: "568771943906",
  appId: "1:568771943906:web:5b78078d9c0d67427dedbb"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const BET_COLLECTION = 'bets_slots';

let currentUser = null;
let userBalance = 0;
let currentBet = 10;
let isSpinning = false;
let soundOn = true;

const aceCards = ['🃏', '👑', '👸', '🥷', '🔟', '9️⃣'];
const cardMultipliers = { '🃏': 100, '👑': 40, '👸': 25, '🥷': 15, '🔟': 8 };

let audioCtx;
function playSound(type) {
  if (!soundOn) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    if (type === 'spin') {
      osc.type = 'square'; osc.frequency.setValueAtTime(260, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
      osc.start(); osc.stop(audioCtx.currentTime + 0.08);
    } else if (type === 'win') {
      osc.type = 'triangle'; osc.frequency.setValueAtTime(440, audioCtx.currentTime);
      osc.frequency.setValueAtTime(659, audioCtx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      osc.start(); osc.stop(audioCtx.currentTime + 0.35);
    }
  } catch(e){}
}

document.getElementById('soundBtn').onclick = () => { soundOn = !soundOn; toast(soundOn ? 'Sound ON' : 'Sound OFF'); };
window.toast = (msg) => { const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 1800); };

onAuthStateChanged(auth, async (user) => {
  if (!user) return location.replace('index.html');
  currentUser = user;
  const snap = await getDoc(doc(db, 'users', user.uid));
  if (snap.exists()) {
    userBalance = Number(snap.data().balance || 0);
    document.getElementById('balanceVal').textContent = userBalance.toFixed(2);
  }
  loadMyHistory();
});

window.setAmt = (el, amt) => {
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active'); currentBet = amt;
};

window.spinSuperAce = async () => {
  if (isSpinning) return;
  if (currentBet > userBalance) return toast('Insufficient balance');

  isSpinning = true;
  document.getElementById('spinBtn').disabled = true;

  try {
    await updateDoc(doc(db, 'users', currentUser.uid), { balance: increment(-currentBet) });
    userBalance -= currentBet;
    document.getElementById('balanceVal').textContent = userBalance.toFixed(2);

    // 🔒 STRICT 10% WIN CHANCE ONLY (90% HOUSE LOSS)
    const rand = Math.random();
    let c1, c2, c3, c4;
    let won = false;

    if (rand < 0.10) { // 1 out of 10 average
      won = true;
      const pick = Object.keys(cardMultipliers)[Math.floor(Math.random() * Object.keys(cardMultipliers).length)];
      c1 = pick; c2 = pick; c3 = pick; c4 = pick;
    } else {
      // 90% Force Mismatch
      c1 = aceCards[Math.floor(Math.random() * aceCards.length)];
      c2 = aceCards[Math.floor(Math.random() * aceCards.length)];
      c3 = aceCards[Math.floor(Math.random() * aceCards.length)];
      c4 = aceCards[Math.floor(Math.random() * aceCards.length)];
      if (c1 === c2 && c2 === c3 && c3 === c4) c4 = aceCards[(aceCards.indexOf(c4) + 1) % aceCards.length];
    }

    const r1 = document.getElementById('r1');
    const r2 = document.getElementById('r2');
    const r3 = document.getElementById('r3');
    const r4 = document.getElementById('r4');
    r1.classList.add('blur'); r2.classList.add('blur'); r3.classList.add('blur'); r4.classList.add('blur');
    playSound('spin');

    setTimeout(() => { r1.classList.remove('blur'); r1.innerHTML = `<div class="reel-symbol">${c1}</div>`; }, 500);
    setTimeout(() => { r2.classList.remove('blur'); r2.innerHTML = `<div class="reel-symbol">${c2}</div>`; }, 800);
    setTimeout(() => { r3.classList.remove('blur'); r3.innerHTML = `<div class="reel-symbol">${c3}</div>`; }, 1100);
    setTimeout(() => {
      r4.classList.remove('blur'); r4.innerHTML = `<div class="reel-symbol">${c4}</div>`;
      finalizeSpin(c1, c2, c3, c4, won);
    }, 1400);

  } catch(e) {
    toast('Error starting spin');
    isSpinning = false;
    document.getElementById('spinBtn').disabled = false;
  }
};

async function finalizeSpin(c1, c2, c3, c4, won) {
  let winAmt = 0;
  if (won && cardMultipliers[c1]) {
    const gross = currentBet * cardMultipliers[c1];
    const tax = (gross - currentBet) * 0.15; // 15% platform profit fee
    winAmt = gross - tax;
    await updateDoc(doc(db, 'users', currentUser.uid), { balance: increment(winAmt) });
    userBalance += winAmt;
    document.getElementById('balanceVal').textContent = userBalance.toFixed(2);
    playSound('win');
    document.getElementById('payoutBar').textContent = `🏆 SUPER ACE JACKPOT! ₹${winAmt.toFixed(2)}`;
    toast(`Won ₹${winAmt.toFixed(2)}!`);
  } else {
    document.getElementById('payoutBar').textContent = `No Ace Combination! Try Again.`;
  }

  await addDoc(collection(db, BET_COLLECTION), {
    userId: currentUser.uid,
    game: 'super_ace',
    amount: currentBet,
    cards: [c1, c2, c3, c4],
    winAmount: winAmt,
    status: won ? 'win' : 'lose',
    createdAt: serverTimestamp()
  });

  isSpinning = false;
  document.getElementById('spinBtn').disabled = false;
  loadMyHistory();
}

async function loadMyHistory() {
  const myView = document.getElementById('myList');
  try {
    const q = query(collection(db, BET_COLLECTION), where('userId', '==', currentUser.uid), limit(15));
    const snap = await getDocs(q);
    if (snap.empty) { myView.innerHTML = '<div style="text-align:center;color:#777;padding:20px;font-size:12px;">No cards played yet</div>'; return; }
    let arr = [];
    snap.forEach(d => arr.push(d.data()));
    arr.sort((a,b) => (b.createdAt?.toMillis()||0) - (a.createdAt?.toMillis()||0));
    myView.innerHTML = arr.slice(0,8).map(b => `
      <div class="table-row">
        <div class="col" style="font-size:10px;color:#777;">${b.createdAt ? new Date(b.createdAt.toDate()).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) : 'Now'}</div>
        <div class="col">₹${b.amount}</div>
        <div class="col" style="font-size:13px;">${(b.cards||b.reels||[]).join('')}</div>
        <div class="col" style="font-weight:800;color:${b.status==='win'?'#00e676':'#ff2a4b'};">
          ${b.status==='win'?'+₹'+Number(b.winAmount).toFixed(2):'-₹'+b.amount}
        </div>
      </div>
    `).join('');
  } catch(e){}
}

window.switchTab = (tab, el) => {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('myView').style.display = tab === 'my' ? 'block' : 'none';
  document.getElementById('payView').style.display = tab === 'pay' ? 'block' : 'none';
};
</script>
</body>
</html>
