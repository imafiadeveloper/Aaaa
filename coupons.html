<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coupons</title>
<style>
body{background:#1A1A1A;color:#fff;font-family:'Inter',sans-serif;margin:0;}
.navbar{display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 16px;background:#1A1A1A;}
.nav-left svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2.2;cursor:pointer;}
.nav-title{font-size:16px;font-weight:600;}
.tabs{display:flex;background:linear-gradient(90deg,#FAE59F,#C4933F);margin:0 16px;border-radius:8px 8px 0 0;}
.tab{flex:1;text-align:center;padding:12px 0;font-size:14px;font-weight:600;color:#8f5206;cursor:pointer;position:relative;}
.tab.active{color:#3a2a10;}
.tab.active::after{content:'';position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:6px solid #1A1A1A;}
.empty-box{margin:16px;background:#262626;height:250px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#666;}
.empty-box svg{width:80px;height:80px;margin-bottom:12px;opacity:0.3;}
</style>
</head>
<body>
<div class="navbar">
  <div class="nav-left" onclick="location.href='account.html'"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></div>
  <div class="nav-title">My Top-Up Coupons</div>
  <div style="width:24px;"></div>
</div>
<div class="tabs">
  <div class="tab active">Unused</div>
  <div class="tab">Used</div>
  <div class="tab">Expired</div>
</div>
<div class="empty-box">
  <svg viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
  <span>No data</span>
</div>
</body>
</html>
