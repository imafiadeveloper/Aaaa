<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#120c18">
<title>BDG LOTTERY7 - Dragon vs Tiger</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Orbitron:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --dragon-red: #ff2a4b;
  --tiger-blue: #0088ff;
  --tie-green: #00e676;
  --gold: #f5c443;
  --gold-grad: linear-gradient(135deg, #ffe57f 0%, #f5c443 50%, #c8891d 100%);
  --card-bg: #1a1424;
  --border: rgba(255,255,255,0.08);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:'Inter',sans-serif;}
body{background:radial-gradient(circle at 50% 0%, #2a1435 0%, #0d0814 75%);color:#fff;min-height:100vh;padding-bottom:30px;}
button{border:none;outline:none;cursor:pointer;background:transparent;color:inherit;}
::-webkit-scrollbar{width:0;height:0;}

/* Navbar */
.navbar{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;height:54px;padding:0 16px;background:rgba(18,12,24,0.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);}
.nav-left{width:36px;height:36px;display:flex;align-items:center;cursor:pointer;}
.nav-left svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2.4;}
.navbar-brand{font-family:'Orbitron',sans-serif;font-size:16px;font-weight:900;letter-spacing:1px;color:#fff;}
.navbar-brand span{color:var(--dragon-red);}
.nav-right{display:flex;align-items:center;gap:10px;}
.nav-icon{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,0.05);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.nav-icon svg{width:18px;height:18px;stroke:var(--gold);fill:none;stroke-width:2;}

/* Balance */
.bal-card{background:linear-gradient(145deg, #261633 0%, #150d1c 100%);margin:12px 16px;border-radius:18px;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;border:1px solid rgba(245,196,67,0.25);box-shadow:0 8px 24px rgba(0,0,0,0.5);}
.bal-label{font-size:11px;color:#a58fae;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;margin-bottom:2px;}
.bal-amt{font-family:'Orbitron',sans-serif;font-size:24px;font-weight:900;color:#fff;}
.bal-amt span{color:var(--gold);}
.refresh-btn{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.refresh-btn svg{width:18px;height:18px;stroke:var(--gold);fill:none;stroke-width:2.2;}

/* Round Header & Battle Arena */
.arena-card{margin:0 16px 14px;background:linear-gradient(145deg, #1f142b 0%, #11091a 100%);border-radius:20px;padding:16px 14px;border:1px solid var(--border);box-shadow:0 10px 30px rgba(0,0,0,0.6);}
.arena-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.arena-meta span{font-size:11px;color:#a58fae;font-weight:700;text-transform:uppercase;}
.arena-meta h3{font-family:'Orbitron',sans-serif;font-size:14px;font-weight:900;color:#fff;margin-top:2px;}
.timer-pill{background:#11091a;border:1.5px solid var(--gold);padding:4px 12px;border-radius:20px;font-family:'Orbitron',sans-serif;font-size:16px;font-weight:900;color:var(--gold);}

/* Duel Table (Cards) */
.battle-table{display:flex;justify-content:space-around;align-items:center;position:relative;padding:10px 0;}
.side-box{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px;border-radius:18px;border:2px solid transparent;transition:all 0.3s ease;}
.side-box.winner-glow-dragon{border-color:var(--dragon-red);box-shadow:0 0 25px rgba(255,42,75,0.6);animation:pulseGlow 1s infinite alternate;}
.side-box.winner-glow-tiger{border-color:var(--tiger-blue);box-shadow:0 0 25px rgba(0,136,255,0.6);animation:pulseGlow 1s infinite alternate;}

@keyframes pulseGlow{
  0%{transform:scale(1);}
  100%{transform:scale(1.03);}
}

.side-header{display:flex;align-items:center;gap:6px;}
.side-title{font-family:'Orbitron',sans-serif;font-size:14px;font-weight:900;letter-spacing:1px;text-transform:uppercase;}
.side-box.dragon .side-title{color:var(--dragon-red);}
.side-box.tiger .side-title{color:var(--tiger-blue);}
.side-icon{width:24px;height:24px;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.6));}

/* 3D Playing Card Container */
.card-wrapper{
  width:96px;height:136px;perspective:1000px;position:relative;
}
.poker-card{
  width:100%;height:100%;position:relative;transform-style:preserve-3d;
  transition:transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  border-radius:14px;
}
.poker-card.flipped{transform:rotateY(180deg);}

.card-face{
  position:absolute;inset:0;width:100%;height:100%;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:14px;box-shadow:0 10px 25px rgba(0,0,0,0.7);
}

/* Back Side of Card */
.card-back{
  transform:rotateY(180deg);background:#120c18;
  border:2px solid var(--gold);overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background-size:cover;background-position:center;
}
.card-back-inner{
  width:82%;height:85%;border:1px dashed rgba(245,196,67,0.5);border-radius:10px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle, #2b1739 0%, #150920 100%);
}
.card-back-art{width:48px;height:48px;filter:drop-shadow(0 2px 8px rgba(245,196,67,0.5));}

/* Front Side of Card (Real Poker Face) */
.card-front{
  background:#ffffff;color:#111;transform:rotateY(0deg);
  display:flex;flex-direction:column;justify-content:space-between;padding:8px 10px;
  font-weight:900;border:1px solid #dcdcdc;
}
.card-top{font-size:16px;line-height:1;display:flex;flex-direction:column;align-items:flex-start;}
.card-mid{font-size:36px;text-align:center;line-height:1;}
.card-bottom{font-size:16px;line-height:1;display:flex;flex-direction:column;align-items:flex-end;transform:rotate(180deg);}
.suit-red{color:#e53935;}
.suit-black{color:#212121;}

.vs-badge{
  font-family:'Orbitron',sans-serif;font-size:20px;font-weight:900;
  background:var(--gold-grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 2px 8px rgba(245,196,67,0.4));
}

/* Recent Badges */
.history-bar{display:flex;gap:8px;overflow-x:auto;padding:0 16px 14px;}
.h-chip{flex:0 0 auto;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Orbitron',sans-serif;font-size:12px;font-weight:900;color:#fff;}
.h-chip.D{background:linear-gradient(135deg,#ff2a4b,#b70014);box-shadow:0 2px 8px rgba(255,42,75,0.4);}
.h-chip.T{background:linear-gradient(135deg,#0088ff,#004ab7);box-shadow:0 2px 8px rgba(0,136,255,0.4);}
.h-chip.Tie{background:linear-gradient(135deg,#00e676,#009640);box-shadow:0 2px 8px rgba(0,230,118,0.4);}

/* Betting Board */
.bet-deck{display:grid;grid-template-columns:1fr 0.8fr 1fr;gap:10px;margin:0 16px 16px;}
.bet-btn{height:115px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 8px 24px rgba(0,0,0,0.4);transition:transform .15s;}
.bet-btn:active{transform:scale(0.96);}
.bet-btn.dragon{background:linear-gradient(145deg, #c41834, #660515);border:2px solid rgba(255,42,75,0.5);}
.bet-btn.tie{background:linear-gradient(145deg, #0d7a42, #053b1f);border:2px solid rgba(0,230,118,0.5);}
.bet-btn.tiger{background:linear-gradient(145deg, #1059a4, #052952);border:2px solid rgba(0,136,255,0.5);}
.bet-btn h2{font-family:'Orbitron',sans-serif;font-size:17px;font-weight:900;letter-spacing:0.5px;}
.bet-btn span{font-size:11px;font-weight:800;opacity:0.85;}
.bet-btn .rate{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:900;color:var(--gold);margin-top:4px;}

/* Tabs & History */
.tabs-wrap{display:flex;margin:0 16px 10px;background:var(--card-bg);border-radius:12px;padding:4px;border:1px solid var(--border);}
.tab-btn{flex:1;text-align:center;padding:9px;font-size:12px;font-weight:700;color:#85a890;border-radius:8px;}
.tab-btn.active{background:#2b1c3b;color:var(--gold);}
.history-wrap{margin:0 16px;background:var(--card-bg);border-radius:16px;padding:12px;border:1px solid var(--border);min-height:100px;}
.table-head,.table-row{display:flex;align-items:center;justify-content:space-between;padding:10px 8px;font-size:12px;}
.table-head{color:#a58fae;font-weight:700;border-bottom:1px solid var(--border);text-transform:uppercase;font-size:10px;}
.table-row{border-bottom:1px solid rgba(255,255,255,0.03);}
.table-row:last-child{border-bottom:none;}
.col{flex:1;text-align:center;}

/* Bet Bottom Sheet */
.modal-overlay{position:fixed;inset:0;background:rgba(8,4,12,0.85);backdrop-filter:blur(6px);z-index:999;display:none;align-items:flex-end;}
.modal-overlay.show{display:flex;}
.sheet{width:100%;background:#181222;border-radius:24px 24px 0 0;padding:20px 18px 24px;border-top:1.5px solid var(--border);animation:slideUp .25s ease;}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.sheet-title{font-size:16px;font-weight:900;color:#fff;}
.sheet-title span{color:var(--gold);}
.sheet-close{font-size:24px;color:#a58fae;cursor:pointer;}
.ctrl-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.ctrl-label{font-size:12px;color:#a58fae;font-weight:700;text-transform:uppercase;}
.chips{display:flex;gap:6px;}
.chip{padding:7px 12px;border-radius:8px;background:rgba(255,255,255,0.05);border:1px solid var(--border);font-size:13px;font-weight:800;color:#fff;cursor:pointer;}
.chip.active{background:var(--gold-grad);color:#211400;border:none;}
.qty-box{display:flex;align-items:center;background:#100918;border-radius:8px;border:1px solid var(--border);}
.qty-btn{width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#a58fae;}
.qty-input{width:48px;text-align:center;background:transparent;border:none;color:#fff;font-family:'Orbitron',sans-serif;font-weight:800;}
.btn-submit-bet{width:100%;height:48px;border-radius:14px;background:var(--gold-grad);color:#211400;font-size:15px;font-weight:900;text-transform:uppercase;letter-spacing:0.8px;margin-top:14px;box-shadow:0 6px 20px rgba(245,196,67,0.35);}

/* Drawing Phase */
.draw-overlay{position:fixed;inset:0;background:rgba(12,6,18,0.75);backdrop-filter:blur(8px);z-index:9000;display:none;align-items:center;justify-content:center;flex-direction:column;pointer-events:none;}
.draw-overlay.show{display:flex;}
.draw-box{width:130px;height:130px;border-radius:50%;background:rgba(255,42,75,0.12);border:2px solid var(--dragon-red);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 35px rgba(255,42,75,0.45);}
.draw-counter{font-family:'Orbitron',sans-serif;font-size:55px;font-weight:900;color:#fff;line-height:1;}
.draw-lbl{font-size:11px;font-weight:800;color:var(--gold);letter-spacing:1px;text-transform:uppercase;margin-top:4px;}

/* Result Popup */
.result-popup{position:fixed;inset:0;background:rgba(4,2,8,0.88);backdrop-filter:blur(6px);z-index:10000;display:none;align-items:center;justify-content:center;padding:20px;}
.result-popup.show{display:flex;}
.res-card{width:100%;max-width:320px;border-radius:22px;padding:26px 20px 22px;text-align:center;background:#1a1224;border:1.5px solid var(--border);box-shadow:0 20px 50px rgba(0,0,0,0.8);animation:scalePop .3s cubic-bezier(.34,1.56,.64,1);}
@keyframes scalePop{from{transform:scale(0.7);opacity:0;}to{transform:scale(1);opacity:1;}}
.res-card.win{border-color:var(--gold);box-shadow:0 0 45px rgba(245,196,67,0.35);}
.res-card.lose{border-color:#ff334b;box-shadow:0 0 45px rgba(255,51,75,0.3);}
.res-icon{font-size:52px;margin-bottom:8px;}
.res-title{font-size:22px;font-weight:900;text-transform:uppercase;margin-bottom:6px;}
.res-card.win .res-title{color:var(--gold);}
.res-card.lose .res-title{color:#ff5252;}
.res-amt{font-family:'Orbitron',sans-serif;font-size:30px;font-weight:900;margin-bottom:18px;}
.res-card.win .res-amt{color:var(--tie-green);}
.res-card.lose .res-amt{color:#ff5252;}
.btn-res-close{width:100%;height:44px;border-radius:12px;background:var(--gold-grad);color:#211400;font-size:14px;font-weight:900;text-transform:uppercase;}

.toast{position:fixed;top:20%;left:50%;transform:translateX(-50%);background:rgba(18,12,24,0.96);border:1px solid var(--gold);color:#fff;padding:10px 22px;border-radius:10px;font-size:12px;font-weight:700;z-index:99999;display:none;text-align:center;}
</style>
</head>

<div class="navbar">

  if (!soundOn) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    if (type === 'tick') {
      osc.type = 'sine'; osc.frequency.setValueAtTime(700, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      osc.start(); osc.stop(audioCtx.currentTime + 0.04);
    } else if (type === 'win') {
      osc.type = 'triangle'; osc.frequency.setValueAtTime(440, audioCtx.currentTime);
      osc.frequency.setValueAtTime(660, audioCtx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      osc.start(); osc.stop(audioCtx.currentTime + 0.35);
    } else if (type === 'lose') {
      osc.type = 'sawtooth'; osc.frequency.setValueAtTime(160, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(70, audioCtx.currentTime + 0.3);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    }
  } catch(e){}
}

document.getElementById('soundBtn').onclick = () => {
  soundOn = !soundOn; toast(soundOn ? 'Sound ON' : 'Sound OFF');
};

window.toast = (msg) => {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 1800);
};

function getSlot(ms = Date.now()) { return Math.floor((ms - EPOCH) / SLOT_MS); }
function getPeriodId(slot) {
  const d = new Date(EPOCH + slot * SLOT_MS);
  const y = d.getUTCFullYear();
  const m = String(d.getUTCMonth() + 1).padStart(2, '0');
  const day = String(d.getUTCDate()).padStart(2, '0');
  const slotOfDay = Math.floor((d.getTime() - Date.UTC(y, d.getUTCMonth(), d.getUTCDate())) / SLOT_MS);
  return `${y}${m}${day}DT${String(slotOfDay).padStart(5, '0')}`;
}

// Pseudo-Random Card Deal
function generateDuelResult(slot) {
  let seed = (slot * 9301 + 49297) % 233280;
  const dVal = (seed % 13) + 1;
  const dSuit = suits[seed % 4];
  seed = (seed * 9301 + 49297) % 233280;
  const tVal = (seed % 13) + 1;
  const tSuit = suits[seed % 4];

  let winner = 'Tie';
  if (dVal > tVal) winner = 'Dragon';
  else if (tVal > dVal) winner = 'Tiger';

  return { dVal, dSuit, tVal, tSuit, winner };
}

/* 🧹 24h Auto-Cleanup Results */
async function cleanupOldResults() {
  try {
    const q = query(collection(db, RESULT_COLLECTION), limit(100));
    const snap = await getDocs(q);
    const dayAgo = Date.now() - (24 * 60 * 60 * 1000);
    const delPromises = [];
    snap.forEach(d => {
      const data = d.data();
      if (data.createdAt?.toMillis && data.createdAt.toMillis() < dayAgo) {
        delPromises.push(deleteDoc(d.ref));
      }
    });
    if (delPromises.length) await Promise.all(delPromises);
  } catch(e){}
}

/* Gapless Backfill */
async function backfillMissingPeriods() {
  try {
    const q = query(collection(db, RESULT_COLLECTION), limit(30));
    const snap = await getDocs(q);
    const cur = getSlot();
    let maxSlot = cur - 15;
    snap.forEach(d => {
      const p = d.data().period;
      if (p && p.length >= 13) {
        const slotDay = parseInt(p.slice(-5));
        const dt = Date.UTC(parseInt(p.slice(0,4)), parseInt(p.slice(4,6))-1, parseInt(p.slice(6,8)));
        const s = Math.floor((dt + slotDay * SLOT_MS - EPOCH) / SLOT_MS);
        if (s > maxSlot) maxSlot = s;
      }
    });
    for (let s = maxSlot + 1; s < cur; s++) {
      await saveResultForSlot(s, getPeriodId(s));
    }
  } catch(e){}
}

async function saveResultForSlot(slot, periodId) {
  const ref = doc(db, RESULT_COLLECTION, periodId);
  const snap = await getDoc(ref);
  if (snap.exists()) return;
  const duel = generateDuelResult(slot);
  const data = { period: periodId, ...duel, createdAt: serverTimestamp() };
  try {
    await runTransaction(db, async (tx) => {
      const ex = await tx.get(ref);
      if (!ex.exists()) tx.set(ref, data);
    });
  } catch(e){}
  await resolveBets(periodId, data);
}

async function resolveBets(periodId, resData) {
  if (!currentUser) return;
  try {
    const q = query(collection(db, BET_COLLECTION), where('userId', '==', currentUser.uid), where('period', '==', periodId));
    const snap = await getDocs(q);
    if (snap.empty) return;
    let winTotal = 0, lostTotal = 0, hasPending = false, ownerTaxTotal = 0;
    const batch = [];
    snap.forEach(d => {
      const b = d.data();
      if (b.status !== 'pending') return;
      hasPending = true;
      let won = (b.choice === resData.winner);
      let multi = b.payoutMultiplier || 2;

      let winAmt = 0;
      if (won) {
        const gross = b.amount * multi;
        const tax = gross * 0.15;
        ownerTaxTotal += tax;
        winAmt = gross - tax;
        winTotal += winAmt;
      } else lostTotal += b.amount;

      batch.push(updateDoc(doc(db, BET_COLLECTION, d.id), {
        status: won ? 'win' : 'lose',
        winAmount: winAmt,
        winner: resData.winner
      }));
    });
    if (!hasPending) return;
    await Promise.all(batch);

    if (ownerTaxTotal > 0) {
      updateDoc(doc(db, 'system', 'owner_earnings'), { total: increment(ownerTaxTotal) }).catch(()=>{});
    }

    if (winTotal > 0) {
      await updateDoc(doc(db, 'users', currentUser.uid), { balance: increment(winTotal) });
      userBalance += winTotal;
      document.getElementById('balanceVal').textContent = userBalance.toFixed(2);
      showResultModal(true, winTotal, resData.winner);
    } else if (lostTotal > 0) {
      showResultModal(false, lostTotal, resData.winner);
    }
  } catch(e){}
}

onAuthStateChanged(auth, async (user) => {
  if (!user) return location.replace('index.html');
  currentUser = user;
  const snap = await getDoc(doc(db, 'users', user.uid));
  if (snap.exists()) {
    userBalance = Number(snap.data().balance || 0);
    document.getElementById('balanceVal').textContent = userBalance.toFixed(2);
  }
  await cleanupOldResults();
  await backfillMissingPeriods();
  startTimer();
  loadGameHistory();
  loadMyHistory();
});

function renderCardUI(cardId, frontId, val, suit) {
  const cardEl = document.getElementById(cardId);
  const frontEl = document.getElementById(frontId);
  
  const isRed = (suit === '♥' || suit === '♦');
  const colorClass = isRed ? 'suit-red' : 'suit-black';
  const name = cardNames[val];

  frontEl.innerHTML = `
    <div class="card-top ${colorClass}"><span class="c-val">${name}</span><span class="c-suit">${suit}</span></div>
    <div class="card-mid ${colorClass}">${suit}</div>
    <div class="card-bottom ${colorClass}"><span class="c-val">${name}</span><span class="c-suit">${suit}</span></div>
  `;
  cardEl.classList.remove('flipped'); // Unflip to show face
}

function startTimer() {
  let lastSlotTrack = -1;
  setInterval(() => {
    const now = Date.now();
    const slot = getSlot(now);
    const secLeft = Math.max(0, Math.ceil((SLOT_MS - (now - (EPOCH + slot * SLOT_MS))) / 1000));

    if (lastSlotTrack !== -1 && slot !== lastSlotTrack) {
      // Flip Cards and Show Round Result
      const res = generateDuelResult(lastSlotTrack);
      renderCardUI('dragonCard', 'dragonCardFront', res.dVal, res.dSuit);
      renderCardUI('tigerCard', 'tigerCardFront', res.tVal, res.tSuit);

      // Glowing effect on winner box
      const dBox = document.getElementById('dragonBox');
      const tBox = document.getElementById('tigerBox');
      dBox.className = 'side-box dragon';
      tBox.className = 'side-box tiger';

      if (res.winner === 'Dragon') {
        dBox.classList.add('winner-glow-dragon');
      } else if (res.winner === 'Tiger') {
        tBox.classList.add('winner-glow-tiger');
      }

      saveResultForSlot(lastSlotTrack, getPeriodId(lastSlotTrack)).then(() => {
        loadGameHistory(); loadMyHistory();
      });
    }
    lastSlotTrack = slot;
    currentSlot = slot;
    currentPeriod = getPeriodId(slot);
    document.getElementById('periodText').textContent = currentPeriod;
    document.getElementById('timerClock').textContent = `${secLeft}s`;

    if (secLeft <= 4) {
      isBettingClosed = true;
      document.getElementById('drawOverlay').classList.add('show');
      document.getElementById('drawSec').textContent = secLeft;
      if (secLeft > 0) playSound('tick');
    } else {
      isBettingClosed = false;
      document.getElementById('drawOverlay').classList.remove('show');
      if (secLeft > 10) {
        // Reset card back flip for next round
        document.getElementById('dragonCard').classList.add('flipped');
        document.getElementById('tigerCard').classList.add('flipped');
        document.getElementById('dragonBox').className = 'side-box dragon';
        document.getElementById('tigerBox').className = 'side-box tiger';
      }
    }
  }, 250);
}

window.openBetModal = (choice, multi) => {
  if (isBettingClosed) return toast('Betting closed for current round!');
  selectedChoice = choice; payoutMultiplier = multi;
  document.getElementById('sheetChoice').textContent = choice.toUpperCase();
  document.getElementById('betModal').classList.add('show');
  updateTotalBetSpan();
};
window.closeBetModal = () => document.getElementById('betModal').classList.remove('show');

window.setAmt = (el, amt) => {
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active'); baseAmt = amt; updateTotalBetSpan();
};
window.setQty = (delta) => {
  currentQty = Math.max(1, currentQty + delta);
  document.getElementById('qtyVal').value = currentQty;
  updateTotalBetSpan();
};
function updateTotalBetSpan() {
  document.getElementById('totalBetSpan').textContent = baseAmt * currentQty;
}

window.placeBet = async () => {
  if (isBettingClosed) return toast('Betting closed for this round');
  const total = baseAmt * currentQty;
  if (total > userBalance) return toast('Insufficient balance');
  const btn = document.getElementById('btnPlaceBet');
  btn.disabled = true; btn.textContent = 'PLACING...';

  try {
    await updateDoc(doc(db, 'users', currentUser.uid), { balance: increment(-total) });
    userBalance -= total;
    document.getElementById('balanceVal').textContent = userBalance.toFixed(2);

    await addDoc(collection(db, BET_COLLECTION), {
      userId: currentUser.uid,
      period: currentPeriod,
      choice: selectedChoice,
      amount: total,
      payoutMultiplier: payoutMultiplier,
      status: 'pending',
      createdAt: serverTimestamp()
    });
    toast(`Bet placed on ${selectedChoice}!`);
    closeBetModal();
    loadMyHistory();
  } catch(e) {
    toast('Bet failed. Try again.');
  } finally {
    btn.disabled = false;
    btn.textContent = 'CONFIRM';
  }
};

function showResultModal(isWin, amt, winner) {
  const popup = document.getElementById('resultPopup');
  const card = document.getElementById('resCard');
  card.className = 'res-card ' + (isWin ? 'win' : 'lose');
  document.getElementById('resIcon').textContent = (winner === 'Dragon' ? '🐉' : (winner === 'Tiger' ? '🐅' : '🤝'));
  document.getElementById('resTitle').textContent = isWin ? `${winner} Won!` : `${winner} Won (Lost)`;
  document.getElementById('resAmt').textContent = (isWin ? '+₹' : '-₹') + Number(amt).toFixed(2);
  popup.classList.add('show');
  playSound(isWin ? 'win' : 'lose');
}
window.closePopup = () => document.getElementById('resultPopup').classList.remove('show');

async function loadGameHistory() {
  const gList = document.getElementById('gameList');
  const recBar = document.getElementById('recentBar');
  try {
    const q = query(collection(db, RESULT_COLLECTION), limit(30));
    const snap = await getDocs(q);
    let arr = [];
    snap.forEach(d => arr.push(d.data()));
    arr.sort((a,b) => (b.period||'').localeCompare(a.period||''));

    recBar.innerHTML = arr.slice(0, 12).map(d => {
      const code = (d.winner === 'Dragon' ? 'D' : (d.winner === 'Tiger' ? 'T' : 'Tie'));
      return `<div class="h-chip ${code}">${code}</div>`;
    }).join('');

    gList.innerHTML = arr.slice(0, 10).map(d => `
      <div class="table-row">
        <div class="col" style="font-family:'Orbitron',sans-serif;font-size:11px;">${d.period.slice(-5)}</div>
        <div class="col" style="color:var(--dragon-red);font-weight:800;">${cardNames[d.dVal]}${d.dSuit}</div>
        <div class="col" style="color:var(--tiger-blue);font-weight:800;">${cardNames[d.tVal]}${d.tSuit}</div>
        <div class="col" style="font-weight:900;color:${d.winner==='Dragon'?'var(--dragon-red)':(d.winner==='Tiger'?'var(--tiger-blue)':'var(--tie-green)')};">${d.winner}</div>
      </div>
    `).join('');
  } catch(e){}
}

async function loadMyHistory() {
  const myView = document.getElementById('myList');
  try {
    const q = query(collection(db, BET_COLLECTION), where('userId', '==', currentUser.uid), limit(25));
    const snap = await getDocs(q);
    if (snap.empty) {
      myView.innerHTML = '<div style="text-align:center;color:#777;padding:20px;font-size:12px;">No bets found</div>';
      return;
    }
    let arr = [];
    snap.forEach(d => arr.push(d.data()));
    arr.sort((a,b) => (b.createdAt?.toMillis()||0) - (a.createdAt?.toMillis()||0));
    myView.innerHTML = arr.slice(0,10).map(b => `
      <div class="table-row">
        <div class="col" style="font-size:11px;">${b.period.slice(-5)}</div>
        <div class="col" style="font-weight:800;">${b.choice}</div>
        <div class="col">₹${b.amount}</div>
        <div class="col" style="font-weight:800;color:${b.status==='win'?'var(--tie-green)':(b.status==='lose'?'var(--dragon-red)':'var(--gold)')};">
          ${b.status==='win'?'+₹'+Number(b.winAmount).toFixed(2):(b.status==='lose'?'-₹'+b.amount:'Pending')}
        </div>
      </div>
    `).join('');
  } catch(e){}
}

window.switchTab = (tab, el) => {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('gameView').style.display = tab === 'game' ? 'block' : 'none';
  document.getElementById('myView').style.display = tab === 'my' ? 'block' : 'none';
};
</script>
