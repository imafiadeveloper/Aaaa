<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gifts - BDG LOTTERY7</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --gold: #FAE59F;
  --gold-grad: linear-gradient(180deg,#FFE793 0%,#C48E2F 100%);
  --bg-main: #141416;
  --card-bg: #202024;
  --border: rgba(255,255,255,0.06);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg-main);color:#fff;min-height:100vh;padding-bottom:50px;}
button{border:none;outline:none;cursor:pointer;background:transparent;color:inherit;}
::-webkit-scrollbar{width:0;height:0;}

.navbar{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;height:54px;padding:0 16px;background:rgba(20,20,22,0.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);}
.nav-left{width:40px;height:40px;display:flex;align-items:center;cursor:pointer;}
.nav-left svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2.4;}
.nav-title{font-size:16px;font-weight:700;}

.banner{
  position:relative;height:160px;background:linear-gradient(135deg,#2c2415 0%,#171618 100%);
  margin:14px 16px;border-radius:18px;overflow:hidden;display:flex;align-items:center;padding:20px;
  border:1px solid rgba(250,229,159,0.25);box-shadow:0 8px 24px rgba(0,0,0,0.5);
}
.banner-bg{position:absolute;right:-15px;top:-15px;opacity:0.08;}
.banner-bg svg{width:180px;height:180px;fill:var(--gold);}
.banner-content{position:relative;z-index:1;}
.banner h2{font-size:22px;font-weight:800;color:var(--gold);margin-bottom:6px;display:flex;align-items:center;gap:6px;}
.banner p{font-size:12px;color:#a6a9ae;line-height:1.5;}

.redeem-box{margin:0 16px 20px;background:var(--card-bg);border-radius:18px;padding:18px;border:1px solid var(--border);box-shadow:0 4px 14px rgba(0,0,0,0.3);}
.rb-title{font-size:14px;font-weight:700;margin-bottom:12px;color:#e1e1e1;}
.rb-input-wrap{background:#141416;border:1.5px solid rgba(255,255,255,0.08);border-radius:12px;padding:2px 14px;margin-bottom:14px;display:flex;align-items:center;}
.rb-input-wrap:focus-within{border-color:var(--gold);}
.rb-input{width:100%;height:46px;background:transparent;color:#fff;font-size:13px;font-weight:700;letter-spacing:1px;font-family:'Orbitron',sans-serif;text-transform:uppercase;}
.rb-input::placeholder{font-family:'Inter',sans-serif;letter-spacing:normal;font-weight:500;color:#666;}
.rb-btn{width:100%;height:46px;background:var(--gold-grad);border-radius:23px;color:#291a03;font-size:15px;font-weight:900;letter-spacing:0.5px;box-shadow:0 4px 15px rgba(196,147,63,0.3);}
.rb-btn:disabled{background:#383838;color:#777;box-shadow:none;cursor:not-allowed;}

.history-section{margin:0 16px;}
.hs-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;margin-bottom:12px;color:#fff;text-transform:uppercase;letter-spacing:0.5px;}
.hs-title svg{width:18px;height:18px;stroke:var(--gold);fill:none;stroke-width:2.2;}
.history-card{background:var(--card-bg);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 10px rgba(0,0,0,0.25);}
.hc-left{display:flex;flex-direction:column;gap:4px;overflow:hidden;padding-right:8px;}
.hc-code{font-family:'Orbitron',sans-serif;font-size:12px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hc-time{font-size:11px;color:#8f929b;}
.hc-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;}
.hc-amt{font-family:'Orbitron',sans-serif;font-size:15px;font-weight:900;color:#00e676;}
.hc-status{font-size:10px;font-weight:800;color:#00e676;background:rgba(0,230,118,0.1);padding:2px 8px;border-radius:6px;border:1px solid rgba(0,230,118,0.2);text-transform:uppercase;}

.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 0;color:#666;}
.empty-state svg{width:64px;height:64px;margin-bottom:12px;stroke:#3e3e44;fill:none;stroke-width:1.5;}

.toast{position:fixed;top:30%;left:50%;transform:translateX(-50%) translateY(-10px);background:rgba(20,20,22,0.96);border:1px solid var(--gold);color:#fff;font-size:13px;font-weight:700;padding:10px 20px;border-radius:10px;opacity:0;pointer-events:none;transition:all .25s ease;z-index:9999;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<header class="navbar">
  <div class="nav-left" onclick="history.back() || (location.href='account.html')">
    <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
  </div>
  <div class="nav-title">Gifts</div>
  <div style="width:40px;"></div>
</header>

<div class="banner">
  <div class="banner-bg">
    <svg viewBox="0 0 24 24"><path d="M20 12v10H4V12"/><path d="M2 7h20v5H2zM12 22V7"/><path d="M12 7H7.5a2.5 2.5 0 010-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 000-5C13 2 12 7 12 7z"/></svg>
  </div>
  <div class="banner-content">
    <h2><span>🎁</span> Exclusive Gift</h2>
    <p>We have mystery rewards for you. Enter your 32-character gift redemption code below to claim instant cash balance.</p>
  </div>
</div>

<div class="redeem-box">
  <div class="rb-title">Please enter the gift code below</div>
  <div class="rb-input-wrap">
    <input type="text" id="giftCodeInput" class="rb-input" placeholder="Paste 32-character code here" maxlength="32">
  </div>
  <button id="redeemBtn" class="rb-btn" onclick="redeemGift()">Receive</button>
</div>

<main class="history-section">
  <div class="hs-title">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    Redemption History
  </div>
  <div id="historyList">
    <div class="empty-state">
      <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>
      <span>No redemption history</span>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { 
  getFirestore, doc, collection, query, where, getDocs, 
  serverTimestamp, runTransaction, arrayUnion 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAVQh9b7L3IYgWFIYA3wWorVBk1uXRFDZo",
  authDomain: "bdglottery7.firebaseapp.com",
  projectId: "bdglottery7",
  storageBucket: "bdglottery7.firebasestorage.app",
  messagingSenderId: "568771943906",
  appId: "1:568771943906:web:5b78078d9c0d67427dedbb"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const toastEl = document.getElementById('toast');
const showToast = (msg) => {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 2200);
};

let currentUser = null;

onAuthStateChanged(auth, (user) => {
  if(!user) return location.replace('index.html');
  currentUser = user;
  loadHistory();
});

async function redeemGift() {
  const codeInput = document.getElementById('giftCodeInput');
  const code = codeInput.value.trim().toUpperCase();
  
  if(!code) return showToast('Please enter gift code');
  if(code.length !== 32) return showToast('Invalid gift code format (Must be 32 chars)');

  const btn = document.getElementById('redeemBtn');
  btn.disabled = true;
  btn.innerText = 'Verifying...';

  try {
    const giftRef = doc(db, 'gift_codes', code);

    // Atomic Multi-User Claim Validation
    const rewardAmount = await runTransaction(db, async (tx) => {
      const giftSnap = await tx.get(giftRef);
      if(!giftSnap.exists()) {
        throw new Error('Invalid gift code!');
      }

      const gift = giftSnap.data();

      // Status check
      if(gift.status !== 'active') {
        throw new Error('This gift code has expired!');
      }

      // Check if user already claimed this specific code
      const claimedList = gift.claimedBy || [];
      if(claimedList.includes(currentUser.uid)) {
        throw new Error('You have already claimed this gift code!');
      }

      // Max claim limit check
      const currentClaims = Number(gift.claimedCount || 0);
      const maxUsers = Number(gift.maxUsers || 1);

      if(currentClaims >= maxUsers) {
        tx.update(giftRef, { status: 'expired' });
        throw new Error('Gift code usage limit reached!');
      }

      const userRef = doc(db, 'users', currentUser.uid);
      const userSnap = await tx.get(userRef);
      if(!userSnap.exists()) throw new Error('User account not found');

      const userData = userSnap.data();
      const currentBal = Number(userData.balance || 0);
      const addAmt = Number(gift.amount || 0);

      // 1. Credit balance and lock bonus wager requirements
      tx.update(userRef, {
        balance: currentBal + addAmt,
        totalBonus: Number(userData.totalBonus || 0) + addAmt,
        requiredWager: Number(userData.requiredWager || 0) + addAmt
      });

      // 2. Increment claim count and register user UID
      const nextClaimCount = currentClaims + 1;
      const isNowExpired = nextClaimCount >= maxUsers;

      tx.update(giftRef, {
        claimedCount: nextClaimCount,
        claimedBy: arrayUnion(currentUser.uid),
        status: isNowExpired ? 'expired' : 'active',
        lastClaimedAt: serverTimestamp()
      });

      // 3. Ledger History
      const histRef = doc(collection(db, 'gift_history'));
      tx.set(histRef, {
        userId: currentUser.uid,
        code: code,
        amount: addAmt,
        createdAt: serverTimestamp()
      });

      // 4. Wallet Transaction Record
      const txRef = doc(collection(db, 'transactions'));
      tx.set(txRef, {
        userId: currentUser.uid,
        type: 'bonus',
        title: 'Gift Code Claim',
        amount: addAmt,
        status: 'success',
        createdAt: serverTimestamp()
      });

      return addAmt;
    });

    showToast(`🎉 Claimed! ₹${rewardAmount.toFixed(2)} added to balance.`);
    codeInput.value = '';
    loadHistory();

  } catch(err) {
    showToast(err.message || 'Redemption failed. Try again.');
  } finally {
    btn.disabled = false;
    btn.innerText = 'Receive';
  }
}
window.redeemGift = redeemGift;

async function loadHistory() {
  const listEl = document.getElementById('historyList');
  try {
    const q = query(
      collection(db, 'gift_history'), 
      where('userId', '==', currentUser.uid)
    );
    const snap = await getDocs(q);
    
    if(snap.empty) {
      listEl.innerHTML = `
        <div class="empty-state">
          <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>
          <span>No redemption history</span>
        </div>`;
      return;
    }
    
    let arr = [];
    snap.forEach(d => arr.push(d.data()));
    arr.sort((a,b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0));

    let html = '';
    arr.forEach(data => {
      let dateStr = '--';
      if(data.createdAt && data.createdAt.toDate) {
        const d = data.createdAt.toDate();
        const pad = (n) => String(n).padStart(2, '0');
        dateStr = `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
      }
      
      html += `
        <div class="history-card">
          <div class="hc-left">
            <span class="hc-code">${data.code}</span>
            <span class="hc-time">${dateStr}</span>
          </div>
          <div class="hc-right">
            <span class="hc-amt">+₹${Number(data.amount).toFixed(2)}</span>
            <span class="hc-status">Success</span>
          </div>
        </div>`;
    });
    listEl.innerHTML = html;
  } catch(e) {
    console.error("History load error:", e);
  }
}
</script>
</body>
</html>
