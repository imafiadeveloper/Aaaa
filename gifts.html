<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gifts - BDG LOTTERY7</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent;}
body{background:#1A1A1A;color:#fff;min-height:100vh;}
.navbar{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 16px;background:#1A1A1A;}
.nav-left{width:40px;height:40px;display:flex;align-items:center;cursor:pointer;}
.nav-left svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2.2;}
.nav-title{font-size:16px;font-weight:600;}
.banner{position:relative;height:180px;background:linear-gradient(135deg,#2b2b2b,#1e1e1e);margin:16px;border-radius:16px;overflow:hidden;display:flex;align-items:center;padding:24px;}
.banner-bg{position:absolute;right:-20px;top:-20px;opacity:0.1;}
.banner-bg svg{width:200px;height:200px;fill:#FAE59F;}
.banner-content{position:relative;z-index:1;}
.banner h2{font-size:22px;font-weight:700;color:#FAE59F;margin-bottom:8px;}
.banner p{font-size:13px;color:#a6a9ae;}
.redeem-box{margin:16px;background:#262626;border-radius:16px;padding:20px;}
.rb-title{font-size:16px;font-weight:600;margin-bottom:16px;}
.rb-input{width:100%;height:50px;background:#1A1A1A;border:1px solid #444;border-radius:10px;color:#fff;padding:0 16px;font-size:15px;margin-bottom:16px;outline:none;}
.rb-btn{width:100%;height:50px;background:linear-gradient(180deg,#FAE59F 0%,#C4933F 100%);border-radius:10px;color:#3a2a10;font-size:16px;font-weight:700;border:none;cursor:pointer;}
.rb-btn:disabled{opacity:0.6;cursor:not-allowed;}
.history-section{margin:0 16px;}
.hs-title{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600;margin-bottom:12px;color:#fff;}
.hs-title svg{width:20px;height:20px;stroke:#FAE59F;fill:none;stroke-width:2;}
.history-card{background:#262626;border-radius:12px;padding:16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;}
.hc-left{display:flex;flex-direction:column;gap:4px;}
.hc-code{font-size:14px;font-weight:600;color:#fff;}
.hc-time{font-size:12px;color:#a6a9ae;}
.hc-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
.hc-amt{font-size:15px;font-weight:700;color:#6abe57;}
.hc-status{font-size:11px;color:#6abe57;}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 0;color:#666;}
.empty-state svg{width:80px;height:80px;margin-bottom:12px;opacity:0.3;}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(30,30,30,0.98);border:1px solid rgba(250,229,159,0.25);color:#fff;font-size:13px;font-weight:500;padding:12px 22px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:9999;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="navbar">
  <div class="nav-left" onclick="location.href='account.html'"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></div>
  <div class="nav-title">Gifts</div>
  <div style="width:40px;"></div>
</div>

<div class="banner">
  <div class="banner-bg"><svg viewBox="0 0 24 24"><path d="M20 12v10H4V12"/><path d="M2 7h20v5H2zM12 22V7"/><path d="M12 7H7.5a2.5 2.5 0 010-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 000-5C13 2 12 7 12 7z"/></svg></div>
  <div class="banner-content">
    <h2>Hi</h2>
    <p>We have a gift for you</p>
  </div>
</div>

<div class="redeem-box">
  <div class="rb-title">Please enter the gift code below</div>
  <input type="text" id="giftCodeInput" class="rb-input" placeholder="Please enter gift code" style="text-transform:uppercase;">
  <button id="redeemBtn" class="rb-btn" onclick="redeemGift()">Receive</button>
</div>

<div class="history-section">
  <div class="hs-title">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    History
  </div>
  <div id="historyList">
    <div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="1.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>
      <span>No data</span>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, updateDoc, collection, query, where, getDocs, addDoc, serverTimestamp, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyAVQh9b7L3IYgWFIYA3wWorVBk1uXRFDZo", authDomain: "bdglottery7.firebaseapp.com", projectId: "bdglottery7", storageBucket: "bdglottery7.firebasestorage.app", messagingSenderId: "568771943906", appId: "1:568771943906:web:5b78078d9c0d67427dedbb" };
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const toastEl = document.getElementById('toast');
const showToast = (msg) => { toastEl.textContent = msg; toastEl.classList.add('show'); setTimeout(()=>toastEl.classList.remove('show'), 2500); }

let currentUser = null;
onAuthStateChanged(auth, (user) => {
  if(!user) return location.replace('index.html');
  currentUser = user;
  loadHistory();
});

async function redeemGift() {
  const codeInput = document.getElementById('giftCodeInput');
  const code = codeInput.value.trim().toUpperCase();
  if(!code) return showToast('Please enter gift code');
  
  const btn = document.getElementById('redeemBtn');
  btn.disabled = true;
  btn.innerText = 'Checking...';

  try {
    // 1. Gift code check karo
    const q = query(collection(db, 'gift_codes'), where('code', '==', code));
    const snap = await getDocs(q);
    
    if(snap.empty) {
      showToast('Invalid gift code');
      btn.disabled = false; btn.innerText = 'Receive';
      return;
    }
    
    const giftDoc = snap.docs[0];
    const giftData = giftDoc.data();
    
    if(giftData.used) {
      showToast('This code is already used');
      btn.disabled = false; btn.innerText = 'Receive';
      return;
    }

    // 2. Transaction logic (Code used mark karna aur balance badhana)
    await runTransaction(db, async (transaction) => {
      const userRef = doc(db, 'users', currentUser.uid);
      const userDoc = await transaction.get(userRef);
      
      if(!userDoc.exists()) throw "User not found";
      
      const currentBal = Number(userDoc.data().balance || 0);
      const newBal = currentBal + Number(giftData.amount);

      // User ka balance update karo
      transaction.update(userRef, { balance: newBal });
      
      // Gift code ko used mark karo
      transaction.update(giftDoc.ref, { used: true, usedBy: currentUser.uid, usedAt: serverTimestamp() });
      
      // History me save karo
      const historyRef = doc(collection(db, 'gift_history'));
      transaction.set(historyRef, {
        userId: currentUser.uid,
        code: code,
        amount: Number(giftData.amount),
        createdAt: serverTimestamp()
      });
    });

    showToast(`Success! ₹${giftData.amount} credited to your wallet.`);
    codeInput.value = '';
    loadHistory();

  } catch(err) {
    console.error(err);
    showToast('Failed to redeem. Try again.');
  } finally {
    btn.disabled = false; btn.innerText = 'Receive';
  }
}
window.redeemGift = redeemGift;

async function loadHistory() {
  const listEl = document.getElementById('historyList');
  try {
    const q = query(collection(db, 'gift_history'), where('userId', '==', currentUser.uid));
    const snap = await getDocs(q);
    
    if(snap.empty) {
      listEl.innerHTML = `
        <div class="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="1.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>
          <span>No data</span>
        </div>`;
      return;
    }
    
    let arr = [];
    snap.forEach(d => arr.push(d.data()));
    arr.sort((a,b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0));

    let html = '';
    arr.forEach(data => {
      let dateStr = '--';
      if(data.createdAt) {
        const d = data.createdAt.toDate();
        dateStr = `${d.getDate().toString().padStart(2,'0')}-${(d.getMonth()+1).toString().padStart(2,'0')}-${d.getFullYear()} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
      }
      
      html += `
        <div class="history-card">
          <div class="hc-left">
            <span class="hc-code">Code: ${data.code}</span>
            <span class="hc-time">${dateStr}</span>
          </div>
          <div class="hc-right">
            <span class="hc-amt">+₹${Number(data.amount).toFixed(2)}</span>
            <span class="hc-status">Success</span>
          </div>
        </div>`;
    });
    listEl.innerHTML = html;
  } catch(e) {
    console.log(e);
  }
}
</script>
</body>
</html>
