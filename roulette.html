body{background:radial-gradient(circle at 50% 0%, #291036 0%, #08040d 80%);color:#fff;min-height:100vh;padding-bottom:26px;}

.toast{position:fixed;top:18%;left:50%;transform:translateX(-50%);background:rgba(18,12,24,0.96);border:1px solid var(--gold);color:#fff;padding:8px 20px;border-radius:10px;font-size:12px;font-weight:700;z-index:99999;display:none;text-align:center;}
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, doc, getDoc, updateDoc, increment, collection,
  addDoc, serverTimestamp, query, limit, getDocs, where, runTransaction
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAVQh9b7L3IYgWFIYA3wWorVBk1uXRFDZo",
  authDomain: "bdglottery7.firebaseapp.com",
  projectId: "bdglottery7",
  storageBucket: "bdglottery7.firebasestorage.app",
  messagingSenderId: "568771943906",
  appId: "1:568771943906:web:5b78078d9c0d67427dedbb"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const RESULT_COLLECTION = 'results_roulette';
const BET_COLLECTION = 'bets_roulette';
const SLOT_MS = 30 * 1000;
const EPOCH = Date.UTC(2024, 0, 1, 0, 0, 0);

// Standard European Wheel Sequence (37 numbers)
const wheelNumbers = [0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26];
const redNumbers = [1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];

let currentUser = null;
let userBalance = 0;
let currentPeriod = '';
let currentSlot = -1;
let selectedChoice = '', selectedType = '', payoutMultiplier = 2;
let baseAmt = 10, currentQty = 1;
let isBettingClosed = false, soundOn = true;

let myActiveBets = {};

let audioCtx;
function playSound(type) {
  if (!soundOn) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    if (type === 'tick') {
      osc.type = 'sine'; osc.frequency.setValueAtTime(800, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
      osc.start(); osc.stop(audioCtx.currentTime + 0.03);
    } else if (type === 'win') {
      osc.type = 'triangle'; osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
      osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
      osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      osc.start(); osc.stop(audioCtx.currentTime + 0.4);
    } else if (type === 'lose') {
      osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.35);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      osc.start(); osc.stop(audioCtx.currentTime + 0.35);
    }
  } catch(e){}
}

document.getElementById('soundBtn').onclick = () => { soundOn = !soundOn; toast(soundOn ? 'Sound ON' : 'Sound OFF'); };
window.toast = (msg) => { const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 1800); };

function getSlot(ms = Date.now()) { return Math.floor((ms - EPOCH) / SLOT_MS); }
function getPeriodId(slot) {
  const d = new Date(EPOCH + slot * SLOT_MS);
  const y = d.getUTCFullYear();
  const m = String(d.getUTCMonth() + 1).padStart(2, '0');
  const day = String(d.getUTCDate()).padStart(2, '0');
  const slotOfDay = Math.floor((d.getTime() - Date.UTC(y, d.getUTCMonth(), d.getUTCDate())) / SLOT_MS);
  return `${y}${m}${day}RL${String(slotOfDay).padStart(5, '0')}`;
}

// Canvas Wheel Rendering
const canvas = document.getElementById('rouletteCanvas');
const ctx = canvas.getContext('2d');
let currentAngle = 0;
let targetAngle = 0;
let isSpinningFast = false;

function drawWheel(angle = 0) {
  const total = 37;
  const arc = (Math.PI * 2) / total;
  ctx.clearRect(0, 0, 230, 230);
  ctx.save();
  ctx.translate(115, 115);
  ctx.rotate(angle);

  for (let i = 0; i < total; i++) {
    const num = wheelNumbers[i];
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, 110, i * arc, (i + 1) * arc);
    if (num === 0) ctx.fillStyle = '#007a38';
    else ctx.fillStyle = redNumbers.includes(num) ? '#b71c1c' : '#141414';
    ctx.fill();
    ctx.strokeStyle = '#2b1a0a';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.save();
    ctx.rotate(i * arc + arc / 2);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 9px Orbitron';
    ctx.fillText(num, 80, 3);
    ctx.restore();
  }
  ctx.restore();

  // Center Knob
  ctx.beginPath();
  ctx.arc(115, 115, 22, 0, Math.PI * 2);
  ctx.fillStyle = '#f5c443';
  ctx.fill();
  ctx.strokeStyle = '#7c530e';
  ctx.lineWidth = 3;
  ctx.stroke();
}
drawWheel(0);

// Populate Number Grid
function initGrid() {
  const g = document.getElementById('numGrid');
  let html = `<button class="num-btn zero" onclick="openBetModal('0', 'number', 36)">0 GREEN (36X)<span class="bet-badge-dot" id="dot-0">0</span></button>`;
  for (let i = 1; i <= 36; i++) {
    const isRed = redNumbers.includes(i);
    html += `
      <button class="num-btn ${isRed ? 'red-num' : 'black-num'}" onclick="openBetModal('${i}', 'number', 36)">
        ${i}
        <span class="bet-badge-dot" id="dot-${i}">0</span>
      </button>
    `;
  }
  g.innerHTML = html;
}
initGrid();

onAuthStateChanged(auth, async (user) => {
  if (!user) return location.replace('index.html');
  currentUser = user;
  const snap = await getDoc(doc(db, 'users', user.uid));
  if (snap.exists()) {
    userBalance = Number(snap.data().balance || 0);
    document.getElementById('balanceVal').textContent = userBalance.toFixed(2);
  }
  startTimer();
  loadGameHistory();
  loadMyHistory();
});

// House Controlled 10% Real Player Win Rate
function calculateRouletteResult(slot, forcedNum = null) {
  let num;
  if (forcedNum !== null) {
    num = forcedNum;
  } else {
    const seed = (slot * 9301 + 49297) % 233280;
    num = seed % 37;
  }

  let color = 'Green';
  if (num !== 0) {
    color = redNumbers.includes(num) ? 'Red' : 'Black';
  }
  const range = (num === 0) ? 'None' : (num <= 18 ? '1-18' : '19-36');
  const parity = (num === 0) ? 'None' : (num % 2 === 0 ? 'Even' : 'Odd');

  return { num, color, range, parity };
}

function startTimer() {
  let lastSlotTrack = -1;
  setInterval(() => {
    const now = Date.now();
    const slot = getSlot(now);
    const secLeft = Math.max(0, Math.ceil((SLOT_MS - (now - (EPOCH + slot * SLOT_MS))) / 1000));

    if (lastSlotTrack !== -1 && slot !== lastSlotTrack) {
      resolveRound(lastSlotTrack);
    }

    lastSlotTrack = slot;
    currentSlot = slot;
    currentPeriod = getPeriodId(slot);
    document.getElementById('periodText').textContent = currentPeriod.slice(-7);
    document.getElementById('timerClock').textContent = `${secLeft}s`;

    // 🛑 5s Stop / Spin Fast
    if (secLeft <= 5) {
      isBettingClosed = true;
      document.getElementById('drawOverlay').classList.add('show');
      document.getElementById('drawSec').textContent = secLeft;
      if (secLeft > 0) playSound('tick');
      currentAngle += 0.35;
      drawWheel(currentAngle);
    } else {
      isBettingClosed = false;
      document.getElementById('drawOverlay').classList.remove('show');
      currentAngle += 0.015;
      drawWheel(currentAngle);

      if (secLeft >= 28) {
        // Reset Board For New Spin
        document.querySelectorAll('.bet-badge-dot').forEach(el => el.style.display = 'none');
        myActiveBets = {};
      }
    }
  }, 100);
}

async function resolveRound(slot) {
  const periodId = getPeriodId(slot);

  // House Controlled 10% Real User Win Rule
  let forcedNum = null;
  const hasBets = Object.keys(myActiveBets).length > 0;

  if (hasBets) {
    const isLucky = (Math.random() < 0.10); // 10% Cap
    if (!isLucky) {
      // Pick a number that player didn't bet on
      const safeNumbers = [];
      for (let i = 0; i < 37; i++) {
        const c = i === 0 ? 'Green' : (redNumbers.includes(i) ? 'Red' : 'Black');
        const r = i <= 18 ? '1-18' : '19-36';
        const p = i % 2 === 0 ? 'Even' : 'Odd';
        if (!myActiveBets[i] && !myActiveBets[c] && !myActiveBets[r] && !myActiveBets[p]) {
          safeNumbers.push(i);
        }
      }
      if (safeNumbers.length > 0) {
        forcedNum = safeNumbers[Math.floor(Math.random() * safeNumbers.length)];
      }
    }
  }

  const res = calculateRouletteResult(slot, forcedNum);
  document.getElementById('lastNum').textContent = `${res.num} ${res.color}`;

  // Smooth wheel snapping to winning number
  const numIndex = wheelNumbers.indexOf(res.num);
  const total = 37;
  const arc = (Math.PI * 2) / total;
  currentAngle = (Math.PI * 1.5) - (numIndex * arc) - (arc / 2);
  drawWheel(currentAngle);

  // Save to Firestore
  try {
    const ref = doc(db, RESULT_COLLECTION, periodId);
    await runTransaction(db, async (tx) => {
      const ex = await tx.get(ref);
      if (!ex.exists()) tx.set(ref, { period: periodId, ...res, createdAt: serverTimestamp() });
    });
  } catch(e){}

  await resolveBets(periodId, res);
  loadGameHistory();
  loadMyHistory();
}

async function resolveBets(periodId, resData) {
  if (!currentUser) return;
  try {
    const q = query(collection(db, BET_COLLECTION), where('userId', '==', currentUser.uid), where('period', '==', periodId));
    const snap = await getDocs(q);
    if (snap.empty) return;
    let winTotal = 0, lostTotal = 0, hasPending = false;
    const batch = [];

    snap.forEach(d => {
      const b = d.data();
      if (b.status !== 'pending') return;
      hasPending = true;
      let won = false;
      if (b.type === 'color' && b.choice === resData.color) won = true;
      else if (b.type === 'number' && parseInt(b.choice) === resData.num) won = true;
      else if (b.type === 'range' && b.choice === resData.range) won = true;
      else if (b.type === 'parity' && b.choice === resData.parity) won = true;

      let winAmt = 0;
      if (won) {
        winAmt = b.amount * b.payoutMultiplier;
        winTotal += winAmt;
      } else {
        lostTotal += b.amount;
      }
      batch.push(updateDoc(doc(db, BET_COLLECTION, d.id), { status: won ? 'win' : 'lose', winAmount: winAmt, hitNum: resData.num }));
    });

    if (!hasPending) return;
    await Promise.all(batch);

    if (winTotal > 0) {
      await updateDoc(doc(db, 'users', currentUser.uid), { balance: increment(winTotal) });
      userBalance += winTotal;
      document.getElementById('balanceVal').textContent = userBalance.toFixed(2);
      showResultPopup(true, winTotal, `${resData.num} (${resData.color})`);
    } else if (lostTotal > 0) {
      showResultPopup(false, lostTotal, `${resData.num} (${resData.color})`);
    }
  } catch(e){}
}

function showResultPopup(isWin, amt, numStr) {
  const pop = document.getElementById('resultPopup');
  const card = document.getElementById('resCard');
  card.className = `res-card ${isWin ? 'win' : 'lose'}`;
  document.getElementById('resIcon').textContent = isWin ? '🎯' : '💀';
  document.getElementById('resTitle').textContent = isWin ? `HIT ${numStr} (WON!)` : `HIT ${numStr} (LOST)`;
  document.getElementById('resAmt').textContent = (isWin ? '+₹' : '-₹') + Number(amt).toFixed(2);
  pop.classList.add('show');
  playSound(isWin ? 'win' : 'lose');
}
window.closePopup = () => document.getElementById('resultPopup').classList.remove('show');

window.openBetModal = (choice, type, multi) => {
  if (isBettingClosed) return toast('Spin in progress! Wait for next round');
  selectedChoice = choice; selectedType = type; payoutMultiplier = multi;
  document.getElementById('sheetChoice').textContent = `${choice} (${multi}X)`;
  document.getElementById('betModal').classList.add('show');
  updateTotalBetSpan();
};
window.closeBetModal = () => document.getElementById('betModal').classList.remove('show');

window.setAmt = (el, amt) => {
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active'); baseAmt = amt; updateTotalBetSpan();
};
window.setQty = (delta) => {
  currentQty = Math.max(1, currentQty + delta);
  document.getElementById('qtyVal').value = currentQty; updateTotalBetSpan();
};
function updateTotalBetSpan() { document.getElementById('totalBetSpan').textContent = baseAmt * currentQty; }

window.placeBet = async () => {
  if (isBettingClosed) return toast('Betting closed for current spin');
  const total = baseAmt * currentQty;
  if (total > userBalance) return toast('Insufficient balance');

  const btn = document.getElementById('btnPlaceBet');
  btn.disabled = true;
  btn.textContent = 'PLACING...';

  try {
    await updateDoc(doc(db, 'users', currentUser.uid), { balance: increment(-total) });
    userBalance -= total;
    document.getElementById('balanceVal').textContent = userBalance.toFixed(2);

    await addDoc(collection(db, BET_COLLECTION), {
      userId: currentUser.uid,
      period: currentPeriod,
      choice: selectedChoice,
      type: selectedType,
      amount: total,
      payoutMultiplier: payoutMultiplier,
      status: 'pending',
      createdAt: serverTimestamp()
    });

    myActiveBets[selectedChoice] = (myActiveBets[selectedChoice] || 0) + total;
    const dot = document.getElementById(`dot-${selectedChoice}`);
    if (dot) {
      dot.textContent = `₹${myActiveBets[selectedChoice]}`;
      dot.style.display = 'block';
    }

    toast(`Bet placed on ${selectedChoice}!`);
    closeBetModal();
    loadMyHistory();
  } catch(e){
    toast('Error placing bet');
  } finally {
    btn.disabled = false;
    btn.textContent = `CONFIRM BET ₹${baseAmt * currentQty}`;
  }
};

async function loadGameHistory() {
  const gList = document.getElementById('gameList');
  const recBar = document.getElementById('recentBar');
  try {
    const q = query(collection(db, RESULT_COLLECTION), limit(25));
    const snap = await getDocs(q);
    let arr = [];
    snap.forEach(d => arr.push(d.data()));
    arr.sort((a,b) => (b.period||'').localeCompare(a.period||''));

    recBar.innerHTML = arr.slice(0, 14).map(d => {
      const cls = d.num === 0 ? 'green' : (d.color === 'Red' ? 'red' : 'black');
      return `<div class="h-chip ${cls}">${d.num}</div>`;
    }).join('');

    gList.innerHTML = arr.slice(0, 8).map(d => `
      <div class="table-row">
        <div class="col" style="font-family:'Orbitron',sans-serif;font-size:10px;">${d.period.slice(-5)}</div>
        <div class="col" style="font-family:'Orbitron',sans-serif;font-weight:900;color:var(--gold);">${d.num}</div>
        <div class="col" style="font-weight:800;color:${d.color==='Red'?'var(--red)':(d.color==='Green'?'var(--green)':'#fff')};">${d.color}</div>
        <div class="col">${d.range || '--'}</div>
      </div>
    `).join('');
  } catch(e){}
}

async function loadMyHistory() {
  const myView = document.getElementById('myList');
  try {
    const q = query(collection(db, BET_COLLECTION), where('userId', '==', currentUser.uid), limit(20));
    const snap = await getDocs(q);
    if (snap.empty) { myView.innerHTML = '<div style="text-align:center;color:#777;padding:15px;font-size:11px;">No bets found</div>'; return; }
    let arr = [];
    snap.forEach(d => arr.push(d.data()));
    arr.sort((a,b) => (b.createdAt?.toMillis()||0) - (a.createdAt?.toMillis()||0));
    myView.innerHTML = arr.slice(0, 8).map(b => `
      <div class="table-row">
        <div class="col" style="font-size:10px;">${b.period.slice(-5)}</div>
        <div class="col" style="font-weight:800;">${b.choice}</div>
        <div class="col">₹${b.amount}</div>
        <div class="col" style="font-weight:800;color:${b.status==='win'?'var(--green)':(b.status==='lose'?'var(--red)':'var(--gold)')};">
          ${b.status==='win'?'+₹'+Number(b.winAmount).toFixed(2):(b.status==='lose'?'-₹'+b.amount:'Pending')}
        </div>
      </div>
    `).join('');
  } catch(e){}
}

window.switchTab = (tab, el) => {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('gameView').style.display = tab === 'game' ? 'block' : 'none';
  document.getElementById('myView').style.display = tab === 'my' ? 'block' : 'none';
};
