<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#141416">
<title>Deposit History - BDG LOTTERY7</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent;}
body{background:#141416;color:#fff;min-height:100vh;padding-bottom:30px;}
.navbar{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;height:54px;padding:0 16px;background:rgba(20,20,22,0.95);border-bottom:1px solid rgba(255,255,255,0.06);}
.nav-left{width:36px;height:36px;display:flex;align-items:center;cursor:pointer;}
.nav-left svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2.4;}
.nav-title{font-size:16px;font-weight:700;}

.tabs-wrap{display:flex;overflow-x:auto;padding:12px 16px;gap:8px;white-space:nowrap;}
.tabs-wrap::-webkit-scrollbar{display:none;}
.tab-item{background:#202024;color:#8f929b;border-radius:10px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;}
.tab-item.active{background:linear-gradient(180deg,#FFE793 0%,#C48E2F 100%);color:#291a03;}

.tx-list{padding:0 16px;}
.tx-card{background:#202024;border:1px solid rgba(255,255,255,0.06);border-radius:14px;padding:14px;margin-bottom:10px;}
.tx-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.tx-row:last-child{margin-bottom:0;}
.tx-label{font-size:12px;color:#8f929b;}
.tx-val{font-size:13px;font-weight:600;}
.tx-amt{font-family:'Orbitron',sans-serif;font-size:15px;font-weight:800;color:#00e676;}
.tx-status{padding:2px 8px;border-radius:4px;font-size:10px;font-weight:800;text-transform:uppercase;}
.st-pending{background:rgba(250,171,0,0.15);color:#ffab00;}
.st-processing{background:rgba(74,144,226,0.15);color:#4a90e2;}
.st-success{background:rgba(0,230,118,0.15);color:#00e676;}
.st-failed{background:rgba(255,77,79,0.15);color:#ff4d4f;}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 0;color:#6b6e78;}
.empty-state svg{width:60px;height:60px;margin-bottom:12px;stroke:#3e3e44;fill:none;stroke-width:1.5;}
.loader{text-align:center;padding:30px;font-size:13px;color:#8f929b;}
</style>
</head>
<body>
<div class="navbar">
  <div class="nav-left" onclick="location.href='wallet.html'"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></div>
  <div class="nav-title">Deposit History</div>
  <div style="width:36px;"></div>
</div>

<div class="tabs-wrap">
  <div class="tab-item active">All Deposits</div>
  <div class="tab-item">UPI Fast QR</div>
</div>

<div class="tx-list" id="txList">
  <div class="loader">Loading history...</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, query, where, getDocs, limit } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAVQh9b7L3IYgWFIYA3wWorVBk1uXRFDZo",
  authDomain: "bdglottery7.firebaseapp.com",
  projectId: "bdglottery7",
  storageBucket: "bdglottery7.firebasestorage.app",
  messagingSenderId: "568771943906",
  appId: "1:568771943906:web:5b78078d9c0d67427dedbb"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth, async (user) => {
  if(!user) return location.replace('index.html');
  loadHistory(user.uid);
});

async function loadHistory(uid) {
  const listEl = document.getElementById('txList');
  try {
    const q = query(collection(db, 'deposits'), where('userId', '==', uid), limit(40));
    const snap = await getDocs(q);
    
    if(snap.empty) {
      listEl.innerHTML = `
        <div class="empty-state">
          <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>
          <span>No deposit records found</span>
        </div>`;
      return;
    }
    
    let arr = [];
    snap.forEach(d => arr.push(d.data()));
    arr.sort((a,b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0));
    
    let html = '';
    arr.forEach(data => {
      let stClass = 'st-pending', stText = 'Pending';
      if(data.status === 'processing') { stClass = 'st-processing'; stText = 'Under Review'; }
      if(data.status === 'success' || data.status === 'completed') { stClass = 'st-success'; stText = 'Success'; }
      if(data.status === 'failed' || data.status === 'rejected' || data.status === 'cancelled') { stClass = 'st-failed'; stText = 'Cancelled'; }
      
      let dateStr = '--';
      if(data.createdAt) {
        const d = data.createdAt.toDate();
        const pad = (x) => String(x).padStart(2, '0');
        dateStr = `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
      }

      html += `
        <div class="tx-card">
          <div class="tx-row">
            <span class="tx-label">Order ID</span>
            <span class="tx-val" style="font-family:'Orbitron',sans-serif;font-size:11px;">${data.orderId || 'N/A'}</span>
          </div>
          <div class="tx-row">
            <span class="tx-label">Amount</span>
            <span class="tx-amt">+₹${Number(data.amount).toFixed(2)}</span>
          </div>
          <div class="tx-row">
            <span class="tx-label">UTR / Ref</span>
            <span class="tx-val" style="color:#FAE59F;">${data.utr || 'Not submitted'}</span>
          </div>
          <div class="tx-row">
            <span class="tx-label">Time</span>
            <span class="tx-val" style="color:#8f929b;">${dateStr}</span>
          </div>
          <div class="tx-row" style="margin-top:10px; padding-top:10px; border-top:1px solid rgba(255,255,255,0.04);">
            <span class="tx-label">Status</span>
            <span class="tx-status ${stClass}">${stText}</span>
          </div>
        </div>`;
    });
    listEl.innerHTML = html;
  } catch(e) {
    listEl.innerHTML = `<div class="empty-state">Failed to load data</div>`;
  }
}
</script>
</body>
</html>
