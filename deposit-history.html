<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#141416">
<title>Deposit History - BDG LOTTERY7</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent;}
body{background:#141416;color:#fff;min-height:100vh;padding-bottom:30px;}
::-webkit-scrollbar{display:none;}

.navbar{
  position:sticky;top:0;z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  height:54px;padding:0 16px;
  background:rgba(20,20,22,0.96);backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(255,255,255,0.06);
}
.nav-left{width:36px;height:36px;display:flex;align-items:center;cursor:pointer;}
.nav-left svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2.4;}
.nav-title{font-size:16px;font-weight:700;}

/* Functional Filter Tabs */
.tabs-wrap{display:flex;overflow-x:auto;padding:12px 16px;gap:8px;white-space:nowrap;}
.tab-item{
  background:#202024;color:#8f929b;border-radius:10px;padding:8px 16px;
  font-size:12px;font-weight:700;cursor:pointer;border:1px solid rgba(255,255,255,0.04);
  transition:all 0.2s ease;
}
.tab-item.active{
  background:linear-gradient(180deg,#FFE793 0%,#C48E2F 100%);
  color:#291a03;border-color:transparent;box-shadow:0 2px 8px rgba(196,142,47,0.3);
}

.tx-list{padding:0 16px;}
.tx-card{
  background:#202024;border:1px solid rgba(255,255,255,0.06);
  border-radius:14px;padding:14px;margin-bottom:12px;
  box-shadow:0 4px 14px rgba(0,0,0,0.3);
}
.tx-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.tx-row:last-child{margin-bottom:0;}
.tx-label{font-size:12px;color:#8f929b;}
.tx-val{font-size:13px;font-weight:600;}
.tx-amt{font-family:'Orbitron',sans-serif;font-size:15px;font-weight:800;color:#00e676;}
.tx-status{padding:2px 8px;border-radius:4px;font-size:10px;font-weight:800;text-transform:uppercase;}

.st-pending{background:rgba(250,171,0,0.15);color:#ffab00;}
.st-processing{background:rgba(74,144,226,0.15);color:#4a90e2;}
.st-success{background:rgba(0,230,118,0.15);color:#00e676;}
.st-failed{background:rgba(255,77,79,0.15);color:#ff4d4f;}

.channel-tag{
  font-size:10px;font-weight:700;color:#FAE59F;background:rgba(250,229,159,0.1);
  padding:2px 6px;border-radius:4px;display:inline-block;
}

.empty-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:60px 0;color:#6b6e78;
}
.empty-state svg{width:56px;height:56px;margin-bottom:12px;stroke:#3e3e44;fill:none;stroke-width:1.5;}
.empty-state span{font-size:13px;font-weight:600;}
.loader{text-align:center;padding:35px;font-size:13px;color:#8f929b;}

.toast{
  position:fixed;top:30%;left:50%;transform:translateX(-50%) translateY(-10px);
  background:rgba(20,20,22,0.96);border:1px solid #FAE59F;color:#fff;
  font-size:12px;font-weight:700;padding:10px 22px;border-radius:10px;
  opacity:0;pointer-events:none;transition:all .25s ease;z-index:9999;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div class="navbar">
  <div class="nav-left" onclick="location.href='wallet.html'"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></div>
  <div class="nav-title">Deposit History</div>
  <div style="width:36px;"></div>
</div>

<!-- Functional Interactive Tabs -->
<div class="tabs-wrap">
  <div class="tab-item active" id="tab-all" onclick="filterChannel('all', this)">All Deposits</div>
  <div class="tab-item" id="tab-upi" onclick="filterChannel('upi', this)">UPI Fast QR</div>
</div>

<div class="tx-list" id="txList">
  <div class="loader">Loading history...</div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { 
  getFirestore, collection, query, where, getDocs, limit, onSnapshot 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAVQh9b7L3IYgWFIYA3wWorVBk1uXRFDZo",
  authDomain: "bdglottery7.firebaseapp.com",
  projectId: "bdglottery7",
  storageBucket: "bdglottery7.firebasestorage.app",
  messagingSenderId: "568771943906",
  appId: "1:568771943906:web:5b78078d9c0d67427dedbb"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let masterDeposits = [];
let activeFilter = 'all';

const toastEl = document.getElementById('toast');
window.toast = (msg) => {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 2000);
};

window.copyRef = (text) => {
  if (!text || text === 'Not submitted') return;
  navigator.clipboard.writeText(text).then(() => toast('UTR Copied!'));
};

onAuthStateChanged(auth, async (user) => {
  if (!user) return location.replace('index.html');
  currentUser = user;
  listenToDeposits(user.uid);
});

function listenToDeposits(uid) {
  const q = query(collection(db, 'deposits'), where('userId', '==', uid), limit(50));
  
  onSnapshot(q, (snap) => {
    if (snap.empty) {
      masterDeposits = [];
      renderDeposits();
      return;
    }

    let arr = [];
    snap.forEach(d => {
      const data = d.data();
      arr.push({
        docId: d.id,
        orderId: data.orderId || d.id,
        amount: Number(data.amount || 0),
        utr: data.utr || null,
        status: (data.status || 'pending').toLowerCase(),
        channel: data.channel || 'UPI Fast QR',
        createdAt: data.createdAt || data.submittedAt
      });
    });

    arr.sort((a, b) => {
      const tA = a.createdAt?.toMillis?.() || 0;
      const tB = b.createdAt?.toMillis?.() || 0;
      return tB - tA;
    });

    masterDeposits = arr;
    renderDeposits();
  }, (err) => {
    document.getElementById('txList').innerHTML = `<div class="empty-state"><span>Failed to load deposit data</span></div>`;
  });
}

function renderDeposits() {
  const listEl = document.getElementById('txList');
  
  const filtered = activeFilter === 'all' 
    ? masterDeposits 
    : masterDeposits.filter(d => {
        const ch = (d.channel || '').toLowerCase();
        return ch.includes('upi') || ch.includes('qr') || ch.includes('fast');
      });

  if (filtered.length === 0) {
    listEl.innerHTML = `
      <div class="empty-state">
        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>
        <span>No ${activeFilter === 'upi' ? 'UPI Fast QR' : ''} deposit records found</span>
      </div>`;
    return;
  }

  let html = '';
  filtered.forEach(data => {
    let stClass = 'st-pending', stText = 'Pending';
    if (data.status === 'processing') { stClass = 'st-processing'; stText = 'Under Review'; }
    if (data.status === 'success' || data.status === 'completed' || data.status === 'approved') { 
      stClass = 'st-success'; 
      stText = 'Success'; 
    }
    if (data.status === 'failed' || data.status === 'rejected' || data.status === 'cancelled') { 
      stClass = 'st-failed'; 
      stText = 'Cancelled'; 
    }

    let dateStr = '--';
    if (data.createdAt) {
      const d = data.createdAt.toDate ? data.createdAt.toDate() : new Date(data.createdAt);
      const pad = (x) => String(x).padStart(2, '0');
      dateStr = `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    const utrVal = data.utr ? data.utr : 'Not submitted';

    html += `
      <div class="tx-card">
        <div class="tx-row">
          <span class="tx-label">Channel</span>
          <span class="channel-tag">${data.channel}</span>
        </div>
        <div class="tx-row">
          <span class="tx-label">Order ID</span>
          <span class="tx-val" style="font-family:'Orbitron',sans-serif;font-size:11px;">#${data.orderId}</span>
        </div>
        <div class="tx-row">
          <span class="tx-label">Amount</span>
          <span class="tx-amt">+₹${data.amount.toFixed(2)}</span>
        </div>
        <div class="tx-row">
          <span class="tx-label">UTR / Ref</span>
          <span class="tx-val" style="color:#FAE59F;cursor:pointer;" onclick="copyRef('${data.utr}')">
            ${utrVal} ${data.utr ? '📋' : ''}
          </span>
        </div>
        <div class="tx-row">
          <span class="tx-label">Time</span>
          <span class="tx-val" style="color:#8f929b;font-size:12px;">${dateStr}</span>
        </div>
        <div class="tx-row" style="margin-top:10px; padding-top:10px; border-top:1px solid rgba(255,255,255,0.04);">
          <span class="tx-label">Status</span>
          <span class="tx-status ${stClass}">${stText}</span>
        </div>
      </div>`;
  });

  listEl.innerHTML = html;
}

window.filterChannel = (type, el) => {
  document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  activeFilter = type;
  renderDeposits();
};
</script>
</body>
</html>
