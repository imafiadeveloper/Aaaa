<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#181818">
<title>BDG GAME - Bonus Details</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Orbitron:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --gold: #FAE59F;
  --gold-grad: linear-gradient(180deg, #FFE793 0%, #C48E2F 100%);
  --bg-main: #141416;
  --card-bg: #202024;
  --border: rgba(255,255,255,0.06);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:'Inter',sans-serif;}
body{background:var(--bg-main);color:#fff;min-height:100vh;padding-bottom:30px;}
button{border:none;outline:none;cursor:pointer;background:transparent;color:inherit;}
::-webkit-scrollbar{width:0;height:0;}

/* Navbar */
.navbar{position:sticky;top:0;z-index:100;height:52px;background:#18181a;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--border);}
.nav-left{width:32px;height:32px;display:flex;align-items:center;cursor:pointer;}
.nav-left svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2.4;}
.navbar-title{font-size:16px;font-weight:700;flex:1;text-align:center;margin-right:32px;}

/* Top Summary Banner */
.summary-card{
  margin:12px 14px;background:linear-gradient(135deg, #2c2415 0%, #171618 100%);
  border-radius:18px;padding:18px 16px;border:1px solid rgba(250,229,159,0.25);
  box-shadow:0 8px 24px rgba(0,0,0,0.5);display:flex;justify-content:space-between;align-items:center;
}
.sc-info span{font-size:11px;color:#a6a9ae;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;}
.sc-info h1{font-family:'Orbitron',sans-serif;font-size:26px;font-weight:900;color:var(--gold);margin-top:4px;}
.sc-icon{width:50px;height:50px;border-radius:14px;background:rgba(250,229,159,0.1);display:flex;align-items:center;justify-content:center;font-size:26px;}

/* Filter Tabs */
.filter-tabs-wrap{
  display:flex;gap:8px;padding:0 14px 14px;overflow-x:auto;scrollbar-width:none;
}
.f-tab{
  flex:0 0 auto;padding:8px 16px;border-radius:20px;background:#202024;
  color:#8f929b;font-size:12px;font-weight:700;border:1px solid var(--border);transition:all .2s;
}
.f-tab.active{background:var(--gold-grad);color:#291a03;border-color:transparent;}

/* Records List */
.records-wrap{padding:0 14px;display:flex;flex-direction:column;gap:10px;}
.record-card{
  background:#202024;border-radius:14px;padding:14px 16px;border:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;
}
.rc-left h4{font-size:13px;font-weight:700;color:#fff;}
.rc-left p{font-size:11px;color:#7e8290;margin-top:3px;}
.rc-right{text-align:right;}
.rc-right .amt{font-family:'Orbitron',sans-serif;font-size:15px;font-weight:900;color:#00e676;}
.rc-right .status{font-size:10px;color:var(--gold);font-weight:700;margin-top:2px;text-transform:uppercase;}

.empty-state{text-align:center;padding:50px 20px;color:#666;}
.empty-state .ico{font-size:44px;margin-bottom:10px;opacity:0.4;}
.empty-state p{font-size:13px;font-weight:600;}

.toast{position:fixed;top:30%;left:50%;transform:translateX(-50%);background:rgba(20,20,22,0.96);border:1px solid var(--gold);color:#fff;font-size:13px;font-weight:700;padding:10px 20px;border-radius:8px;display:none;z-index:9999;}
</style>
</head>
<body>

<header class="navbar">
  <div class="nav-left" onclick="location.href='activity.html'">
    <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
  </div>
  <div class="navbar-title">Bonus Details</div>
</header>

<div class="summary-card">
  <div class="sc-info">
    <span>Cumulative Activity Bonus</span>
    <h1 id="totalBonusDisplay">₹0.00</h1>
  </div>
  <div class="sc-icon">💰</div>
</div>

<div class="filter-tabs-wrap">
  <button class="f-tab active" onclick="filterBonus('all', this)">All</button>
  <button class="f-tab" onclick="filterBonus('Attendance', this)">Attendance</button>
  <button class="f-tab" onclick="filterBonus('Rebate', this)">Rebate</button>
  <button class="f-tab" onclick="filterBonus('Wheel', this)">Wheel Spin</button>
  <button class="f-tab" onclick="filterBonus('Mystery', this)">Mystery</button>
  <button class="f-tab" onclick="filterBonus('Invite', this)">Invitation</button>
</div>

<div class="records-wrap" id="recordsContainer">
  <div class="empty-state">
    <div class="ico">⏳</div>
    <p>Loading records...</p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, query, where, getDocs, limit } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAVQh9b7L3IYgWFIYA3wWorVBk1uXRFDZo",
  authDomain: "bdglottery7.firebaseapp.com",
  projectId: "bdglottery7",
  storageBucket: "bdglottery7.firebasestorage.app",
  messagingSenderId: "568771943906",
  appId: "1:568771943906:web:5b78078d9c0d67427dedbb"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let allTransactions = [];

window.toast = (msg) => {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 1800);
};

onAuthStateChanged(auth, async (user) => {
  if (user) {
    currentUser = user;
    const userSnap = await getDoc(doc(db, 'users', user.uid));
    if (userSnap.exists()) {
      const data = userSnap.data();
      document.getElementById('totalBonusDisplay').textContent = `₹${Number(data.totalBonus || 0).toFixed(2)}`;
    }
    await loadBonusHistory();
  } else {
    location.replace('index.html');
  }
});

async function loadBonusHistory() {
  const container = document.getElementById('recordsContainer');
  try {
    const q = query(
      collection(db, 'transactions'),
      where('userId', '==', currentUser.uid),
      where('type', '==', 'bonus'),
      limit(50)
    );
    const snap = await getDocs(q);
    allTransactions = [];

    snap.forEach(d => {
      allTransactions.push({ id: d.id, ...d.data() });
    });

    allTransactions.sort((a,b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0));
    renderRecords(allTransactions);
  } catch(e) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="ico">⚠️</div>
        <p>Failed to load records</p>
      </div>`;
  }
}

function renderRecords(list) {
  const container = document.getElementById('recordsContainer');
  if (!list || list.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="ico">📂</div>
        <p>No bonus records found</p>
      </div>`;
    return;
  }

  container.innerHTML = list.map(item => {
    let dateStr = 'Recent';
    if (item.createdAt && item.createdAt.toDate) {
      dateStr = item.createdAt.toDate().toLocaleString('en-IN', {
        day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'
      });
    }
    return `
      <div class="record-card">
        <div class="rc-left">
          <h4>${item.title || 'Activity Bonus'}</h4>
          <p>${dateStr}</p>
        </div>
        <div class="rc-right">
          <div class="amt">+₹${Number(item.amount || 0).toFixed(2)}</div>
          <div class="status">${item.status || 'Success'}</div>
        </div>
      </div>
    `;
  }).join('');
}

window.filterBonus = (category, el) => {
  document.querySelectorAll('.f-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');

  if (category === 'all') {
    renderRecords(allTransactions);
  } else {
    const filtered = allTransactions.filter(item => 
      (item.title || '').toLowerCase().includes(category.toLowerCase())
    );
    renderRecords(filtered);
  }
};
</script>
</body>
</html>
