<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d1117">
<title>BDG LOTTERY7 - Plinko</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Orbitron:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#f5c443;
  --gold-grad:linear-gradient(135deg, #ffe57f 0%, #f5c443 50%, #c8891d 100%);
  --card-bg:#161b22;
  --border:rgba(255,255,255,0.08);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:'Inter',sans-serif;}
body{background:radial-gradient(circle at 50% 0%, #1a2332 0%, #0a0d14 75%);color:#fff;min-height:100vh;padding-bottom:30px;}
button{border:none;outline:none;cursor:pointer;background:transparent;color:inherit;}
::-webkit-scrollbar{width:0;height:0;}

.navbar{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;height:54px;padding:0 16px;background:rgba(13,17,23,0.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);}
.nav-left{width:36px;height:36px;display:flex;align-items:center;cursor:pointer;}
.nav-left svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2.4;}
.navbar-brand{font-family:'Orbitron',sans-serif;font-size:16px;font-weight:900;letter-spacing:1px;color:#fff;}
.navbar-brand span{color:var(--gold);}
.nav-right{display:flex;align-items:center;gap:10px;}
.nav-icon{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,0.05);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.nav-icon svg{width:18px;height:18px;stroke:var(--gold);fill:none;stroke-width:2;}

.bal-card{background:linear-gradient(145deg, #1c2430 0%, #10141b 100%);margin:12px 16px;border-radius:18px;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;border:1px solid rgba(245,196,67,0.25);box-shadow:0 8px 24px rgba(0,0,0,0.5);}
.bal-label{font-size:11px;color:#8b9bb4;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;margin-bottom:2px;}
.bal-amt{font-family:'Orbitron',sans-serif;font-size:24px;font-weight:900;color:#fff;}
.bal-amt span{color:var(--gold);}
.refresh-btn{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.refresh-btn svg{width:18px;height:18px;stroke:var(--gold);fill:none;stroke-width:2.2;}

.canvas-box{margin:0 16px 14px;background:linear-gradient(145deg, #161c24 0%, #0d1117 100%);border-radius:20px;padding:14px;border:1px solid var(--border);box-shadow:0 10px 30px rgba(0,0,0,0.6);text-align:center;}
#plinkoCanvas{width:100%;max-width:340px;height:auto;display:block;margin:0 auto;}

.mult-row{display:flex;gap:4px;justify-content:center;margin-top:6px;}
.slot-tag{flex:1;padding:4px 0;border-radius:4px;font-family:'Orbitron',sans-serif;font-size:10px;font-weight:800;text-align:center;color:#fff;}

.ctrl-card{margin:0 16px 16px;background:var(--card-bg);border-radius:18px;padding:16px;border:1px solid var(--border);}
.ctrl-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.ctrl-lbl{font-size:12px;font-weight:700;color:#8b9bb4;text-transform:uppercase;}
.chips{display:flex;gap:6px;}
.chip{padding:6px 12px;border-radius:8px;background:rgba(255,255,255,0.05);border:1px solid var(--border);font-size:12px;font-weight:800;cursor:pointer;}
.chip.active{background:var(--gold-grad);color:#211400;border:none;}

.risk-btns{display:flex;gap:6px;}
.r-btn{flex:1;padding:8px 0;border-radius:8px;background:rgba(255,255,255,0.05);font-size:12px;font-weight:800;color:#8b9bb4;text-align:center;}
.r-btn.active{background:#2a3649;color:#fff;border:1px solid var(--gold);}

.btn-drop{width:100%;height:48px;border-radius:14px;background:var(--gold-grad);color:#211400;font-size:15px;font-weight:900;text-transform:uppercase;letter-spacing:1px;box-shadow:0 6px 20px rgba(245,196,67,0.35);margin-top:4px;}
.btn-drop:active{transform:scale(0.97);}
.btn-drop:disabled{opacity:0.5;cursor:not-allowed;}

.tabs-wrap{display:flex;margin:0 16px 10px;background:var(--card-bg);border-radius:12px;padding:4px;border:1px solid var(--border);}
.tab-btn{flex:1;text-align:center;padding:9px;font-size:12px;font-weight:700;color:#8b9bb4;border-radius:8px;}
.tab-btn.active{background:#232d3d;color:var(--gold);}
.history-wrap{margin:0 16px;background:var(--card-bg);border-radius:16px;padding:12px;border:1px solid var(--border);min-height:100px;}
.table-head,.table-row{display:flex;align-items:center;justify-content:space-between;padding:10px 8px;font-size:12px;}
.table-head{color:#8b9bb4;font-weight:700;border-bottom:1px solid var(--border);text-transform:uppercase;font-size:10px;}
.table-row{border-bottom:1px solid rgba(255,255,255,0.03);}
.table-row:last-child{border-bottom:none;}
.col{flex:1;text-align:center;}

.toast{position:fixed;top:20%;left:50%;transform:translateX(-50%);background:rgba(18,24,32,0.96);border:1px solid var(--gold);color:#fff;padding:10px 22px;border-radius:10px;font-size:12px;font-weight:700;z-index:99999;display:none;text-align:center;}
</style>
</head>
<body>

<div class="navbar">
  <div class="nav-left" onclick="location.href='home.html'"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></div>
  <div class="navbar-brand">BDG <span>PLINKO</span></div>
  <div class="nav-right">
    <div class="nav-icon" id="soundBtn"><svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/></svg></div>
  </div>
</div>

<div class="bal-card">
  <div>
    <div class="bal-label">Total Balance</div>
    <div class="bal-amt">₹<span id="balanceVal">0.00</span></div>
  </div>
  <div class="refresh-btn" onclick="location.reload()"><svg viewBox="0 0 24 24"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg></div>
</div>

<div class="canvas-box">
  <canvas id="plinkoCanvas" width="340" height="360"></canvas>
  <div class="mult-row" id="multRow"></div>
</div>

<div class="ctrl-card">
  <div class="ctrl-row">
    <span class="ctrl-lbl">Bet Amount</span>
    <div class="chips">
      <div class="chip active" onclick="setAmt(this,10)">₹10</div>
      <div class="chip" onclick="setAmt(this,50)">₹50</div>
      <div class="chip" onclick="setAmt(this,100)">₹100</div>
      <div class="chip" onclick="setAmt(this,500)">₹500</div>
    </div>
  </div>
  <div class="ctrl-row">
    <span class="ctrl-lbl">Risk Level</span>
    <div class="risk-btns">
      <button class="r-btn" onclick="setRisk(this,'low')">Low</button>
      <button class="r-btn active" onclick="setRisk(this,'medium')">Medium</button>
      <button class="r-btn" onclick="setRisk(this,'high')">High</button>
    </div>
  </div>
  <button class="btn-drop" id="dropBtn" onclick="dropBall()">Drop Ball</button>
</div>

<div class="tabs-wrap">
  <div class="tab-btn active" onclick="switchTab('my',this)">My Drops</div>
  <div class="tab-btn" onclick="switchTab('multi',this)">Multipliers Info</div>
</div>

<div class="history-wrap">
  <div id="myView">
    <div class="table-head"><div class="col">Time</div><div class="col">Bet</div><div class="col">Multiplier</div><div class="col">Payout</div></div>
    <div id="myList"></div>
  </div>
  <div id="multiView" style="display:none;font-size:12px;color:#8b9bb4;line-height:1.7;">
    Plinko uses physical pegs simulation. Drop the ball from the top to reach multiplier bins. Payouts have an automatic 15% platform fee deducted upon win.
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, updateDoc, increment, collection, addDoc, serverTimestamp, query, limit, getDocs, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAVQh9b7L3IYgWFIYA3wWorVBk1uXRFDZo",
  authDomain: "bdglottery7.firebaseapp.com",
  projectId: "bdglottery7",
  storageBucket: "bdglottery7.firebasestorage.app",
  messagingSenderId: "568771943906",
  appId: "1:568771943906:web:5b78078d9c0d67427dedbb"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const BET_COLLECTION = 'bets_plinko';

let currentUser = null;
let userBalance = 0;
let currentBet = 10;
let riskLevel = 'medium';
let soundOn = true;
let isDropping = false;

// 9 Multiplier Bins (index 0 to 8)
const multipliers = {
  low: [5.6, 2.1, 1.1, 1.0, 0.5, 1.0, 1.1, 2.1, 5.6],
  medium: [13, 3, 1.3, 0.7, 0.4, 0.7, 1.3, 3, 13],
  high: [29, 4, 1.5, 0.3, 0.2, 0.3, 1.5, 4, 29]
};

const multColors = ['#ff1744', '#ff5252', '#ff9100', '#ffea00', '#00e676', '#ffea00', '#ff9100', '#ff5252', '#ff1744'];

let audioCtx;
function playSound(type) {
  if (!soundOn) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    if (type === 'hit') {
      osc.type = 'sine'; osc.frequency.setValueAtTime(600 + Math.random()*200, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
      osc.start(); osc.stop(audioCtx.currentTime + 0.03);
    } else if (type === 'win') {
      osc.type = 'triangle'; osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
      osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    }
  } catch(e){}
}

document.getElementById('soundBtn').onclick = () => {
  soundOn = !soundOn; toast(soundOn ? 'Sound ON' : 'Sound OFF');
};

window.toast = (msg) => {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 1800);
};

// Canvas Setup
const canvas = document.getElementById('plinkoCanvas');
const ctx = canvas.getContext('2d');
const rows = 8;
const pegs = [];
const startX = 170;
const startY = 35;
const rowGap = 32;
const colGap = 32;

for (let r = 0; r < rows; r++) {
  const count = r + 3;
  const left = startX - ((count - 1) * colGap) / 2;
  for (let c = 0; c < count; c++) {
    pegs.push({ x: left + c * colGap, y: startY + r * rowGap, r: 3.5 });
  }
}

function updateMultRow() {
  const row = document.getElementById('multRow');
  const list = multipliers[riskLevel];
  row.innerHTML = list.map((m, i) => `
    <div class="slot-tag" style="background:${multColors[i]};color:#000;">${m}x</div>
  `).join('');
}
updateMultRow();

function drawBoard() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  pegs.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.shadowBlur = 6;
    ctx.shadowColor = '#fff';
    ctx.fill();
    ctx.shadowBlur = 0;
  });
}
drawBoard();

onAuthStateChanged(auth, async (user) => {
  if (!user) return location.replace('index.html');
  currentUser = user;
  const snap = await getDoc(doc(db, 'users', user.uid));
  if (snap.exists()) {
    userBalance = Number(snap.data().balance || 0);
    document.getElementById('balanceVal').textContent = userBalance.toFixed(2);
  }
  loadMyHistory();
});

window.setAmt = (el, amt) => {
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  currentBet = amt;
};

window.setRisk = (el, r) => {
  if (isDropping) return;
  document.querySelectorAll('.r-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  riskLevel = r;
  updateMultRow();
};

// House-Controlled Bin Picker
function pickControlledBin(bet) {
  const roll = Math.random();

  // High bet (₹100 or ₹500) -> 100% loss trap in lowest center slots
  if (bet >= 100) {
    if (roll < 0.60) return 4; // Center absolute lowest (0.2x / 0.4x / 0.5x)
    return roll < 0.85 ? 3 : 5; // Near-center (0.3x / 0.7x)
  }

  // Normal / Low Bet
  // 95% chance: strictly center low/loss slots (0.2x, 0.4x, 0.7x, 1.0x, 1.3x)
  if (roll < 0.50) {
    return 4; // Exact center lowest: 0.2x / 0.4x / 0.5x
  } else if (roll < 0.85) {
    return (Math.random() < 0.5) ? 3 : 5; // 0.3x / 0.7x / 1.0x
  } else if (roll < 0.95) {
    return (Math.random() < 0.5) ? 2 : 6; // 1.1x / 1.3x / 1.5x
  } else {
    // Under 5% rare chance: step towards 3x or 4x (indices 1 or 7, NEVER 0 or 8 extreme corners)
    return (Math.random() < 0.5) ? 1 : 7;
  }
}

window.dropBall = async () => {
  if (isDropping) return;
  if (currentBet > userBalance) return toast('Insufficient balance');

  isDropping = true;
  document.getElementById('dropBtn').disabled = true;

  try {
    await updateDoc(doc(db, 'users', currentUser.uid), { balance: increment(-currentBet) });
    userBalance -= currentBet;
    document.getElementById('balanceVal').textContent = userBalance.toFixed(2);

    // Target determined before drop
    const targetBin = pickControlledBin(currentBet);
    const binWidth = canvas.width / 9;
    const targetX = (targetBin + 0.5) * binWidth;

    let ball = { 
      x: startX + (Math.random() * 2 - 1), 
      y: 15, 
      vx: (Math.random() - 0.5) * 0.4, 
      vy: 1.5, 
      r: 6 
    };

    function animate() {
      drawBoard();

      ball.vy += 0.22; // gravity

      // Target steering force to ensure landing inside targetBin naturally
      const progress = Math.min(1, ball.y / 300);
      const steerForce = (targetX - ball.x) * 0.016 * progress;
      ball.vx += steerForce;
      ball.vx = Math.max(-2.2, Math.min(2.2, ball.vx)); // limit speed

      ball.x += ball.vx;
      ball.y += ball.vy;

      pegs.forEach(p => {
        const dx = ball.x - p.x;
        const dy = ball.y - p.y;
        const dist = Math.hypot(dx, dy);
        if (dist < ball.r + p.r) {
          playSound('hit');
          const angle = Math.atan2(dy, dx);
          const push = 1.4;
          ball.vx = Math.cos(angle) * push + (Math.random() * 0.2 - 0.1);
          ball.vy = Math.abs(Math.sin(angle)) * push + 0.4;
        }
      });

      // Ball render
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fillStyle = '#f5c443';
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#f5c443';
      ctx.fill();
      ctx.shadowBlur = 0;

      if (ball.y < 305) {
        requestAnimationFrame(animate);
      } else {
        const actualBin = Math.min(8, Math.max(0, Math.floor(ball.x / binWidth)));
        const finalBin = (actualBin >= 2 && actualBin <= 6) ? actualBin : targetBin;
        const mult = multipliers[riskLevel][finalBin];
        finishDrop(mult);
      }
    }
    requestAnimationFrame(animate);

  } catch(e) {
    toast('Error starting drop');
    isDropping = false;
    document.getElementById('dropBtn').disabled = false;
  }
};

async function finishDrop(mult) {
  const gross = currentBet * mult;
  let winAmt = 0;
  if (gross > currentBet) {
    const tax = (gross - currentBet) * 0.15;
    winAmt = gross - tax;
  } else {
    winAmt = gross;
  }

  try {
    if (winAmt > 0) {
      await updateDoc(doc(db, 'users', currentUser.uid), { balance: increment(winAmt) });
      userBalance += winAmt;
      document.getElementById('balanceVal').textContent = userBalance.toFixed(2);
      playSound('win');
    }

    await addDoc(collection(db, BET_COLLECTION), {
      userId: currentUser.uid,
      amount: currentBet,
      multiplier: mult,
      payout: winAmt,
      risk: riskLevel,
      status: mult >= 1 ? 'win' : 'lose',
      createdAt: serverTimestamp()
    });

    toast(`Result: ${mult}X | Payout: ₹${winAmt.toFixed(2)}`);
    loadMyHistory();
  } catch(e){}

  isDropping = false;
  document.getElementById('dropBtn').disabled = false;
  setTimeout(drawBoard, 800);
}

async function loadMyHistory() {
  const myView = document.getElementById('myList');
  try {
    const q = query(collection(db, BET_COLLECTION), where('userId', '==', currentUser.uid), limit(15));
    const snap = await getDocs(q);
    if (snap.empty) {
      myView.innerHTML = '<div style="text-align:center;color:#777;padding:20px;font-size:12px;">No drops yet</div>';
      return;
    }
    let arr = [];
    snap.forEach(d => arr.push(d.data()));
    arr.sort((a,b) => (b.createdAt?.toMillis()||0) - (a.createdAt?.toMillis()||0));
    myView.innerHTML = arr.slice(0, 8).map(b => `
      <div class="table-row">
        <div class="col" style="font-size:10px;color:#777;">${b.createdAt ? new Date(b.createdAt.toDate()).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) : 'Now'}</div>
        <div class="col">₹${b.amount}</div>
        <div class="col" style="font-family:'Orbitron',sans-serif;color:var(--gold);font-weight:800;">${b.multiplier}X</div>
        <div class="col" style="font-weight:800;color:${b.payout >= b.amount ? '#00e676':'#ff5252'};">₹${Number(b.payout).toFixed(2)}</div>
      </div>
    `).join('');
  } catch(e){}
}

window.switchTab = (tab, el) => {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('myView').style.display = tab === 'my' ? 'block' : 'none';
  document.getElementById('multiView').style.display = tab === 'multi' ? 'block' : 'none';
};
</script>
</body>
</html>
