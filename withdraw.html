<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Withdraw - BDG LOTTERY7</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent;}
body{background:#141416;color:#fff;min-height:100vh;padding-bottom:50px;}
.navbar{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;height:54px;padding:0 16px;background:rgba(20,20,22,0.95);border-bottom:1px solid rgba(255,255,255,0.06);}
.nav-left{width:36px;height:36px;display:flex;align-items:center;cursor:pointer;}
.nav-left svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2.4;}
.nav-title{font-size:16px;font-weight:700;}
.nav-right{font-size:12px;font-weight:700;color:#FAE59F;cursor:pointer;}

.banner{margin:14px 16px;background:linear-gradient(135deg,#FFE793 0%,#E5B24E 50%,#C48E2F 100%);border-radius:18px;padding:18px;color:#291a03;}
.banner .label{font-size:12px;font-weight:700;}
.banner .amt{font-family:'Orbitron',sans-serif;font-size:26px;font-weight:900;margin-top:6px;display:flex;align-items:center;gap:10px;}
.banner .amt svg{width:18px;height:18px;stroke:#291a03;fill:none;stroke-width:2.5;cursor:pointer;}

.section-title{font-size:12px;font-weight:700;margin:14px 16px 8px;color:#8f929b;text-transform:uppercase;}
.methods{display:flex;gap:10px;margin:0 16px;}
.method{flex:1;background:#202024;border-radius:12px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:700;cursor:pointer;border:1.5px solid transparent;}
.method.active{border-color:#FAE59F;background:rgba(250,229,159,0.06);}
.method svg{width:24px;height:24px;stroke:#FAE59F;fill:none;stroke-width:2;}

.input-box{margin:14px 16px;background:#202024;border-radius:16px;padding:16px;border:1px solid rgba(255,255,255,0.06);}
.amt-input{display:flex;align-items:center;background:#141416;border-radius:12px;padding:12px 14px;margin-bottom:14px;border:1.5px solid rgba(255,255,255,0.08);}
.amt-input span{font-size:18px;color:#FAE59F;margin-right:10px;font-weight:800;}
.amt-input input{flex:1;background:transparent;border:none;color:#fff;font-size:16px;font-weight:700;outline:none;}
.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:12px;color:#8f929b;}
.row span:last-child{color:#FAE59F;font-weight:700;}
.all-btn{background:transparent;border:1px solid #FAE59F;color:#FAE59F;padding:3px 12px;border-radius:16px;font-size:11px;font-weight:700;cursor:pointer;}

.btn-withdraw{width:100%;height:46px;border-radius:23px;background:linear-gradient(180deg,#FFE793 0%,#C48E2F 100%);color:#291a03;font-size:14px;font-weight:900;border:none;margin-top:14px;cursor:pointer;letter-spacing:0.5px;}
.btn-withdraw:disabled{background:#383838;color:#777;cursor:not-allowed;}

.rules{margin:14px 16px;border:1px solid rgba(255,255,255,0.06);background:#202024;border-radius:14px;padding:14px;}
.rules p{font-size:11px;color:#8f929b;line-height:1.7;margin-bottom:4px;}
.rules .red{color:#ff4d4f;font-weight:700;}

.toast{position:fixed;top:30%;left:50%;transform:translateX(-50%) translateY(-10px);background:rgba(20,20,22,0.96);border:1px solid rgba(250,229,159,0.3);color:#fff;font-size:13px;font-weight:600;padding:10px 20px;border-radius:10px;opacity:0;pointer-events:none;transition:all .25s ease;z-index:9999;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="navbar">
  <div class="nav-left" onclick="location.href='wallet.html'"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></div>
  <div class="nav-title">Withdraw</div>
  <div class="nav-right" onclick="location.href='withdraw-history.html'">History</div>
</div>

<div class="banner">
  <div class="label">Available balance</div>
  <div class="amt"><span id="availBal">₹0.00</span> <svg viewBox="0 0 24 24" onclick="location.reload()"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg></div>
</div>

<div class="section-title">Payment Method</div>
<div class="methods">
  <div class="method active">
    <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg> UPI
  </div>
</div>

<div class="input-box">
  <div class="amt-input">
    <span>₹</span>
    <input type="number" id="amtInput" placeholder="Enter withdrawal amount" oninput="checkAmt()">
  </div>
  <div class="amt-input" style="margin-bottom:12px;">
    <input type="text" id="upiInput" placeholder="Enter UPI ID (e.g. mobile@upi)" style="width:100%;font-size:13px;">
  </div>
  <div class="row">
    <span>Withdrawable: ₹<span id="wdBal">0.00</span></span>
    <button class="all-btn" onclick="setAll()">All</button>
  </div>
  <div class="row">
    <span>Received Amount:</span>
    <span id="recvAmt" style="font-family:'Orbitron',sans-serif;">₹0.00</span>
  </div>
  <button class="btn-withdraw" id="wdBtn" disabled onclick="submitWithdraw()">Withdraw</button>
</div>

<div class="rules">
  <p>Withdrawal range: <span class="red">₹110.00 - ₹50,000.00</span></p>
  <p>Service fee: <span class="red">0%</span></p>
  <p>Please double check UPI ID before submitting.</p>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, addDoc, collection, serverTimestamp, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAVQh9b7L3IYgWFIYA3wWorVBk1uXRFDZo",
  authDomain: "bdglottery7.firebaseapp.com",
  projectId: "bdglottery7",
  storageBucket: "bdglottery7.firebasestorage.app",
  messagingSenderId: "568771943906",
  appId: "1:568771943906:web:5b78078d9c0d67427dedbb"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const toastEl = document.getElementById('toast');
window.toast = (msg) => {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(()=>toastEl.classList.remove('show'), 2200);
};

let currentUser = null;
let userBalance = 0;
const MIN_WD = 110;

onAuthStateChanged(auth, async (user) => {
  if(!user) return location.replace('index.html');
  currentUser = user;
  
  const snap = await getDoc(doc(db,'users',user.uid));
  if(snap.exists()) {
    userBalance = Number(snap.data().balance || 0);
    document.getElementById('availBal').textContent = '₹' + userBalance.toFixed(2);
    document.getElementById('wdBal').textContent = userBalance.toFixed(2);
  }
});

window.checkAmt = function() {
  const val = parseFloat(document.getElementById('amtInput').value) || 0;
  const btn = document.getElementById('wdBtn');
  document.getElementById('recvAmt').textContent = '₹' + val.toFixed(2);
  btn.disabled = !(val >= MIN_WD && val <= userBalance);
};

window.setAll = function() {
  document.getElementById('amtInput').value = userBalance;
  checkAmt();
};

window.submitWithdraw = async function() {
  const amt = parseFloat(document.getElementById('amtInput').value);
  const upiId = document.getElementById('upiInput').value.trim();
  
  if(amt < MIN_WD) return toast(`Min withdraw is ₹${MIN_WD}`);
  if(amt > userBalance) return toast('Insufficient balance');
  if(!upiId || !upiId.includes('@')) return toast('Enter valid UPI ID');
  
  const btn = document.getElementById('wdBtn');
  btn.disabled = true;
  btn.innerText = 'Processing...';

  try {
    const orderId = 'WD' + Date.now();
    
    // 1. Deduct balance immediately
    await updateDoc(doc(db, 'users', currentUser.uid), {
      balance: increment(-amt)
    });

    // 2. Add withdrawal record
    await addDoc(collection(db, 'withdrawals'), {
      userId: currentUser.uid,
      orderId: orderId,
      amount: amt,
      upiId: upiId,
      status: 'pending',
      createdAt: serverTimestamp()
    });

    // 3. Add transaction record
    await addDoc(collection(db, 'transactions'), {
      userId: currentUser.uid,
      type: 'withdraw',
      title: 'Withdrawal Pending',
      amount: -amt,
      status: 'pending',
      createdAt: serverTimestamp()
    });

    toast('Withdrawal request submitted!');
    setTimeout(() => location.href = 'withdraw-history.html', 1200);
    
  } catch(err) {
    toast('Withdrawal failed. Try again.');
    btn.disabled = false;
    btn.innerText = 'Withdraw';
  }
};
</script>
</body>
</html>
